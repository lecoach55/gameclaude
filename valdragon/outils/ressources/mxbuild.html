<script type="module">
import * as THREE from 'three';import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';

const J=await (await fetch(`/src_assets/mx/${dir}/model.json`)).json();const cl=s=>s&&s.split('\u0000')[0];

// os
const bones={},list=[];J.bones.forEach(b=>{const o=new THREE.Bone();o.name=cl(b.name).replace('mixamorig:','mixamorig');bones[cl(b.name)]=o;o.userData.bind=b.bind?M(b.bind):null;list.push([o,b]);});

list.forEach(([o,b])=>{const p=b.parent&&bones[cl(b.parent)];(p||root).add(o);});

// textures (réduites, en JPEG)
async function tex(name,srgb){const im=new Image();im.src=`/src_assets/mx/${dir}/${name}`;await im.decode();const c=document.createElement('canvas');const w=Math.min(TS,im.width);c.width=c.height=w;c.getContext('2d').drawImage(im,0,0,w,w);
 const t=new THREE.CanvasTexture(c);t.flipY=false;t.userData.mimeType='image/jpeg';if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.name=name;return t;}
const TC={},MC={};const gt=async(n,srgb)=>TC[n]||(TC[n]=await tex(n,srgb));
async function matFor(list){const dn=list.find(n=>!/nm|normal|spec|emiss|transparent/i.test(n)),nn=list.find(n=>/(^|_)nm|normal/i.test(n));const k=dn+'|'+nn;if(MC[k])return MC[k];
 const m=new THREE.MeshStandardMaterial({map:dn?await gt(dn,1):null,normalMap:nn?await gt(nn):null,roughness:.8});m.name=(dn||'mat').replace(/\..*/,'');return MC[k]=m;}
const info=[];
for(const m of J.meshes){const mat=await matFor(m.tex||J.textures);const g=new THREE.BufferGeometry();const n=m.pos.length/3;g.setAttribute('position',new THREE.Float32BufferAttribute(m.pos.map(v=>v*S),3));
 if(m.nor.length)g.setAttribute('normal',new THREE.Float32BufferAttribute(m.nor,3));if(m.uv.length){const uv=m.uv.slice();for(let i=1;i<uv.length;i+=2)uv[i]=1-uv[i];g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));}
 const si=new Uint16Array(n*4),sw=new Float32Array(m.w);m.skin.forEach((s,i)=>s.forEach((b,k)=>{si[i*4+k]=b?bIdx.get(cl(b))??0:0;}));
 g.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(si,4));g.setAttribute('skinWeight',new THREE.Float32BufferAttribute(sw,4));
 g.computeBoundingBox();const bb=g.boundingBox;const sz=bb.getSize(new THREE.Vector3());
 const sm=new THREE.SkinnedMesh(g,mat);sm.name=cl(m.name)+'_'+n;sm.bind(skel,new THREE.Matrix4());root.add(sm);info.push([sm.name,n,sz.toArray().map(v=>+v.toFixed(2)),mat.name]);}
window.INFO={info,bones:bArr.length,names:bArr.slice(0,8).map(b=>b.name)};

const u8=new Uint8Array(glb);let s='';for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));window.GLB=btoa(s);document.title='done';
</script></body></html>
