*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#e8dcc4;font-family:'Alegreya Sans',sans-serif;touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
:root{--gold:#d8b25a;--gold2:#8a6a2a}
.hide{display:none!important}
/* exploration */
#top{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
#info{font-size:13px;text-shadow:0 1px 3px #000,0 0 6px #000}
#flr{font-family:Cinzel,serif;font-size:15px;color:#f0c46a}
#bio{font-size:12px;color:#b9a888;font-style:italic}

#xpw i{display:block;height:100%;background:linear-gradient(90deg,#8a6a1a,#f0c46a,#fff2b0);box-shadow:0 0 6px #f0c46a}
#bless{margin-top:4px;font-size:12px;color:#c9b4ff}
#mini{width:118px;height:118px;border-radius:50%;border:2px solid var(--gold2);box-shadow:0 0 0 2px #000,0 0 14px #000;background:#000}
