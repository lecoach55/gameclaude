<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Le Trône de Braise</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--or:#d9b45a;--or2:#f1d88e;--sang:#8e1b1b;--encre:#1a120a;--parch:#e9dcbc;--parch2:#d6c49b;--fond:#0e0b09;--panneau:rgba(22,16,12,.94);--bord:#5a4426}
html,body{height:100%;background:var(--fond);color:#eadfc8;font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.ecran{position:fixed;inset:0;display:none}
.ecran.on{display:block}
/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.55em 1.1em;border:1px solid var(--bord);background:linear-gradient(#3a2a1a,#22180f);color:var(--or2);border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,220,150,.15),0 2px 6px rgba(0,0,0,.5);font-size:15px;letter-spacing:.02em;transition:filter .12s,transform .05s}
.btn:hover{filter:brightness(1.25)}.btn:active{transform:translateY(1px)}
.btn[disabled],.btn.off{opacity:.38;cursor:not-allowed;filter:grayscale(.6)}
.btn.or{background:linear-gradient(#a8802f,#6b4c18);color:#fff7dc;border-color:#e0bd68;text-shadow:0 1px 1px #000}
.btn.rouge{background:linear-gradient(#8e2a1b,#55140c);border-color:#c0503a;color:#ffe6d6}
.btn.petit{padding:.32em .7em;font-size:13px}
.btn.large{width:100%}
/* ---------- accueil ---------- */
#accueil{background:radial-gradient(ellipse at 50% 70%,#3a1a0a 0%,#120a06 55%,#050302 100%)}
#braises{position:absolute;inset:0;width:100%;height:100%}
.titre-bloc{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;width:min(92vw,620px)}
.titre-bloc h1{font-size:clamp(38px,8vw,74px);font-weight:400;letter-spacing:.06em;color:#f3d48a;text-shadow:0 0 22px rgba(255,120,30,.55),0 3px 0 #3a1a08;font-variant:small-caps}
.titre-bloc .sous{margin:.3em 0 1.6em;color:#c9a978;font-style:italic;font-size:clamp(14px,2.4vw,19px)}
.menu-acc{display:flex;flex-direction:column;gap:10px;align-items:center}
.menu-acc .btn{width:min(320px,80vw);font-size:17px;padding:.7em}
.credits{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#7a6a55}
/* ---------- création ---------- */
#creation{background:#0f0b08 radial-gradient(ellipse at top,#2a1c10,#0b0806);overflow:auto}
.crea{max-width:920px;margin:0 auto;padding:22px 16px 60px}
.crea h2{text-align:center;color:var(--or2);font-weight:400;font-size:30px;margin:6px 0 18px;font-variant:small-caps}
.crea .ligne{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.crea label{font-size:14px;color:#c9b38a}
.crea input[type=text]{font:inherit;font-size:17px;background:#1c140d;color:#f3e3c0;border:1px solid var(--bord);border-radius:4px;padding:.45em .7em;width:200px}
.choix{display:flex;gap:8px}.choix button{padding:.45em .9em;border:1px solid var(--bord);border-radius:4px;background:#1c140d}.choix button.sel{background:#5a3a14;border-color:var(--or);color:#fff3c8}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.carte-classe{border:1px solid var(--bord);border-radius:6px;background:linear-gradient(#21170f,#140e09);padding:14px;text-align:center;cursor:pointer;transition:transform .12s,border-color .12s}
.carte-classe:hover{transform:translateY(-3px)}.carte-classe.sel{border-color:var(--or);box-shadow:0 0 18px rgba(217,180,90,.35)}
.carte-classe canvas{width:120px;height:120px}
.carte-classe h3{color:var(--or2);font-weight:400;font-size:22px;margin:4px 0}
.carte-classe p{font-size:13.5px;color:#bfae8e;line-height:1.4}
.carte-classe .comp{font-size:12px;color:#9a8a6e;margin-top:8px}
/* ---------- royaume ---------- */
#royaume{background:#141b20}
#carte{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.barre{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:6px 12px;background:linear-gradient(rgba(14,10,7,.95),rgba(14,10,7,.8));border-bottom:1px solid var(--bord);font-size:15px;z-index:5;flex-wrap:wrap}
.barre .maison{display:flex;align-items:center;gap:8px;font-variant:small-caps;font-size:18px;color:var(--or2)}
.res{display:flex;align-items:center;gap:4px;white-space:nowrap}.res b{color:#fff3d0}
.barre .esp{flex:1}
.saison{color:#e8cf95;font-style:italic}
.ordres{display:flex;gap:3px;align-items:center}.ordres i{width:13px;height:13px;border-radius:50%;background:#e0b448;box-shadow:0 0 6px #e0b448;display:inline-block}.ordres i.vide{background:#3a2c1c;box-shadow:none}
#panneau{position:absolute;right:10px;top:58px;width:330px;max-height:calc(100% - 140px);overflow:auto;background:var(--panneau);border:1px solid var(--bord);border-radius:6px;padding:12px;z-index:4;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#panneau:empty{display:none}
#panneau h3{font-weight:400;font-size:22px;color:var(--or2);display:flex;align-items:center;gap:8px}
#panneau .info{font-size:13.5px;color:#c9b8a0;margin:6px 0;line-height:1.45}
#panneau .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
#panneau .acts .btn{font-size:13px;padding:.5em .4em}
.jauge{height:7px;background:#2a1e14;border-radius:4px;overflow:hidden;margin:3px 0}.jauge i{display:block;height:100%;background:linear-gradient(90deg,#b8402a,#e0b448,#6bbf5a)}
.bas-g{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;max-width:calc(100% - 200px)}
.bas-g .btn{padding:.5em .75em}
#finSaison{position:absolute;right:12px;bottom:12px;z-index:5;font-size:17px;padding:.75em 1.3em}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(20,14,9,.95);border:1px solid var(--or);color:#fff0c8;padding:8px 16px;border-radius:5px;z-index:60;font-size:15px;pointer-events:none;transition:opacity .4s;max-width:90vw;text-align:center}
/* ---------- fenêtres ---------- */
#voile{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:none;align-items:center;justify-content:center;padding:12px}
#voile.on{display:flex}
.fenetre{background:linear-gradient(#2a1f15,#1a130d);border:1px solid #6e5430;border-radius:7px;max-width:min(720px,96vw);width:100%;max-height:92vh;overflow:auto;box-shadow:0 10px 50px rgba(0,0,0,.8),inset 0 0 0 4px rgba(0,0,0,.25);position:relative}
.fenetre.large{max-width:min(1000px,98vw)}
.fenetre .tete{padding:14px 18px 8px;border-bottom:1px solid #4a3820;display:flex;align-items:center;gap:10px}
.fenetre .tete h2{font-weight:400;color:var(--or2);font-size:24px;font-variant:small-caps;flex:1}
.fenetre .corps{padding:14px 18px;font-size:15.5px;line-height:1.55;color:#e2d4b8}
.fenetre .corps p{margin:.4em 0;white-space:pre-line}
.fenetre .pied{padding:10px 18px 16px;display:flex;flex-direction:column;gap:7px}
.fenetre .pied .btn{justify-content:flex-start;text-align:left;font-size:14.5px}
.fermer{position:absolute;right:8px;top:6px;font-size:22px;color:#a89070;padding:4px 8px}
.illus{height:120px;border-radius:5px;margin-bottom:10px;background-size:cover;background-position:center;border:1px solid #4a3820}
.resultat{background:rgba(217,180,90,.1);border-left:3px solid var(--or);padding:8px 12px;margin:10px 0;font-style:italic}
/* ---------- dés ---------- */
.des{display:flex;gap:6px;justify-content:center;margin:4px 0}
.de{width:30px;height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:17px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.de.a{background:#b8342a;color:#fff}.de.d{background:#eae2d0;color:#222}.de.perdu{opacity:.35}
.manche{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);animation:apparait .3s}
@keyframes apparait{from{opacity:0;transform:translateY(-4px)}}
.armees{display:flex;justify-content:space-around;text-align:center;margin:8px 0;font-size:15px}.armees b{font-size:28px;display:block;color:#fff}
/* ---------- armurerie ---------- */
.arm{display:grid;grid-template-columns:270px 1fr;gap:14px}
@media(max-width:700px){.arm{grid-template-columns:1fr}}
.poupee{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.case{aspect-ratio:1;border:1px solid #4a3820;background:#140e09;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;cursor:pointer}
.case small{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:#8a7a60}
.case.r-magique{border-color:#4a7ad0;box-shadow:inset 0 0 10px rgba(80,140,255,.35)}.case.r-rare{border-color:#d8b030;box-shadow:inset 0 0 10px rgba(255,210,60,.35)}.case.r-legendaire{border-color:#ff8a2a;box-shadow:inset 0 0 14px rgba(255,130,40,.55)}
.case.sel{outline:2px solid #fff}
.case .nv{position:absolute;top:1px;right:3px;font-size:9px;color:#aaa}
.sac{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:5px;max-height:330px;overflow:auto;padding:2px}
.fiche{background:#120d08;border:1px solid #4a3820;border-radius:5px;padding:10px;margin-top:10px;font-size:13.5px;line-height:1.5}
.fiche h4{font-weight:400;font-size:17px}
.legtxt{color:#ffb070}
.mieux{color:#7fd07f}.pire{color:#e07a6a}
.stats{font-size:13px;color:#c9b8a0;columns:2;margin-top:8px}
.comps{display:grid;gap:8px}
.compl{display:flex;gap:10px;align-items:center;background:#140e09;border:1px solid #3a2c1c;border-radius:5px;padding:8px}
.compl .ic{font-size:26px;width:40px;text-align:center}.compl .tx{flex:1;font-size:13.5px}.compl b{color:var(--or2)}
/* ---------- donjon ---------- */
#donjon{background:#000;cursor:crosshair}
#jeu{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none}
.orbe{position:absolute;bottom:12px;width:94px;height:94px;border-radius:50%;border:3px solid #6e5430;background:#100808;overflow:hidden;box-shadow:0 0 18px rgba(0,0,0,.8),inset 0 0 14px #000}
.orbe i{position:absolute;left:0;right:0;bottom:0;transition:height .1s}
.orbe.vie{left:12px}.orbe.vie i{background:radial-gradient(circle at 40% 30%,#ff7a6a,#a0100c 60%,#4a0404)}
.orbe.mana{right:12px}.orbe.mana i{background:radial-gradient(circle at 40% 30%,#8ab8ff,#1a3aa0 60%,#08104a)}
.orbe span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;text-shadow:0 1px 2px #000;z-index:2}
.orbe:after{content:"";position:absolute;left:18%;top:10%;width:40%;height:25%;border-radius:50%;background:rgba(255,255,255,.18);z-index:3}
.barre-comp{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
.cp{width:54px;height:54px;border:2px solid #6e5430;border-radius:6px;background:#1a120c;position:relative;display:flex;align-items:center;justify-content:center;font-size:24px}
.cp .k{position:absolute;top:1px;left:4px;font-size:10px;color:#d8c8a0}
.cp .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.72)}
.cp .m{position:absolute;bottom:1px;right:3px;font-size:10px;color:#8ab8ff}
.cp.verr{opacity:.3}
.cp.pot .n{position:absolute;bottom:1px;right:4px;font-size:12px;color:#fff}
.xp{position:absolute;bottom:4px;left:120px;right:120px;height:5px;background:#1a1208;border:1px solid #3a2c1c}.xp i{display:block;height:100%;background:linear-gradient(90deg,#b08a2a,#ffe08a)}
.bossbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(520px,70vw);text-align:center;display:none}
.bossbar.on{display:block}
.bossbar .nm{font-size:18px;color:#ffd0a0;text-shadow:0 1px 3px #000;font-variant:small-caps;letter-spacing:.05em}
.bossbar .j{height:14px;background:#200808;border:1px solid #8a3020;border-radius:3px;overflow:hidden}.bossbar .j i{display:block;height:100%;background:linear-gradient(#e04a2a,#8a1a0a)}
#minicarte{position:absolute;right:10px;top:10px;width:150px;height:150px;opacity:.85;border:1px solid #3a2c1c;background:rgba(0,0,0,.4)}
.lieu{position:absolute;left:12px;top:10px;font-size:15px;color:#e8d6a8;text-shadow:0 1px 3px #000}
.lieu small{display:block;font-size:12px;color:#a89070}
.msg{position:absolute;top:26%;left:0;right:0;text-align:center;font-size:clamp(18px,3vw,28px);color:#ffe7b0;text-shadow:0 2px 6px #000,0 0 14px rgba(255,140,40,.6);font-variant:small-caps;transition:opacity .4s}
.action{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);pointer-events:auto;display:none}
.action.on{display:block}
.btns-d{position:absolute;top:44px;left:12px;display:flex;flex-direction:column;gap:5px;pointer-events:auto}
.btns-d .btn{padding:.3em .55em;font-size:13px;opacity:.8}
/* tactile */
.tactile{display:none}
body.tact .tactile{display:block}
#joy{position:absolute;left:30px;bottom:130px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.15);pointer-events:auto}
#joy i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,230,180,.3)}
#attq{position:absolute;right:30px;bottom:130px;width:84px;height:84px;border-radius:50%;background:rgba(200,60,40,.35);border:2px solid rgba(255,160,120,.5);pointer-events:auto;font-size:30px}
body.tact .orbe{width:70px;height:70px}
body.tact .cp{width:48px;height:48px}
body.tact .barre-comp{bottom:92px}
body.tact #minicarte{width:110px;height:110px}
/* chronique, dynastie */
.chron{max-height:60vh;overflow:auto;font-size:14px}
.chron div{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.chron .d{color:#a8906a;font-style:italic;margin-right:6px}
.t-guerre,.t-bataille{color:#f0a090}.t-famille{color:#f0c8e0}.t-exploit{color:#ffd88a}.t-regne{color:#fff0b8}.t-mort{color:#b0b0b0}.t-alerte{color:#ff8a6a}.t-paix{color:#a8e0a8}
.arbre{display:flex;flex-direction:column;gap:6px}
.perso{display:flex;gap:10px;align-items:center;background:#140e09;border:1px solid #3a2c1c;border-radius:5px;padding:8px}
.perso .av{font-size:28px}
.maisons{display:grid;gap:8px}
.mais{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:#140e09;border:1px solid #3a2c1c;border-radius:5px;padding:8px}
.mais .acts{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.rel{font-size:12.5px;color:#bba}
.etiq{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;margin-left:4px}.etiq.g{background:#6a1a10}.etiq.a{background:#1f5a2a}.etiq.p{background:#3a3a3a}
@media(max-width:760px){#panneau{left:6px;right:6px;width:auto;top:auto;bottom:66px;max-height:46vh}.bas-g{max-width:none;bottom:auto;top:52px}.barre{font-size:13px;gap:8px}.barre .maison{font-size:15px}}

.bonus{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.bonus span{background:rgba(10,8,6,.8);border:1px solid #6e5430;border-radius:12px;padding:2px 8px;font-size:12.5px;color:#f0e0c0}
body.tact .bonus{bottom:150px}
.tip{position:absolute;display:none;width:260px;background:rgba(14,10,7,.95);border:1px solid #6e5430;border-radius:5px;padding:8px 10px;font-size:13px;line-height:1.45;pointer-events:none;z-index:6}
#objectif{position:absolute;left:10px;top:56px;z-index:4;max-width:min(420px,60vw);background:rgba(20,14,9,.88);border:1px solid #8a6a30;border-radius:6px;padding:7px 11px;font-size:13.5px;line-height:1.35;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.5)}
#objectif b{display:block;color:var(--or2);font-weight:400;font-size:12.5px;letter-spacing:.03em}
#objectif.replie span{display:none}
#nouvelles{position:absolute;left:10px;bottom:62px;z-index:4;max-width:min(360px,70vw);background:rgba(20,14,9,.9);border:1px solid #5a4426;border-radius:6px;padding:8px 12px;font-size:13px;line-height:1.45;transition:opacity .8s;pointer-events:none}
#nouvelles b{color:var(--or2);font-weight:400}
@media(max-width:760px){#objectif{top:auto;bottom:118px;max-width:calc(100% - 20px);font-size:12.5px}#nouvelles{bottom:auto;top:96px}}
.niv{position:absolute;bottom:12px;left:50%;transform:translate(-50%,0);font-size:11px;color:#d8c8a0;text-shadow:0 1px 2px #000;margin-left:-190px}
body.tact .niv{display:none}
#infoProv{position:absolute;z-index:6;pointer-events:none;background:rgba(14,10,7,.92);border:1px solid #6e5430;border-radius:5px;padding:6px 10px;font-size:12.5px;line-height:1.4;display:none;max-width:240px}

</style>
</head>
<body>
<!-- accueil -->
<section id="accueil" class="ecran on">
 <canvas id="braises"></canvas>
 <div class="titre-bloc">
  <h1>Le Trône de Braise</h1>
  <div class="sous">Fondez une dynastie, purgez les cryptes, prenez la couronne.</div>
  <div class="menu-acc">
   <button class="btn or" id="bContinuer" style="display:none">▶ Continuer la partie</button>
   <button class="btn" id="bNouvelle">⚔ Nouvelle partie</button>
   <button class="btn" id="bAide">📖 Comment jouer</button>
   <button class="btn petit" id="bTest">🧪 Mode test</button>
  </div>
 </div>
 <div class="credits">Un jeu créé pour Victor · musique et sons générés en direct · aucune connexion nécessaire</div>
</section>
<!-- création -->
<section id="creation" class="ecran">
 <div class="crea">
  <h2>Votre lignée</h2>
  <div class="ligne"><label>Nom de votre héros<br><input type="text" id="cNom" maxlength="18" value="Émeric"></label><label>Nom de votre maison<br><input type="text" id="cMaison" maxlength="18" value="Aubrac"></label></div>
  <div class="ligne"><div class="choix" id="cSexe"><button data-v="h" class="sel">Sire</button><button data-v="f">Dame</button></div></div>
  <div class="classes" id="cClasses"></div>
  <div class="ligne"><span style="align-self:center;font-size:14px;color:#c9b38a">Difficulté</span><div class="choix" id="cDif"><button data-v="facile">Clémente</button><button data-v="normale" class="sel">Normale</button><button data-v="difficile">Impitoyable</button></div></div>
  <div class="ligne"><span style="align-self:center;font-size:14px;color:#c9b38a">Chute au combat</span><div class="choix" id="cMort"><button data-v="0" class="sel">Blessure grave</button><button data-v="1">Mort réelle (l’héritier prend la suite)</button></div></div>
  <div class="ligne"><button class="btn" id="cRetour">← Retour</button><button class="btn or" id="cGo" style="font-size:18px;padding:.7em 2em">Prendre le gouvernement</button></div>
 </div>
</section>
<!-- royaume -->
<section id="royaume" class="ecran">
 <canvas id="carte"></canvas>
 <div class="barre" id="barre"></div>
 <div id="panneau"></div>
 <div class="bas-g">
  <button class="btn" id="bDyn">👑 Dynastie</button>
  <button class="btn" id="bArm">🛡️ Armurerie</button>
  <button class="btn" id="bMais">🤝 Maisons</button>
  <button class="btn" id="bChron">📜 Chronique</button>
  <button class="btn" id="bMenu">☰</button>
 </div>
 <button class="btn or" id="finSaison">⏳ Fin de la saison</button>
</section>
<!-- donjon -->
<section id="donjon" class="ecran">
 <canvas id="jeu"></canvas>
 <div class="hud">
  <div class="lieu" id="hLieu"></div>
  <canvas id="minicarte" width="150" height="150"></canvas>
  <div class="bossbar" id="hBoss"><div class="nm"></div><div class="j"><i></i></div></div>
  <div class="msg" id="hMsg"></div>
  <div class="bonus" id="hBonus"></div>

/* monde.js */
'use strict';
/* =========================================================
   Monde : géographie de la carte (raster déterministe) et voisinages
   ========================================================= */
const MONDE = (() => {
 const W = 250, H = 170, K = 4; // carte 1000 × 680
 const rng = seeded(41207);
 const perm = new Uint8Array(512); { const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
 const h2 = (x, y) => perm[(perm[x & 255] + y) & 255] / 255;
 const sm = t => t * t * (3 - 2 * t);
 function bruit(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = sm(x - xi), yf = sm(y - yi); const a = h2(xi, yi), b = h2(xi + 1, yi), c = h2(xi, yi + 1), d = h2(xi + 1, yi + 1); return a + (b - a) * xf + (c - a) * yf + (a - b - c + d) * xf * yf; }
 function fbm(x, y) { return bruit(x, y) * .55 + bruit(x * 2.1, y * 2.1) * .3 + bruit(x * 4.3, y * 4.3) * .15; }
 const P = PROVINCES, N = P.length, idx = {}; P.forEach((p, i) => idx[p.id] = i);
 const grille = new Int8Array(W * H).fill(-1), relief = new Float32Array(W * H);
 for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const wx = x * K, wy = y * K;
  const ox = (fbm(wx / 90, wy / 90) - .5) * 70, oy = (fbm(wx / 90 + 30, wy / 90 + 17) - .5) * 70;
  let best = -1, bd = 1e9, second = 1e9;
  for (let i = 0; i < N; i++) { const d = Math.hypot(wx + ox - P[i].x, wy + oy - P[i].y); if (d < bd) { second = bd; bd = d; best = i; } else if (d < second) second = d; }
  const cote = 66 + fbm(wx / 60 + 5, wy / 60 + 9) * 62;
  const bord = Math.min(wx, wy, 1000 - wx, 680 - wy);
  relief[y * W + x] = fbm(wx / 40 + 3, wy / 40 + 1);
  if (bd < cote && bord > 18) grille[y * W + x] = best;

 const adj = P.map(() => new Set());
 for (let y = 0; y < H - 1; y++) for (let x = 0; x < W - 1; x++) {
  const a = grille[y * W + x]; if (a < 0) continue;
  for (const b of [grille[y * W + x + 1], grille[(y + 1) * W + x]]) if (b >= 0 && b !== a) { adj[a].add(b); adj[b].add(a); }

 const voisins = adj.map(s => [...s].map(i => P[i].id));
 return { W, H, K, grille, relief, voisins, idx, fbm };
})();

function capaciteBoss(A, m, dt, d) {

 const telegraphe = (x, y, r, t, dg, k) => A.zones.push({ x, y, r, t: -t, tmax: .05, dg, k, src: m });

  if (m.cdS[0] <= 0) { m.cdS[0] = 5.5; const n = m.phase === 2 ? 12 : 9; for (let i = 0; i < n; i++) { const a = i / n * 6.283 + m.anim; A.projs.push({ x: m.x, y: m.y, vx: Math.cos(a) * 4.5, vy: Math.sin(a) * 4.5, r: .2, ami: false, dg: m.dg * .5, vie: 3, k: 'givre', gel: true, src: m, touches: [] }); } SON('givre'); m.wind = .4; return true; }

}

/* ---------- Robot joueur (tests automatiques et équilibrage) ---------- */
function botEntree(A) {

  return inp;
 }
 // ramasser, sinon aller vers l'objectif
 let l = null; bd = 1e9; for (const o of A.autels || []) { if (o.pris) continue; const d = Math.hypot(o.x - P.x, o.y - P.y); if (d < bd && d < 12) { bd = d; l = o; } }
 for (const o of A.loot) { if (o.ign > A.t || o.potion && P.potions >= 5 || o.globe && P.pv > P.S.pvmax * .8) continue; const d = Math.hypot(o.x - P.x, o.y - P.y); if (d < bd && d < 10) { bd = d; l = o; } }
 let cx, cy;
 if (l) { if (A.botLoot !== l) { A.botLoot = l; A.botLootT = A.t; } else if (A.t - A.botLootT > 6) l.ign = A.t + 60; cx = Math.floor(l.x) + .5; cy = Math.floor(l.y) + .5; }
 else if (A.portail) { cx = A.portail.x; cy = A.portail.y; }

   else if (vivantsLoin.length) { let b = null, bdd = 1e9; for (const m of vivantsLoin) { const d = Math.hypot(m.x - P.x, m.y - P.y); if (d < bdd) { bdd = d; b = m; } } A.botBut = { x: b.x, y: b.y }; }
   else A.botBut = { x: fin.cx + .5, y: fin.cy + .5 };
  }

 // chemin : descente du champ de distances calculé depuis le but
 if (!A.botFlow || A.botFlowBut !== cx + ',' + cy) { A.botFlow = bfs(A.carte.t, A.W, A.H, cx | 0, cy | 0, 999); A.botFlowBut = cx + ',' + cy; }

<script>
/* royaume.js */
'use strict';
/* =========================================================

const COUTS = { recruter: 30, marche: 60, caserne: 50, temple: 50, fortifier: 80, festin: 40, presents: 50 };

function nomAuHasard(sexe) { return pick(sexe === 'f' ? PRENOMS_F : PRENOMS_H); }

}
function titre(G) { return G.joueur.heros.sexe === 'f' ? 'Dame' : 'Sire'; }

 { t: 'Purger un donjon (la crypte de Val-Sombre est la plus facile)', ok: G => G.stats.donjons >= 1, r: G => { G.maisons.joueur.or += 60; return '+60 or'; } },
 { t: 'Dépenser un point de compétence ou de talent (🛡️ Armurerie → ✦)', ok: G => G.joueur.heros.points === 0 && G.joueur.heros.niveau >= 2, r: G => { G.joueur.heros.potions = Math.max(G.joueur.heros.potions, 5); return 'Ceinture de 5 potions'; } },

 { t: 'Vaincre trois maîtres de donjon', ok: G => G.stats.donjons >= 3, r: G => { G.joueur.inventaire.push(genObjet(G.joueur.heros.niveau + 2, G.joueur.heros.classe, { rarete: 'legendaire' })); return 'Un objet légendaire !'; } },

 { t: 'Descendre au palier 5 de la Faille de Braise', ok: G => G.faille.record >= 5, r: G => { G.joueur.inventaire.push(genObjet(G.joueur.heros.niveau + 4, G.joueur.heros.classe, { rarete: 'legendaire' })); return 'Un objet légendaire !'; } },
];
function objectifActuel(G) { return OBJECTIFS[G.objectifs.n] || null; }
// renvoie le texte de récompense si l'objectif courant vient d'être atteint
function verifierObjectif(G) {

 // vieillissement, naissances
 const Jo = G.joueur;
 if (Jo.blesse > 0) Jo.blesse--;
 if (G.saison === 3) {
  Jo.age++; if (Jo.conjoint) Jo.conjoint.age++; for (const e of Jo.enfants) e.age++;
  if (Jo.regence > 0) Jo.regence--;
  for (const e of Jo.enfants) if (e.classe && e.age >= 6 && (e.formation || 0) < 10) e.formation = (e.formation || 0) + 1;
  for (const id of IA_MAISONS) { const M = G.maisons[id]; if (M.elim) continue; M.chef.age++; if (M.heritier) M.heritier.age++; if (M.chef.age > 55 && chance((M.chef.age - 55) * .02)) { if (M.chef.roi) G.evts.push({ id: 'mort_roi' }); else if (chance(.5)) noter(G, `${M.chef.nom} de la maison ${M.nom} est mort(e) de vieillesse.`, 'info'); successionIA(G, id); } }
 }
 if (Jo.conjoint && Jo.age < 50 && Jo.conjoint.age < 46 && Jo.enfants.length < 6 && chance(.14)) {
  const s = chance(.5) ? 'h' : 'f', e = { nom: nomAuHasard(s), sexe: s, age: 0 };
  if (Jo.enfants.some(x => x.nom === e.nom)) e.nom = nomAuHasard(s);
  Jo.enfants.push(e); noter(G, `Naissance de ${e.nom}, ${s === 'f' ? 'fille' : 'fils'} de ${Jo.heros.nom}.`, 'famille'); G.evts.push({ id: 'naissance', nom: e.nom, sexe: s });
 }
 // mort naturelle du souverain
 if (Jo.age >= 48 && chance((Jo.age - 46) * .0045)) { mortDuSouverain(G, 'emporté(e) par la maladie'); }
 // le vieux roi
 if (!G.roiMort && G.tour >= 3 && chance(G.tour >= 10 ? .25 : .07)) G.evts.push({ id: 'mort_roi' });
 // événements de la saison suivante
 tirerEvenements(G);
 // passage du temps
 G.saison = (G.saison + 1) % 4; if (G.saison === 0) G.an++; G.tour++;
 G.ordres = ordresMax(G); G.dejaBouge = {};
 J.prestige = Math.max(0, Math.round(J.prestige));
 verifierVictoire(G);
}
function verifierVictoire(G) {
 if (G.couronne) return;
 const mien = provincesDe(G, 'joueur');
 if (mien.some(p => p.capitale) && mien.length >= 10) {
  G.couronne = true; G.maisons.joueur.prestige += 50;
  noter(G, `${G.joueur.heros.nom} d’${G.maisons.joueur.nom} est couronné(e) sur le Trône de Braise !`, 'regne');
  G.evts.unshift({ id: 'couronnement' });
 }
}

/* ---------- IA des maisons ---------- */
function tourIA(G) {
 G.nouvelles = [];
 const ordre = shuffle(IA_MAISONS.slice());
 const dif = { facile: 1, normale: 1.35, difficile: 1.7 }[G.options.difficulte] || 1.35;
 for (const m of ordre) {
  const M = G.maisons[m]; if (M.elim) continue;
  const mes = provincesDe(G, m); if (!mes.length) { verifierElimination(G, m); continue; }
  M.or += Math.round(revenus(G, m) * dif) - entretien(G, m) + Math.round(10 * dif) + (m === 'draknor' ? 10 : 0);
  if (M.or < 0) { const q = mes.sort((a, b) => b.t - a.t)[0]; q.t = Math.max(1, q.t - Math.ceil(q.t * .15)); M.or = 0; }
  M.influence += 1;
  // menace par province
  const menace = p => voisinsDe(p.id).map(id => prov(G, id)).filter(q => q.o !== m && (enGuerre(G, m, q.o) || q.o === 'rebelles' || G.maisons[q.o] && G.maisons[q.o].rel[m] < -20)).reduce((s, q) => s + q.t, 0);
  // recrutement
  let n = 0; const cap = 16 + mes.length * 8;
  while (M.or >= 30 && troupesDe(G, m) < cap && n++ < 5) { const q = mes.slice().sort((a, b) => (menace(b) - b.t) - (menace(a) - a.t))[0]; q.t += 4 + (q.bat.caserne ? 2 : 0); M.or -= 30; }
  // constructions
  if (M.or > 110 && chance(.5)) { const q = pick(mes); const b = pick(['marche', 'caserne', 'temple', 'fortifier']); if (b === 'fortifier' && q.c < 3 && M.or >= 80 * (q.c + 1)) { M.or -= 80 * (q.c + 1); q.c++; } else if (b !== 'fortifier' && !q.bat[b]) { M.or -= 60; q.bat[b] = true; } }
  // coalition contre une maison trop puissante
  const nj = provincesDe(G, 'joueur').length; if (nj > 7 && !M.alliance.joueur) changeRel(G, m, 'joueur', -(nj - 7) * .7);
  // diplomatie
  for (const c in G.maisons) {
   if (c === m || G.maisons[c].elim || G.maisons[c].neutre) continue;
   const voisin = mes.some(p => voisinsDe(p.id).some(id => prov(G, id).o === c));
   if (voisin && chance(.3)) changeRel(G, m, c, -1);
   if (!voisin) M.rel[c] += (0 - M.rel[c]) * .05;
   const agress = M.trait === 'guerrier' ? 1.5 : M.trait === 'royal' && G.roiMort ? 1.3 : 1;
   if (!enGuerre(G, m, c) && !M.alliance[c] && voisin && M.rel[c] < -35 && chance(.12 * agress)) {
    declarerGuerre(G, m, c, c === 'joueur' ? 'votre voisin perd patience' : '');
    if (c === 'joueur') G.evts.push({ id: 'declaration', maison: m });
   }
   if (enGuerre(G, m, c) && M.rel[c] > -25 && chance(.15) && c !== 'joueur') faireLaPaix(G, m, c);
   if (enGuerre(G, m, c) && c === 'joueur' && troupesDe(G, m) < troupesDe(G, 'joueur') * .6 && chance(.2) && !G.evts.some(e => e.id === 'offre_paix')) G.evts.push({ id: 'offre_paix', maison: m });
   if (!enGuerre(G, m, c) && c === 'joueur' && M.rel[c] > 45 && !M.alliance[c] && chance(.08) && !G.evts.some(e => e.id === 'offre_alliance')) G.evts.push({ id: 'offre_alliance', maison: m });
  }
  // attaques
  const maxAtt = M.trait === 'guerrier' ? 2 : 1;
  let att = 0;
  const cibles = [];
  for (const p of mes) {
   if (p.t < 4) continue;
   for (const id of voisinsDe(p.id)) {
    const q = prov(G, id); if (q.o === m) continue;
    const hostile = enGuerre(G, m, q.o) || q.o === 'rebelles';
    if (!hostile) continue;
    if (q.o === 'joueur' && G.tour < 4) continue; // répit de début de partie
    if (q.o === 'rebelles' && G.tour < 8 && voisinsDe(q.id).some(id => prov(G, id).o === 'joueur')) continue; // laisser au joueur le temps de s'étendre
    const ratio = (p.t - 1) / (q.t + q.c * 1.5 + 1);
    if (ratio > 1.5) cibles.push({ p, q, ratio: ratio + (q.capitale ? .6 : 0) + (q.o === 'joueur' ? .2 : 0) });
   }
  }
  cibles.sort((a, b) => b.ratio - a.ratio);
  for (const c of cibles) {
   if (att >= maxAtt) break; if (c.p.o !== m || c.q.o === m || c.p.t < 4) continue;
   att++;
   const avant = c.q.o;
   const r = attaquer(G, c.p.id, c.q.id, { n: c.p.t - 1 - (menace(c.p) > c.p.t ? 2 : 0), prudent: true });
   G.nouvelles.push({ de: c.p.id, vers: c.q.id, m, avant, gagne: r.gagne });
   if (avant === 'joueur') G.evts.push({ id: 'attaque_subie', maison: m, prov: c.q.id, gagne: r.gagne, pa: r.pertesA, pd: r.pertesD });
  }
 }
}

/* ---------- Robot joueur (équilibrage du royaume) ---------- */
// force : probabilité de réussir une expédition selon le niveau du héros et du donjon
function chanceExpedition(G, niv) { const h = G.joueur.heros; const s = statsHeros(h, G.joueur.generation); const pui = h.niveau + s.dps / 25; return clamp(.5 + (pui - niv) * .09, .08, .95); }
function botRoyaume(G) {
 const J = G.maisons.joueur, mes = provincesDe(G, 'joueur');
 // résoudre les événements avec un choix au hasard parmi ceux disponibles
 let garde = 0;
 while (G.ordres > 0 && garde++ < 10) {
  const front = mes.filter(p => voisinsDe(p.id).some(id => prov(G, id).o !== 'joueur'));
  // attaque favorable
  let best = null, br = 0;
  for (const p of front) for (const id of voisinsDe(p.id)) { const q = prov(G, id); if (q.o === 'joueur' || G.maisons[q.o].alliance.joueur) continue; const r = (p.t - 1) / (q.t + q.c * 1.5 + 1); if (r > br) { br = r; best = [p, q]; } }
  if (best && br > 1.6) { act(G, 'attaquer', { prov: best[0].id, vers: best[1].id }); continue; }
  // expédition
  const dj = G.provinces.filter(p => (p.o === 'joueur' || voisinsDe(p.id).some(id => prov(G, id).o === 'joueur')) && !p.nettoye).sort((a, b) => a.dniv - b.dniv)[0];
  if (dj && !G.joueur.blesse && chanceExpedition(G, dj.dniv) > .55 && chance(.6)) {
   act(G, 'expedition', {}); const ok = chance(chanceExpedition(G, dj.dniv));
   const h = G.joueur.heros; const X = { sacOr: Math.round(18 * dj.dniv * rnd(.7, 1.4)), butin: [], tues: 30, resultat: ok ? 'victoire' : 'mort' };
   const ec = h.niveau - dj.dniv, gainXp = Math.round(2400 * (.75 + .25 * dj.dniv) * (ok ? 1 : .4) * (ec > 2 ? Math.max(.2, 1 - .15 * (ec - 2)) : 1)); h.xp += gainXp; while (h.xp >= xpPour(h.niveau)) { h.xp -= xpPour(h.niveau); h.niveau++; h.points++; }
   if (ok) for (let i = 0; i < 3; i++) { const o = genObjet(dj.dniv, h.classe, { bonus: .1 }); if (scoreObjet(o, h.classe) > scoreObjet(h.equip[o.empl], h.classe)) h.equip[o.empl] = o; else G.joueur.inventaire.push(o); }
   finExpedition(G, dj.id, X); continue;
  }
  if (J.or > 120 && chance(.4)) { const p = pick(mes); act(G, 'batir', { prov: p.id, bat: pick(['marche', 'caserne', 'temple', 'fortifier']) }); continue; }
  if (J.or >= 30) { const p = (front.length ? front : mes).sort((a, b) => a.t - b.t)[0]; act(G, 'recruter', { prov: p.id }); continue; }
  if (mes.some(p => p.loy < 35)) { if (J.or >= 40) act(G, 'festin'); else act(G, 'conseil'); continue; }
  act(G, 'conseil');
 }
 // vendre le surplus
 for (const o of G.joueur.inventaire.splice(0)) J.or += Math.round(o.prix / 3);
}

/* ---------- La Faille de Braise (fin de partie : paliers sans fin) ---------- */
function failleOuverte(G) { return G.couronne || provincesDe(G, 'joueur').some(p => p.capitale) || G.joueur.heros.niveau >= 15; }
function configFaille(G) { const n = G.faille.palier; return { type: ['catacombes', 'antre', 'glace', 'mine', 'marais', 'crypte'][n % 6], niveau: 7 + n * 1.7, etages: 3, nom: `Faille de Braise — palier ${n}`, boss: ['liche', 'wyverne', 'ogre'][n % 3] }; }
function finFaille(G, X) {
 const F = G.faille, n = F.palier;
 if (X.resultat !== 'victoire') return `La Faille vous recrache au palier ${n}.`;
 F.record = Math.max(F.record, n); F.palier++;
 const or = 60 * n; G.maisons.joueur.or += or; G.maisons.joueur.prestige += 3 + n;
 let t = `Palier ${n} vaincu ! +${or} or, +${3 + n} prestige.`;
 if (chance(.35 + n * .03)) { const o = genObjet(G.joueur.heros.niveau + 2, G.joueur.heros.classe, { rarete: 'legendaire' }); G.joueur.inventaire.push(o); t += ` La Faille vous offre ${o.nom} !`; }
 noter(G, `${G.joueur.heros.nom} a vaincu le palier ${n} de la Faille de Braise.`, 'exploit');
 return t;
}

</script>
<script>
/* evenements.js */
'use strict';
/* =========================================================
   Événements : chaque saison apporte son lot d'intrigues, de malheurs et d'occasions.
   Un choix renvoie un texte, ou { msg, combat:{...} } pour lancer un combat (l'interface
   rappelle ensuite EVTS[id].apres(G, e, X)).
   ========================================================= */
const pv = (G, id) => prov(G, id);
const mN = (G, m) => G.maisons[m].nom;
const mesProv = G => provincesDe(G, 'joueur');
const uneProv = G => pick(mesProv(G));
const maisonVoisine = G => { const s = new Set(); for (const p of mesProv(G)) for (const id of voisinsDe(p.id)) { const q = pv(G, id); if (q.o !== 'joueur' && q.o !== 'rebelles') s.add(q.o); } return s.size ? pick([...s]) : pick(IA_MAISONS.filter(m => !G.maisons[m].elim)) || 'rebelles'; };
const gainOr = (G, n) => { G.maisons.joueur.or += n; return n >= 0 ? `+${n} or` : `${n} or`; };
const gainPrest = (G, n) => { G.maisons.joueur.prestige = Math.max(0, G.maisons.joueur.prestige + n); return n >= 0 ? `+${n} prestige` : `${n} prestige`; };
const gainInf = (G, n) => { G.maisons.joueur.influence += n; return `+${n} influence`; };
const heros = G => G.joueur.heros;
const peutCombattre = G => !G.joueur.blesse && !G.joueur.regence;

const EVTS = {
 intro: { titre: 'L’héritage d’Aubrac', img: 'chateau',
  texte: G => `Le vent d’automne a emporté votre père. Vous voici à la tête d’une maison mineure : deux provinces, Val-Sombre et Lisière, quelques centaines d’hommes et des dettes. À Haute-Braise, le vieux roi Aldric s’éteint lentement, et son fils n’a que quatorze ans. Les grandes maisons affûtent déjà leurs lames.\n\nOn dit que sous la chapelle de Val-Sombre s’ouvre une crypte où rôdent les morts. Le peuple attend de voir de quel bois vous êtes fait${heros(G).sexe === 'f' ? 'e' : ''}.`,
  choix: G => [
   { t: 'Jurer de purger la crypte de Val-Sombre (conseillé pour commencer)', f: G => { G.maisons.joueur.prestige += 2; return 'Le peuple murmure votre nom. Sélectionnez Val-Sombre sur la carte puis « Expédition ».'; } },
   { t: 'Rassembler d’abord les bannières (+4 troupes à Val-Sombre)', f: G => { pv(G, 'valsombre').t += 4; return 'Les vassaux répondent à l’appel.'; } },
   { t: 'Écrire au vieux roi pour lui jurer fidélité', f: G => { changeRel(G, 'joueur', 'draknor', 20); return `La maison Draknor apprécie votre loyauté (relation ${G.maisons.draknor.rel.joueur}).`; } },
  ] },
 mort_roi: { titre: 'Le roi est mort', img: 'couronne', unique: true,
  texte: G => `Les cloches de Haute-Braise sonnent le glas : Aldric le Vieux s’est éteint. Son fils ${G.maisons.draknor.chef && G.maisons.draknor.heritier ? G.maisons.draknor.heritier.nom : 'Valéran'}, encore enfant, est proclamé roi, mais déjà les grandes maisons contestent sa légitimité. La guerre de succession commence.`,
  pre: G => { G.roiMort = true; const D = G.maisons.draknor; if (D.chef && D.chef.roi) { successionIA(G, 'draknor'); D.chef.roi = false; } for (const m of IA_MAISONS) if (m !== 'draknor' && G.maisons[m].rel.draknor < 10 && chance(.6)) declarerGuerre(G, m, 'draknor'); for (const q of provincesDe(G, 'draknor')) q.loy -= 15; },
  choix: G => [
   { t: 'Soutenir le jeune roi (alliance avec Draknor, +10 prestige)', f: G => { changeRel(G, 'joueur', 'draknor', 30); G.maisons.joueur.alliance.draknor = G.maisons.draknor.alliance.joueur = true; return `Vous voici protecteur${heros(G).sexe === 'f' ? 'trice' : ''} de la couronne. ${gainPrest(G, 10)}.`; } },
   { t: 'Revendiquer le Trône de Braise (guerre contre Draknor, +15 prestige)', f: G => { declarerGuerre(G, 'joueur', 'draknor', 'revendication du trône'); for (const m of IA_MAISONS) changeRel(G, 'joueur', m, -8); return `Votre bannière flotte face au dragon. ${gainPrest(G, 15)}. Les autres maisons vous regardent avec méfiance.`; } },
   { t: 'Attendre que les loups s’entre-dévorent (+3 influence)', f: G => `Patience est mère de couronnes. ${gainInf(G, 3)}.` },
  ] },
 couronnement: { titre: 'Le Trône de Braise', img: 'couronne',
  texte: G => `Haute-Braise vous ouvre ses portes. Sur le trône de pierre noire, encore tiède du règne des Draknor, ${heros(G).nom} d’${G.maisons.joueur.nom} reçoit la couronne de fer et de braise. Dix provinces et plus vous prêtent serment.\n\nVous avez gagné la partie. Le royaume continue : défendez votre couronne, étendez votre lignée, ou partez à la chasse aux légendes.`,
  choix: G => [{ t: 'Longue vie au souverain !', f: G => 'Les chroniqueurs gravent votre nom.' }] },
 naissance: { titre: 'Un enfant est né',
  texte: (G, e) => `${e.sexe === 'f' ? 'Une fille' : 'Un fils'} vous est né${e.sexe === 'f' ? 'e' : ''} : ${e.nom}. La lignée d’${G.maisons.joueur.nom} se prolonge.`,
  choix: G => [{ t: 'Faire sonner les cloches (+3 prestige)', f: G => gainPrest(G, 3) }, { t: 'Distribuer du pain au peuple (−20 or, +loyauté)', f: G => { G.maisons.joueur.or -= 20; for (const p of mesProv(G)) p.loy += 8; return 'Le peuple bénit l’enfant.'; } }] },
 declaration: { titre: 'Déclaration de guerre',
  texte: (G, e) => `Un héraut aux couleurs de la maison ${mN(G, e.maison)} jette un gantelet aux pieds de votre trône. « ${G.maisons[e.maison].devise} ! » La guerre est déclarée.`,
  choix: (G, e) => [{ t: 'Préparer les défenses', f: G => 'Aux armes !' }, { t: 'Envoyer de l’or pour calmer leur colère (−60 or)', f: (G, e) => { if (G.maisons.joueur.or < 60) return 'Vos coffres sont vides : la guerre continue.'; G.maisons.joueur.or -= 60; if (chance(.55)) { faireLaPaix(G, 'joueur', e.maison); return 'Leur colère s’apaise : la paix est rétablie.'; } return 'Ils prennent l’or… et gardent leurs épées.'; } }] },
 offre_paix: { titre: 'Une offre de paix',
  texte: (G, e) => `La maison ${mN(G, e.maison)}, éprouvée par la guerre, vous propose la paix et 40 pièces d’or en gage de bonne foi.`,
  choix: (G, e) => [{ t: 'Accepter la paix (+40 or)', f: (G, e) => { faireLaPaix(G, 'joueur', e.maison); changeRel(G, 'joueur', e.maison, 20); return gainOr(G, 40); } }, { t: 'Refuser : écraser l’ennemi (+3 prestige)', f: G => gainPrest(G, 3) }] },
 offre_alliance: { titre: 'Une main tendue',
  texte: (G, e) => `La maison ${mN(G, e.maison)} vous propose une alliance en bonne et due forme.`,
  choix: (G, e) => [{ t: 'Accepter', f: (G, e) => { G.maisons[e.maison].alliance.joueur = G.maisons.joueur.alliance[e.maison] = true; noter(G, `Alliance avec ${mN(G, e.maison)}.`, 'paix'); return 'Alliance conclue.'; } }, { t: 'Décliner poliment', f: (G, e) => { changeRel(G, 'joueur', e.maison, -5); return 'Ils repartent déçus.'; } }] },
 attaque_subie: { titre: 'Bataille !',
  texte: (G, e) => `La maison ${mN(G, e.maison)} a attaqué ${pv(G, e.prov).nom}. ${e.gagne ? `La province est tombée (vos pertes : ${e.pd}, les leurs : ${e.pa}).` : `Vos défenseurs ont tenu bon (pertes : ${e.pd} contre ${e.pa}).`}`,
  choix: (G, e) => [{ t: e.gagne ? 'Nous la reprendrons' : 'Gloire aux défenseurs !', f: (G, e) => e.gagne ? '' : gainPrest(G, 2) }] },
 retour_mal: { titre: 'Le mal revient',
  texte: (G, e) => `Des paysans de ${pv(G, e.prov).nom} racontent que les ${DONJONS[pv(G, e.prov).donjon].nom.toLowerCase()} grouillent à nouveau de créatures, plus fortes qu’avant (niveau ${pv(G, e.prov).dniv}).`,
  choix: (G, e) => [{ t: 'Il faudra y retourner', f: () => 'La province a perdu un peu de sa confiance.' }] },

 /* ----- événements aléatoires ----- */
 tournoi: { titre: 'Le tournoi de Haute-Braise', poids: 3, cond: G => peutCombattre(G),
  texte: G => 'On donne un grand tournoi pour la fête de la Moisson. Les champions de toutes les maisons s’y affrontent. Une bourse de 120 pièces et une gloire éternelle attendent le vainqueur.',
  choix: G => [
   { t: 'Descendre dans la lice (combat)', f: G => ({ msg: 'Vous enfilez votre heaume…', combat: { arene: { n: 4, maison: maisonVoisine(G) }, niveau: Math.max(1, heros(G).niveau), nom: 'Lice du tournoi' } }) },
   { t: 'Parier sur un champion (−20 or)', f: G => { G.maisons.joueur.or -= 20; return chance(.45) ? `Votre champion l’emporte ! ${gainOr(G, 70)}.` : 'Votre champion mord la poussière.'; } },
   { t: 'Ne pas y assister', f: G => '' },
  ],
  apres: (G, e, X) => X.resultat === 'victoire' ? `Vous remportez le tournoi ! ${gainOr(G, 120)}, ${gainPrest(G, 12)}.` : `Désarçonné${heros(G).sexe === 'f' ? 'e' : ''} devant toute la cour… ${gainPrest(G, -4)}.` },
 bandits: { titre: 'Des brigands sur la route', poids: 4, cond: G => peutCombattre(G) && mesProv(G).length > 0,
  ctx: G => ({ prov: uneProv(G).id }),
  texte: (G, e) => `Une bande de déserteurs rançonne les marchands près de ${pv(G, e.prov).nom}. Les villageois implorent votre aide.`,
  choix: (G, e) => [
   { t: 'Les traquer vous-même (combat)', f: (G, e) => ({ msg: '', combat: { arene: { n: 6, maison: 'rebelles' }, niveau: Math.max(1, pv(G, e.prov).dniv * .6 + heros(G).niveau * .4), nom: 'Embuscade' } }) },
   { t: 'Envoyer la garnison (−2 troupes)', f: (G, e) => { const p = pv(G, e.prov); p.t = Math.max(1, p.t - 2); p.loy += 6; return 'Les brigands sont pendus aux arbres.'; } },

<script>
/* nuage.js */
'use strict';
/* =========================================================
   LE TRÔNE DE BRAISE — sauvegarde en ligne (base de l'artefact, sous-arbre privé du joueur)
   Même principe que valdragon/jeu/cloud.js : un seul document « partie », écrit seulement s'il change.
   ========================================================= */
const NUAGE = (() => {
 let DB = null, UID = null, init = null, busy = false, pending = null, last = '';
 const timeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r({ code: 'timeout' }), ms))]);
 const ouvrir = () => init || (init = (async () => { try { if (!window.claude || !window.claude.use) return false; const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); if (!db || !user) return false; const id = await user.id(); if (!id) return false; DB = db; UID = id; return true; } catch (e) { return false; } })());
 const ref = () => DB.collection('data/users/' + UID).doc('partie');
 async function charger() { if (!await ouvrir()) return null; try { const s = await timeout(ref().get(), 10000); if (!s || !s.exists) return null; const d = s.data(); return d && typeof d.s === 'string' ? d : null; } catch (e) { return null; } }
 function sauver(str, d) { if (str === last) return; pending = { s: str, t: Date.now(), d }; pomper(); }
 async function pomper() { if (busy || !pending) return; if (!await ouvrir()) { pending = null; return; } busy = true; const p = pending; pending = null;
  try { await ref().set(p); last = p.s; } catch (e) { if (e && e.code === 'unavailable') { pending = pending || p; setTimeout(() => { busy = false; pomper(); }, 1500 + Math.random() * 1500); return; } }
  busy = false; if (pending) pomper(); }
 return { ouvrir, charger, sauver, ok: () => !!DB };
})();

</script>

/* ---------- royaume ---------- */
const cvC = $('#carte'), ctxC = cvC.getContext('2d');

 $('#barre').querySelector('.maison').style.color = '';

function relTxt(v) { return v >= 60 ? 'amicale' : v >= 25 ? 'cordiale' : v > -25 ? 'neutre' : v > -60 ? 'hostile' : 'haineuse'; }
function etatMaison(m) { if (m === 'joueur' || m === 'rebelles') return ''; const J = G.maisons.joueur; return enGuerre(G, 'joueur', m) ? '<span class="etiq g">guerre</span>' : J.alliance[m] ? '<span class="etiq a">alliance</span>' : '<span class="etiq p">paix</span>'; }

  🌾 Prospérité : ${'★'.repeat(p.p)}${'☆'.repeat(5 - p.p)} · 🪙 ${Math.round(revenuProv(G, p))}/saison<br>

  ${bat.length ? '🏛️ ' + bat.join(', ') + '<br>' : ''}
  ☠ ${D.nom} : ${p.nettoye ? `<span style="color:#9c9">purgé</span> (le mal reviendra dans ~${p.nettoye} saison${p.nettoye > 1 ? 's' : ''})` : `<b style="color:#ffb080">niveau ${p.dniv}</b>`}</div><div class="acts">`;

  h += b(`➕ Recruter (${4 + (p.bat.caserne ? 2 : 0) + (p.capitale ? 2 : 0)}) · 30🪙`, 'recruter', o && J.or >= 30);

 } else if (proche) {

 }

 el.innerHTML = h;

function actionProv(p, a) {

 else if (a === 'attaquerDepuis') { UI.mode = 'attaque'; UI.de = p.id; UI.cibles = voisinsDe(p.id).filter(id => prov(G, id).o !== 'joueur'); UI.amis = null; toast('Choisissez la province à attaquer'); }
 else if (a === 'attaquer') { const src = voisinsDe(p.id).map(id => prov(G, id)).filter(q => q.o === 'joueur' && q.t > 1).sort((x, y) => y.t - x.t); fenetreAttaque(src, p); }

function chancesAttaque(n, def, o) { let w = 0; for (let i = 0; i < 300; i++) if (bataille(G, n, def, o).gagne) w++; return w / 300; }
function fenetreAttaque(sources, cible) {

(() => {
 const j = $('#joy'), k = j.querySelector('i'); let id = null, c0 = null;
 j.addEventListener('pointerdown', e => { id = e.pointerId; j.setPointerCapture(id); const r = j.getBoundingClientRect(); c0 = [r.left + r.width / 2, r.top + r.height / 2]; mv(e); });

function pauseDonjon() {
 fenetre('Pause', `<p>${esc(XP.o.nomLieu || '')} — ${XP.o.arene ? 'combat' : `étage ${XP.etage + 1}/${XP.etages}`}. Or ramassé : ${XP.sacOr} · objets : ${XP.butin.length}</p>`, [
  { t: '▶ Reprendre', f: fermer, cls: 'or' }, { t: '🎒 Sac et équipement (I)', f: () => armurerie('equip') }, { t: '✦ Compétences (K)', f: () => armurerie('comp') },
  { t: AUDIO.actif() ? '🔇 Couper le son' : '🔊 Activer le son', f: () => { AUDIO.regler(!AUDIO.actif()); if (AUDIO.actif()) AUDIO.musiqueDe('donjon'); fermer(); } },
  { t: '🐞 Signaler un problème à Claude', f: async () => { fermer(); if (TK) { const ok = await TK.signaler(); toast(ok ? 'Signalement envoyé ✓' : 'Signalement enregistré'); } } },
  { t: '🏳️ Battre en retraite (garder l’or et le butin)', f: () => { fermer(); XP.resultat = 'fuite'; A.fini = true; finEtage(); } },
 ]);
}
let hudT = 0, miniT = 0;
function hud(dt) {
 hudT -= dt; if (hudT > 0) return; hudT = .08;
 const P = A.p, S = P.S, h = G.joueur.heros, C = CLASSES[h.classe];
 $('#hVie').style.height = clamp(P.pv / S.pvmax * 100, 0, 100) + '%'; $('#hVieT').textContent = Math.ceil(P.pv);
 $('#hMana').style.height = clamp(P.mana / S.manamax * 100, 0, 100) + '%'; $('#hManaT').textContent = Math.floor(P.mana);
 $('#hXp').style.width = clamp(h.xp / xpPour(h.niveau) * 100, 0, 100) + '%'; $('#hNiv').textContent = `${h.nom} · niveau ${h.niveau}${h.points ? ` · ${h.points} point${h.points > 1 ? 's' : ''} à dépenser (K)` : ''}`;
 $('#hComp').querySelectorAll('[data-c]').forEach((e, i) => { const c = C.comp[i], cd = P.cds[c.id] || 0; e.querySelector('.cd').style.height = cd > 0 ? (cd / (c.cd * (1 - S.recup / 100)) * 100) + '%' : '0'; e.classList.toggle('verr', !h.comp[c.id]); e.style.borderColor = h.comp[c.id] && P.mana < c.cout ? '#3a4a8a' : ''; });
 $('#hComp').querySelector('.pot .n').textContent = P.potions;
 const b = A.boss; const bb = $('#hBoss');
 if (b && !b.mort && b.etat === 'chasse') { bb.classList.add('on'); bb.querySelector('.nm').textContent = b.M.nom + (b.phase === 2 ? ' — fureur' : ''); bb.querySelector('i').style.width = clamp(b.pv / b.pvmax * 100, 0, 100) + '%'; } else bb.classList.remove('on');
 const bo = Object.entries(P.bonus).filter(([k, v]) => v > 0).map(([k, v]) => `<span style="border-color:${AUTELS[k].coul}">${{ fureur: '🔥', celerite: '💨', protection: '🛡️', fortune: '🪙', savoir: '📖' }[k]} ${Math.ceil(v)}</span>`);
 if (P.buff > 0) bo.push(`<span style="border-color:#ff6a3a">📯 ${Math.ceil(P.buff)}</span>`);
 if (A.allie) bo.push(`<span style="border-color:#5ac85a">${COMPAGNONS[A.allie.k].ic} ${A.allie.ko > 0 ? 'à terre' : Math.round(A.allie.pv / A.allie.pvmax * 100) + ' %'}</span>`);
 $('#hBonus').innerHTML = bo.join('');
 infobulleSol();
 const m = $('#hMsg'); m.textContent = A.msg || ''; m.style.opacity = A.msgT > 0 ? 1 : 0;
 $('#hAction').classList.toggle('on', !!A.surEscalier);
 miniT -= .08; if (miniT <= 0) { miniT = .3; minicarte(); }
}
function minicarte() {
 const c = $('#minicarte'), g = c.getContext('2d'); const k = 150 / Math.max(A.W, A.H);
 g.clearRect(0, 0, 150, 150);
 for (let y = 0; y < A.H; y++) for (let x = 0; x < A.W; x++) { const i = y * A.W + x; if (!A.vu[i]) continue; const v = A.carte.t[i]; if (v === MUR) continue; g.fillStyle = v === ESC ? '#ffd84a' : v === PIL ? '#555' : 'rgba(190,170,140,.55)'; g.fillRect(x * k, y * k, k + .3, k + .3); }
 for (const m of A.mobs) if (!m.mort && !m.objet && A.vu[(m.y | 0) * A.W + (m.x | 0)] && Math.hypot(m.x - A.p.x, m.y - A.p.y) < 10) { g.fillStyle = m.boss ? '#ff4020' : m.elite ? '#ffa030' : '#c03030'; g.fillRect(m.x * k - 1, m.y * k - 1, 2.5, 2.5); }
 if (A.portail) { g.fillStyle = '#8ab8ff'; g.fillRect(A.portail.x * k - 2, A.portail.y * k - 2, 4, 4); }
 g.fillStyle = '#fff'; g.beginPath(); g.arc(A.p.x * k, A.p.y * k, 2.5, 0, 6.28); g.fill();
}

/* ---------- boucle principale ---------- */
let dernier = 0, carteT = 0;
function boucle(t) {
 requestAnimationFrame(boucle);
 const dt = Math.min(.05, (t - dernier) / 1000 || .016); dernier = t;
 if (MODE === 'donjon' && A) {
  if (!A.pause && !A.fini) { majDonjon(A, dt, lireEntree()); if (A.fini) finEtage(); }
  rendreDonjon(A, cvJ, ctxJ, lum, lctx); hud(dt);
 } else if (MODE === 'royaume' && G) {
  carteT -= dt;
  if (carteT <= 0) {
   carteT = 1 / 30; const V = CARTE.V;
   const cle = [V.x, V.y, V.z, cvC.width, UI.sel, UI.survol, UI.mode, G.tour, G.ordres, UI.fleches.length, G.provinces.map(p => p.o + p.t + p.c + p.nettoye + p.dniv).join('')].join('|');
   if (cle !== UI.cleCarte || UI.cibles || UI.amis) { UI.cleCarte = cle; CARTE.dessiner(G, cvC, ctxC, UI); }
  }
 }
 else if (MODE === 'accueil') animBraises(dt);
}
requestAnimationFrame(boucle);

/* ---------- trousse de test ---------- */
async function banc() {
 if (!TK) return toast('Trousse indisponible');
 toast('Banc en cours (≈ 30 s)…', 30000);
 const res = await TK.banc([
  { nom: 'carte du royaume', preparer: async () => { A = null; montrer('royaume'); } },
  { nom: 'donjon niveau 5 (combat automatique)', preparer: async () => { UI.auto = true; lancerExpedition({ type: 'catacombes', niveau: 5, etages: 2, nom: 'Banc' }, () => { }); } },
  { nom: 'boss (combat automatique)', preparer: async () => { UI.auto = true; XP = creerExpedition({ type: 'crypte', niveau: 3, etages: 1, heros: G.joueur.heros, generation: 1 }); montrer('donjon'); nouvelEtage(); A.p.x = A.boss.x - 4; A.p.y = A.boss.y; A.p.S.pvmax *= 50; A.p.pv = A.p.S.pvmax; } },
 ], 5000);
 UI.auto = false; A = null; XP = null; montrer('royaume');
 fenetre('Banc de mesure', `<p>${res.res.map(r => `${r.scene} : <b>${r.fps || '?'}</b> img/s (pire ${r.pire} ms)`).join('<br>')}</p><p><small>${esc(res.gpu)}</small><br>${res.enregistre ? 'Résultats envoyés à Claude ✓' : 'Résultats enregistrés sur cet appareil.'}</p>`, [{ t: 'Fermer', f: fermer }]);
}
(function attendreTK(n = 0) {
 if (window.Testkit) {
  TK = window.Testkit({ jeu: 'trone-de-braise', canvas: () => MODE === 'donjon' ? cvJ : cvC, rendu: () => { if (MODE === 'donjon' && A) rendreDonjon(A, cvJ, ctxJ, lum, lctx); else if (G) CARTE.dessiner(G, cvC, ctxC, UI); }, etat: () => ({ mode: MODE, test: TEST, tour: G && G.tour, an: G && G.an, provinces: G && provincesDe(G, 'joueur').length, heros: G && { classe: G.joueur.heros.classe, niveau: G.joueur.heros.niveau }, donjon: A && { type: A.type, etage: XP && XP.etage, mobs: A.mobs.filter(m => !m.mort).length, pv: Math.round(A.p.pv) }, fenetre: $('#voile').classList.contains('on') ? $('#fen .tete h2').textContent : null }) });
  if (TEST) TK.modeTest();
 } else if (n < 100) setTimeout(() => attendreTK(n + 1), 100);
})();
try { RENDU.haute = localStorage.getItem('tdb-qualite') === '1'; } catch (e) { }
initAccueil();
window.JEU = { get G() { return G; }, get A() { return A; }, get XP() { return XP; }, UI, lancerExpedition, entrerRoyaume, act, finSaison, montrer };

/* ---------- objectif courant, nouvelles ---------- */
function majObjectif() {
 let el = $('#objectif'); if (!el) { el = document.createElement('div'); el.id = 'objectif'; $('#royaume').appendChild(el); el.onclick = () => el.classList.toggle('replie'); }
 const o = G && objectifActuel(G);
 el.style.display = o && MODE === 'royaume' ? '' : 'none';
 if (o) el.innerHTML = `<b>🎯 Objectif ${G.objectifs.n + 1}/${OBJECTIFS.length}</b><span>${esc(o.t)}</span>`;
}
function afficherNouvelles() {
 const N = G.nouvelles || []; if (!N.length) return;
 for (const n of N) UI.fleches.push({ de: n.de, vers: n.vers, coul: G.maisons[n.m].c1, t: 1.5 });
 const prises = N.filter(n => n.gagne).map(n => `${esc(G.maisons[n.m].nom)} prend ${esc(prov(G, n.vers).nom)}${n.avant === 'joueur' ? ' <b style="color:#f88">(à vous)</b>' : ''}`);
 let el = $('#nouvelles'); if (!el) { el = document.createElement('div'); el.id = 'nouvelles'; $('#royaume').appendChild(el); }
 el.innerHTML = `<b>📯 Nouvelles du royaume</b><br>${N.length} bataille${N.length > 1 ? 's' : ''} cette saison.${prises.length ? '<br>' + prises.join('<br>') : ''}`;
 el.style.opacity = 1; clearTimeout(el._h); el._h = setTimeout(() => el.style.opacity = 0, 9000);
}

function ongletCompagnon(h) {
 const c = G.joueur.compagnon, J = G.maisons.joueur;
 if (c) { const K = COMPAGNONS[c.type]; return `<div class="perso"><span class="av">${K.ic}</span><div><b style="color:var(--or2);font-size:18px">${esc(c.nom)}</b>, ${K.nom.toLowerCase()} de la maison<br>${K.desc}<br><small>Niveau ${h.niveau} (suit le vôtre) · ${Math.round(K.pv + K.pvn * (h.niveau - 1))} vie · solde 6 or par saison</small></div></div><p style="font-size:13.5px;color:#bba">Votre compagnon vous suit dans les donjons et les combats. S’il tombe, il se relève au bout de quelques secondes.</p><button class="btn petit" id="cRenvoi">Le renvoyer</button>`; }
 return `<p>Un compagnon d’armes vous accompagne dans les donjons, combat à vos côtés et détourne les coups. Solde : 6 or par saison. Vous avez ${nf(J.or)} or.</p><div style="display:grid;gap:8px">${Object.entries(COMPAGNONS).map(([k, K]) => `<div class="compl"><div class="ic">${K.ic}</div><div class="tx"><b>${K.nom}</b><br>${K.desc}</div><button class="btn petit ${J.or >= K.prix ? 'or' : ''}" data-comp="${k}" ${J.or >= K.prix ? '' : 'disabled'}>Engager ${K.prix} 🪙</button></div>`).join('')}</div>`;
}

function infobulleSol() {
 const tip = $('#hTip'); if (!A || document.body.classList.contains('tact')) { tip.style.display = 'none'; return; }
 const q = cvJ.q || 1, mx = (entree.sx * q - A.ox) / A.TS, my = (entree.sy * q - A.oy) / A.TS;
 let l = null, bd = .7; for (const o of A.loot) if (o.obj) { const d = Math.hypot(o.x - mx, o.y - my); if (d < bd) { bd = d; l = o; } }
 if (!l) { tip.style.display = 'none'; return; }
 const h = G.joueur.heros, o = l.obj, R0 = RARETES.find(r => r.id === o.rar), act = h.equip[o.empl], sc = scoreObjet(o, h.classe), sa = scoreObjet(act, h.classe);
 tip.innerHTML = `<b style="color:${R0.coul}">${esc(o.nom)}</b><br><small>${R0.nom} · ${o.base} · niv. ${o.ilvl}</small><br>${lignesObjet(o).join('<br>')}<br>${sc < 0 ? '<span class="pire">Inutilisable pour votre classe</span>' : act ? `<span class="${sc >= sa ? 'mieux' : 'pire'}">${sc >= sa ? '▲ meilleur' : '▼ moins bon'} que ${esc(act.nom)}</span>` : '<span class="mieux">Emplacement libre</span>'}`;
 tip.style.display = 'block'; tip.style.left = Math.min(innerWidth - 270, entree.sx + 18) + 'px'; tip.style.top = Math.max(8, entree.sy - 40) + 'px';
}

function infoProv(p, x, y) {
 let el = $('#infoProv'); if (!el) { el = document.createElement('div'); el.id = 'infoProv'; $('#royaume').appendChild(el); cvC.addEventListener('pointerleave', () => el.style.display = 'none'); }
 if (!p || document.body.classList.contains('tact')) { el.style.display = 'none'; return; }
 const M = G.maisons[p.o];
 el.innerHTML = `<b style="color:${p.o === 'joueur' ? '#f2d7a0' : '#e8d6a8'}">${esc(p.nom)}</b> — ${esc(M.nom)} ${p.o !== 'joueur' ? etatMaison(p.o) : ''}<br>⚔️ ${p.t} troupes · 🏰 ${p.c ? 'château ' + p.c : 'sans château'}<br>☠ ${DONJONS[p.donjon].nom} ${p.nettoye ? '(purgé)' : 'niv. ' + p.dniv}`;
 el.style.display = 'block'; el.style.left = Math.min(innerWidth - 250, x + 16) + 'px'; el.style.top = (y + 16) + 'px';
}

</script>
<script type="module">
/* testkit.js */
// ===== Trousse de test à intégrer dans n'importe quel jeu (artefact Claude) =====
// Ajoute : compteur d'images par seconde (mode test), bouton 🐞 « signaler un problème » (capture + état + erreurs),
// banc de mesure scripté, et envoi des résultats dans la base de l'artefact (lisible par Claude avec db_list).
// Usage dans le jeu :
//   import {Testkit} from './testkit.js';
//   const TK=Testkit({jeu:'hameau', canvas:()=>renderer.domElement, etat:()=>({...}), rendu:()=>renderer.render(scene,cam)});
//   TK.bouton(document.body);            // bouton 🐞 permanent
//   TK.modeTest();                       // affiche le compteur (à appeler depuis un bouton « Mode test »)
//   await TK.banc([{nom:'scène 1', preparer:async()=>{...}}, ...], 5000);  // mesure chaque scène 5 s
// Jeux sans canvas (SVG/DOM) : fournir capture:async()=>dataURL (voir svgCapture ci-dessous) et canvas:()=>document.createElement('canvas') pour le nom du GPU.
// Le mode test ne doit jamais écrire dans la vraie sauvegarde : c'est au jeu de couper sa sauvegarde quand TK.test est vrai.
export function Testkit(o){
 const TK={test:false,ft:[],rec:null,lt:0,erreurs:[]};
 let DB=null,UID=null,init=null;
 const cloud=()=>init||(init=(async()=>{try{if(!window.claude||!window.claude.use)return false;const [db,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);UID=await u.id();DB=db;return !!(db&&UID);}catch(e){return false;}})());
 TK.envoyer=async(nom,obj)=>{try{localStorage.setItem(o.jeu+'_'+nom.split('_')[0],JSON.stringify(obj));}catch(e){}if(!await cloud())return false;try{await DB.collection('data/users/'+UID).doc(nom).set(obj);return true;}catch(e){return false;}};
 addEventListener('error',e=>{TK.erreurs.push(String(e.message||e).slice(0,300));if(TK.erreurs.length>20)TK.erreurs.shift();});
 addEventListener('unhandledrejection',e=>TK.erreurs.push('promesse: '+String(e.reason).slice(0,300)));
 const gpu=()=>{try{const c0=o.canvas&&o.canvas();let gl=c0&&(c0.getContext('webgl2')||c0.getContext('webgl'));if(!gl){const c=document.createElement('canvas');gl=c.getContext('webgl');} // jeux 2D : canvas WebGL temporaire
  const x=gl.getExtension('WEBGL_debug_renderer_info');return x?gl.getParameter(x.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);}catch(e){return '?';}};
 const stats=a=>{if(!a.length)return{};const s=a.slice().sort((x,y)=>x-y),m=a.reduce((x,y)=>x+y,0)/a.length;return{fps:+(1000/m).toFixed(1),bas1:+(1000/s[Math.floor(s.length*.99)]).toFixed(1),pire:+s[s.length-1].toFixed(1),n:a.length};};
 const tick=t=>{if(TK.lt){const d=t-TK.lt;TK.ft.push(d);if(TK.ft.length>240)TK.ft.shift();if(TK.rec)TK.rec.push(d);}TK.lt=t;if(TK.ov&&t-(TK.tt||0)>500){TK.tt=t;const s=stats(TK.ft.slice(-60));TK.ov.firstChild.textContent=`🧪 ${s.fps||'-'} img/s · pire ${s.pire||'-'} ms`;}requestAnimationFrame(tick);};requestAnimationFrame(tick);
 TK.modeTest=()=>{TK.test=true;if(TK.ov)return;const d=document.createElement('div');d.style.cssText='position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(0,0,0,.72);color:#9fe0a0;font:12px monospace;padding:4px 8px;border-radius:6px';d.innerHTML='<span>🧪</span>';document.body.appendChild(d);TK.ov=d;};
 TK.mesurer=async ms=>{TK.rec=[];await new Promise(r=>setTimeout(r,ms));const a=TK.rec;TK.rec=null;return stats(a);};
 TK.banc=async(scenes,ms=5000)=>{const res=[];for(const s of scenes){try{await s.preparer();await new Promise(r=>setTimeout(r,1500));res.push(Object.assign({scene:s.nom},await TK.mesurer(ms)));}catch(e){res.push({scene:s.nom,erreur:String(e)});}}
  const out={jeu:o.jeu,date:new Date().toISOString(),gpu:gpu(),ua:navigator.userAgent,ecran:innerWidth+'x'+innerHeight+' @'+devicePixelRatio,res};out.enregistre=await TK.envoyer('mesures_'+Date.now(),out);return out;};
 TK.signaler=async()=>{let img='';try{if(o.capture)img=await o.capture();else{if(o.rendu)o.rendu();const src=o.canvas(),k=Math.min(1,480/src.width),c=document.createElement('canvas');c.width=src.width*k|0;c.height=src.height*k|0;c.getContext('2d').drawImage(src,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.6);}}catch(e){}
  const st={jeu:o.jeu,test:TK.test,date:new Date().toISOString(),gpu:gpu(),ua:navigator.userAgent,img_s:stats(TK.ft.slice(-60)).fps,etat:(()=>{try{return o.etat?o.etat():null;}catch(e){return String(e);}})(),erreurs:TK.erreurs.slice(),capture:img};
  return TK.envoyer('signalement_'+Date.now(),st);};
 TK.bouton=(parent,style)=>{const b=document.createElement('button');b.textContent='🐞';b.title='Signaler un problème à Claude';b.style.cssText=style||'position:fixed;right:10px;bottom:10px;z-index:9999;width:38px;height:38px;border-radius:50%;opacity:.75';parent.appendChild(b);
  b.onclick=async()=>{b.disabled=true;const ok=await TK.signaler();b.disabled=false;b.textContent=ok?'✓':'🐞';setTimeout(()=>b.textContent='🐞',1500);};return b;};
 return TK;}

// Capture d'un <svg> (jeux en SVG) : sérialise, dessine dans un canvas réduit, renvoie un JPEG en dataURL.
export function svgCapture(svg,largeur=480){return new Promise(res=>{try{
 // on recopie les feuilles de style de la page dans le clone : sans elles, les classes CSS (display, fill…) sont perdues
 const css=[...document.styleSheets].flatMap(st=>{try{return [...st.cssRules].map(r=>r.cssText);}catch(e){return [];}}).join('\n');
 const cl=svg.cloneNode(true);const stl=document.createElementNS('http://www.w3.org/2000/svg','style');stl.textContent=css;cl.insertBefore(stl,cl.firstChild);
 const xml=new XMLSerializer().serializeToString(cl);const r=svg.getBoundingClientRect();const k=Math.min(1,largeur/r.width);
 const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=r.width*k|0;c.height=r.height*k|0;const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6));}catch(e){res('');}};img.onerror=()=>res('');
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml.replace('<svg','<svg width="'+r.width+'" height="'+r.height+'"'));}catch(e){res('');}});}
// Jeux en scripts classiques (sans import) : exposer aussi la trousse sur window.
if(typeof window!=="undefined"){window.Testkit=Testkit;window.svgCapture=svgCapture;}

</script>
