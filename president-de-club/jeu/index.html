A.aiScout=function(){
  const a=UI.aiPick;if(!a)return;let p=(S.market||[]).find(m=>m.n0===a.name&&m.club===a.club);
  if(!p){const t=S.teams.find(x=>x.name===a.club);const d=t&&!t.user?S.div:clamp(S.div+1,0,6);
    p=genPlayer({div:d,pos:a.pos});const [fn,...ln]=a.name.split(' ');p.fn=fn;p.ln=ln.join(' ')||fn;p.n0=a.name;p.ovr=clamp(a.lvl||p.ovr,25,92);p.pot=Math.max(p.pot,p.ovr);
    p.fee=Math.round(valueFor(p,d)*rf(1.1,1.5)/100)*100;p.demand=Math.round(wageFor(p.ovr)*rf(1.05,1.4)/10)*10;p.club=a.club;p.pers=pick(PERS);p.firm=+rf(.82,.95).toFixed(2);p.lastYear=R()<.25;genHist(p,a.club,d);
    S.market.unshift(p);}
  p.scouted=true;p.potSeen=[p.pot,p.pot];save();closeModal();toast('Rapport du recruteur : '+a.name+' ajouté au marché (onglet Mercato).');setTimeout(()=>A.pinfo(p.id),60);
};

/* ====================== Conseils du staff ====================== */
function advWho(role){const s=S.staff[role];
  if(s)return {name:s.name,title:ROLES[role].n,lvl:s.lvl};
  if(!S.flags.tresName){const n=genName();S.flags.tresName=n.fn+' '+n.ln;}
  return {name:S.flags.tresName,title:'Trésorier bénévole',lvl:0};}
function attAt(price){const L=LV[S.div];return Math.min(cap(),S.fans*(.45+S.mood/200)*clamp(Math.pow(tk()/price,1.1),.25,1.6));}
function gateAt(price){const a=attAt(price),ab=S.abo&&!S.abo.open?S.abo.n*.9:0;return Math.max(0,a-ab)*price+Math.max(a,ab)*BUV[S.infra.commerce];}
function bestTicket(){let b=S.ticket,bv=-1;const mx=Math.round(tk()*3);for(let p=1;p<=mx;p++){const v=gateAt(p)-(p>tk()*1.4?gateAt(p)*.04:0);if(v>bv){bv=v;b=p;}}return b;}
const noisy=(v,lvl,seed)=>lvl>=3?v:Math.max(1,Math.round(v*(1+(hashN(seed)-.5)*(lvl>=1?.2:.4))));
function staffAdvice(){
  const out=[],L=LV[S.div],hide=UI.advHide||{};
  const DM={ticket:'ticket',abo:'abo',contrat:'renew',jeune:'loan',gap:'recruit'};
  const add=(key,role,pri,text,acts)=>{if(hide[key]===S.gw)return;if(DM[key]&&dlgOn(DM[key]))return;out.push({key,who:advWho(role),pri,text,acts:acts||[]});};
  // billetterie
  if(S.week<S.N){const w=advWho('commercial'),b=noisy(bestTicket(),w.lvl,S.year*11+3),cur=S.ticket;
    if(Math.abs(b-cur)>=Math.max(1,Math.round(cur*.08))){
      const up=b>cur;
      if(w.lvl===0)add('ticket','commercial',2,up?'Le stade se remplit bien : je pense qu’on pourrait monter un peu le prix du billet sans perdre de monde.':'Les gradins sonnent creux. On attirerait sans doute plus de monde en baissant un peu le prix.',[[up?'Monter de 1 €':'Baisser de 1 €',`A.ticket(${up?1:-1})`]]);
      else add('ticket','commercial',3,`Avec un billet à ${b} € au lieu de ${cur} €, on attendrait environ ${nf(Math.round(attAt(b)))} spectateurs et ${money(Math.round(gateAt(b)))} de recette par match à domicile (contre ${money(Math.round(gateAt(cur)))} aujourd’hui)${up&&b>tk()*1.4?' — attention, les supporters risquent de grincer':''}.`,[[`Passer à ${b} €`,`A.ticket(${b-cur})`]]);}}
  // abonnements
  if(S.abo&&S.abo.open){const w=advWho('commercial');let bp=S.abo.price,bv=-1;const f=aboFair();for(let p=Math.round(f*.35);p<=f*2;p+=Math.max(1,Math.round(f/60))){const n=aboDemand(p),v=n*p+(homeGames()*Math.max(0,attAt(S.ticket)-n*.9)*S.ticket)*.6;if(v>bv){bv=v;bp=p;}}
    bp=noisy(bp,w.lvl,S.year*3+5);if(Math.abs(bp-S.abo.price)>=Math.max(2,S.abo.price*.07))add('abo','commercial',4,`Pour la campagne d’abonnement, je viserais ${bp} € : environ ${nf(aboDemand(bp))} abonnés et ${money(aboDemand(bp)*bp)} encaissés tout de suite.`,[[`Fixer à ${bp} €`,`A.aboPrice(${bp});render()`]]);}
  // finances
  const pr=projection();
  if(pr<0){const st=strength(),inXI=new Set(st.xi.map(e=>e.p.id));const cand=S.players.filter(p=>!inXI.has(p.id)&&!p.loan).sort((a,b)=>b.wage-a.wage)[0];
    add('fin','commercial',5,`Au rythme actuel, on finira la saison à ${money(pr)}.${cand?` Le plus gros salaire hors du onze, c’est ${plk(cand.id,pname(cand))} (${money(cand.wage)}/mois) : le vendre ou le prêter soulagerait les comptes.`:''}${loanCap()>2000?' La banque peut aussi nous prêter jusqu’à '+money(loanCap())+'.':''}`,[...(cand?[[`Mettre ${pshort(cand)} en vente`,`A.list(${cand.id})`]]:[]),['Voir les finances',"A.tab('finances')"]]);}
  // effectif : postes dégarnis
  {const need={G:2,D:6,M:6,A:4},av=p=>!p.loan;const miss=Object.entries(need).filter(([k,n])=>S.players.filter(p=>p.pos===k&&av(p)).length<n);
    if(miss.length)add('gap','coach',4,`Il nous manque du monde : ${miss.map(([k,n])=>POSN[k].toLowerCase()+' ('+S.players.filter(p=>p.pos===k&&av(p)).length+'/'+n+')').join(', ')}. Une blessure et on est coincés.`,[['Aller au mercato',"A.tab('mercato')"]]);}
  // fraîcheur
  {const st=strength(),f=st.xi.reduce((a,e)=>a+e.p.fit,0)/Math.max(1,st.xi.length),inj=S.players.filter(p=>p.inj).length;
    if(f<78||inj>=3)add('fit','prepa',3,`Le groupe est ${f<78?'fatigué (forme moyenne du onze : '+Math.round(f)+' %)':'touché par les blessures ('+inj+' blessés)'}. ${S.euro&&S.euro.phase!=='out'?'Avec les matchs européens en semaine, il faut faire tourner.':'Évitons les matchs amicaux et les sollicitations en plus.'}${slvl('prepa')<3?' Un meilleur préparateur physique accélérerait la récupération.':''}`,[['Voir l’effectif',"A.tab('effectif')"]]);}
  if(windowOpen())add('sreport','recruteur',2,'J’ai préparé un point complet sur l’effectif : les postes à renforcer et les joueurs dont on pourrait se séparer.',[['Lire le rapport','A.squadReport()']]);
  // recrutement
  if(windowOpen()&&S.market&&S.market.length){const st=strength();const weak=[...st.xi].sort((a,b)=>a.p.ovr-b.p.ovr)[0];
    if(weak){const c=S.market.filter(p=>p.pos===weak.slot&&p.ovr>=weak.p.ovr+3&&interest(p)>=.3&&(p.fee||0)<=Math.max(0,S.cash)*.5).sort((a,b)=>(b.ovr-b.fee/1e5)-(a.ovr-a.fee/1e5))[0];
      if(c)add('recrue','recruteur',3,`J’ai repéré ${plk(c.id,pname(c))} (${POSN[c.pos].toLowerCase()}, ${c.age} ans, ${c.ovr}) : il ferait mieux que ${pshort(weak.p)} (${weak.p.ovr}). ${c.fee?'Indemnité demandée : '+money(c.fee)+'.':'Il est libre.'}`,[['Voir sa fiche',`A.pinfo(${c.id})`],['Négocier',`A.nego(${c.id})`]]);}}
  // contrats
  {const st=strength(),inXI=new Set(st.xi.map(e=>e.p.id));const k=S.players.filter(p=>p.contract<=1&&!p.loan&&(inXI.has(p.id)||p.pot-p.ovr>=8)).sort((a,b)=>b.ovr-a.ovr)[0];
    if(k&&S.week>=4)add('contrat','coach',3,`Le contrat de ${plk(k.id,pname(k))} se termine en fin de saison. ${inXI.has(k.id)?'C’est un titulaire : ne le laissons pas partir libre.':'Il a un vrai potentiel : prolongeons-le avant que d’autres clubs ne s’en mêlent.'}`,[['Prolonger',`A.renew(${k.id})`]]);}
  // jeunes
  {const y=S.players.filter(p=>p.age<=21&&p.pot-p.ovr>=10&&!p.loan&&(p.s?p.s.mj+p.s.cmj:0)<=1&&S.week>=6).sort((a,b)=>b.pot-a.pot)[0];
    if(y)add('jeune','formateur',2,`${plk(y.id,pname(y))} (${y.age} ans) a un gros potentiel mais ne joue pas. ${S.reserve?'Il joue en réserve, mais un prêt le ferait progresser plus vite.':'Un prêt ou une équipe réserve lui donnerait du temps de jeu.'}`,[['Le prêter',`A.loanOut(${y.id})`]]);}
  // supporters
  if(S.ultras&&S.ultras.rel<35)add('ultras','commercial',3,`Les ${esc(S.ultras.name)} sont remontés (relation ${Math.round(S.ultras.rel)}/100). ${S.ticket>tk()*1.15?'Le prix des places les agace particulièrement. ':''}Une rencontre avec leurs leaders calmerait le jeu.`,[['Les rencontrer','A.ultraMeet()']]);
  // installations rentables
  {const c=buildCost('commerce');if(c&&!buildBlocked('commerce')&&!S.builds.some(b=>b.key==='commerce')){const lv=S.infra.commerce+1,gain=(S.fans*(MERCH[lv]-MERCH[lv-1])*(1+S.div*.4))+homeGames()*attAt(S.ticket)*(BUV[lv]-BUV[lv-1]);
    if(gain>0&&c/gain<=2.2&&S.cash>c*1.3)add('commerce','commercial',2,`Agrandir la buvette et la boutique (${money(c)}) rapporterait environ ${money(Math.round(gain))} par saison : remboursé en ${(c/gain).toFixed(1).replace('.',',')} saison${c/gain>=2?'s':''}.`,[['Voir les installations',"A.tab('infra')"]]);}}
  if(slvl('recruteur')&&!S.mission&&S.misAuto===false&&S.cash>misCost('poste')*5){const c=misAutoPick();if(c)add('mission','recruteur',2,`Je suis disponible pour une mission. Je propose : « ${MIS[c.k].n.toLowerCase()}${c.role?' ('+ROLE[c.role].n.toLowerCase()+')':''} », car ${c.why}.`,[['Ouvrir la cellule de recrutement',"A.tab('mercato')"]]);}
  if(S.spons&&!dlgOn('spons')){const k=spSlots().find(k=>spFree(k)&&(!S.spons[k]||S.week>=S.N/2));if(k)add('spons','commercial',S.spons[k]?2:3,S.spons[k]?`Le contrat « ${SPSLOT[k].n.toLowerCase()} » avec ${S.spons[k].b} se termine en fin de saison. Je peux démarcher d’autres entreprises : la valeur de marché est d’environ ${money(spVal(k,1))} par saison.`:`L’emplacement « ${SPSLOT[k].n.toLowerCase()} » est libre : c’est environ ${money(spVal(k,1))} par saison qui nous échappent. Je peux démarcher.`,[['Démarcher',`A.spProspect('${k}')`]]);}
  // licence
  if(L.promo&&S.div>=1&&S.div<6){const it=licenceItems(S.div+1).filter(x=>!x.admin&&!x.bd&&x.w<=S.N-S.week&&x.w>=S.N-S.week-3);
    if(it.length)add('licence','commercial',4,`Dernier moment pour lancer « ${it[0].l} » si on veut être en règle pour une éventuelle montée : ${it[0].w} semaines de travaux.`,[['Voir les installations',"A.tab('infra')"]]);}
  return out.sort((a,b)=>b.pri-a.pri);
}

   ${a.map(x=>`<div class="adv"><div class="adv-who">${avatar(x.who.name,x.who.lvl)}<div><b>${esc(x.who.name)}</b><small>${esc(x.who.title)}${x.who.lvl?' · '+'★'.repeat(x.who.lvl):''}</small></div></div>

      const n={wage:Math.round(dem*(lv('coach')>=3?.97:1.05)/10)*10,years:p.age>=30?1:p.age<=23?3:2};

  if(D.recruit&&windowOpen()&&!(S.dncg&&S.dncg.lvl>=2)){const need={G:2,D:6,M:6,A:4};
    for(const [pos,n] of Object.entries(need)){if(squadN()>=30)break;if(S.players.filter(p=>p.pos===pos&&!p.loan).length>=n)continue;
      const room=Math.max(0,D.budget||0);const c=(S.market||[]).filter(p=>p.pos===pos&&(p.fee||0)<=room&&interest(p)>=.3&&(p.fee||0)+p.demand*3<=Math.max(0,S.cash)).sort((a,b)=>(b.ovr*(lv('recruteur')>=3?1:.97)+rf(0,lv('recruteur')>=2?1:4))-(a.ovr+0))[0];

function squadAnalysis(){
  const st=strength(),inXI=new Set(st.xi.map(e=>e.p.id)),L=LV[S.div],mid=(L.str[0]+L.str[1])/2;
  const need={G:2,D:6,M:6,A:4},avail=S.players.filter(p=>!p.loan);
  const pos={};
  for(const k of ['G','D','M','A']){
    const ps=avail.filter(p=>p.pos===k).sort((a,b)=>b.ovr-a.ovr);const starters=st.xi.filter(e=>e.slot===k).map(e=>e.p);
    const sAvg=starters.length?starters.reduce((a,p)=>a+p.ovr,0)/starters.length:0;
    const exp=ps.filter(p=>p.contract<=1).length,old=ps.filter(p=>p.age>=31).length;
    let score=0;const why=[];
    if(ps.length<need[k]){score+=3*(need[k]-ps.length);why.push('effectif trop court ('+ps.length+'/'+need[k]+')');}
    if(sAvg&&sAvg<mid-1){score+=2;why.push('titulaires en dessous du niveau de la division ('+Math.round(sAvg)+' contre '+Math.round(mid)+')');}
    if(exp>=2){score+=1;why.push(exp+' contrats qui expirent');}
    if(old>=2){score+=1;why.push(old+' joueurs de plus de 30 ans');}
    const weak=starters.length?starters.reduce((a,p)=>p.ovr<a.ovr?p:a,starters[0]):null;
    pos[k]={k,ps,starters,sAvg,score,why,weak,surplus:ps.length-need[k]};
  }
  // à vendre / prêter
  const sell=[];
  avail.forEach(p=>{if(inXI.has(p.id))return;const P=pos[p.pos];const mj=p.s?p.s.mj+p.s.cmj:0,v=valueFor(p);let r=null,act=null;
    if(p.age<=21&&p.pot-p.ovr>=8){r='Jeune à fort potentiel qui ne joue pas : un prêt le ferait progresser.';act='loan';}
    else if(p.age>=31&&p.ovr<P.sAvg-2){r='En fin de carrière et en dessous des titulaires : sa valeur ne fera que baisser.';act='sell';}
    else if(P.surplus>=2&&p===P.ps[P.ps.length-1]){r='Le moins bon d’un poste où l’effectif est trop fourni.';act='sell';}
    else if(p.wage>wageBill()/Math.max(1,avail.length)*1.6&&mj<=S.week*.3){r='Gros salaire pour un joueur qui joue peu.';act='sell';}
    if(r)sell.push({p,r,act,v,save:p.wage});});
  sell.sort((a,b)=>(b.act==='sell')-(a.act==='sell')||b.save-a.save);
  const rec=Object.values(pos).filter(x=>x.score>=2).sort((a,b)=>b.score-a.score);
  return {pos,sell:sell.slice(0,5),rec,mid};
}
function srCandidates(k,P,lvl){
  const target=Math.max(P.weak?P.weak.ovr+2:0,P.sAvg);const budget=Math.max(0,S.cash)*.5;
  return (S.market||[]).filter(p=>p.pos===k&&p.ovr>=target-(P.ps.length<({G:2,D:6,M:6,A:4})[k]?4:0)&&(p.fee||0)<=budget&&interest(p)>=.25)
    .sort((a,b)=>(b.ovr-(b.fee||0)/Math.max(1,LV[S.div].spons)*4+(lvl>=3?(b.pot-b.ovr)*.3:rf(-2,2)))-(a.ovr-(a.fee||0)/Math.max(1,LV[S.div].spons)*4+(lvl>=3?(a.pot-a.ovr)*.3:rf(-2,2)))).slice(0,lvl>=2?2:1);
}

  UI.curModalFn=()=>A.squadReport();
  openModal(`<div class="kicker">Rapport d’effectif · ${wkLabel()}</div>
   <div class="adv-who">${avatar(w.name,w.lvl)}<div><b>${esc(w.name)}</b><small>${esc(w.title)}${lvl?' · '+'★'.repeat(lvl):''}</small></div></div>
   <h2>Qui vendre, quels postes renforcer</h2>
   <div class="sr-grid">${['G','D','M','A'].map(k=>{const P=an.pos[k];return `<div class="sr-box ${P.score>=4?'bad':P.score>=2?'warn':'ok'}"><b>${k}</b><span>${P.ps.length} joueur${P.ps.length>1?'s':''}</span><span>titulaires ${P.sAvg?Math.round(P.sAvg):'—'}</span></div>`;}).join('')}</div>
   <h3>Postes à renforcer</h3>${recHtml}
   <h3>Joueurs à vendre ou à prêter</h3>${sellHtml}
   <p class="muted" style="margin:0;font-size:12.5px">${lvl>=3?'Rapport détaillé d’un recruteur expérimenté.':lvl>=1?'Un meilleur recruteur verrait le potentiel des joueurs et trouverait plus de pistes.':'Sans recruteur, c’est un bénévole qui fait ce point : ses pistes sont limitées.'}${windowOpen()?'':' Le mercato est fermé : les transferts avec indemnité attendront la prochaine fenêtre.'}</p>

};

function setupRealClub(name){
  const r=realFor(name);if(!r)return;const d=r[2],L=LV[d];
  S.realClub=r[0];S.club.name=r[0];S.club.c1=r[5];S.club.c2=r[6];S.div=d;S.maxDiv=d;S.sasp=d>=4;S.statut=d>=4?'SASP':'Association loi 1901';S.ownership=d===6?20:d===5?35:d===4?50:100;
  const ex=REAL_EXTRA[r[0]];S.terr=r[1]?terrFor(r[1]):Object.assign({real:true},ex);
  const st=realLevel(r[4]);Object.assign(S.infra,{stade:Math.max(st,d>=5?4:2),eclairage:d>=5?3:2,pelouse:2,entrainement:d===6?3:2,formation:d>=5?3:2,commerce:d===6?4:d===5?3:2,loges:d===6?3:d===5?2:1});
  S.invested=Object.entries(S.infra).reduce((a,[k,l])=>{let c=0;for(let i=1;i<=l;i++)c+=(INFRA[k].cost[i]||0);return a+c;},0)*.6;
  S.fans=Math.round(Math.min(r[4]*1.4,LV[d].fcap*.9)*(d===6?1.2:1));S.rep=d===6?55+(r[3]-78)*2.5:d===5?40:30;S.mood=62;S.confidence=58;
  S.cash=d===6?Math.round(rf(4,10)*1e6*(r[3]>=85?2.5:1)):d===5?Math.round(rf(1,3)*1e6):d===4?Math.round(rf(.3,.8)*1e6):Math.round(rf(.08,.25)*1e6);
  S.ticket=Math.round(L.tick*(S.terr?PROF[S.terr.prof||'mixte'].w:1));
  // effectif à son niveau
  S.players=[];const need={G:3,D:8,M:8,A:5};for(const pos in need)for(let k=0;k<need[pos];k++){const p=genPlayer({div:d,pos,contract:ri(1,4)});const target=r[3]+(k<({G:1,D:4,M:4,A:2})[pos]?rf(-1,3):rf(-7,-1));p.ovr=clamp(Math.round(target),30,93);p.pot=Math.max(p.pot,p.ovr+(p.age<=22?ri(2,8):0));p.wage=wageFor(p.ovr);genHist(p,r[0],d,2);S.players.push(p);}
  for(let k=0;k<3;k++){const p=genPlayer({div:d,age:ri(17,19),youth:true,contract:3});p.ovr=clamp(Math.round(r[3]-12+rf(-3,3)),30,85);p.pot=p.ovr+ri(8,18);p.wage=Math.round(wageFor(p.ovr)*.5/10)*10;S.players.push(p);}
  // staff professionnel
  for(const role of Object.keys(ROLES)){const s=genStaff(role);s.lvl=clamp((d===6?4:d>=4?3:2)+(R()<.3?1:0)-(R()<.3?1:0),1,5);s.salary=staffSalary(s.lvl);if(role==='coach')ensureCoach(s);S.staff[role]=s;}
  S.objective=d===6&&r[3]>=85?'montee':'milieu';
  for(let it=0;it<3;it++){const dv=Math.round(r[3]-strength().ovr);if(!dv)break;S.players.forEach(p=>{p.ovr=clamp(p.ovr+dv,25,93);p.pot=Math.max(p.pot,p.ovr);p.wage=p.youth?p.wage:wageFor(p.ovr);});}
}

/* ====================== Aptitudes, rôles et choix tactiques ====================== */
const ROLE={
 GB:{n:'Gardien',g:'G',w:{0:.35,1:.3,3:.2,2:.15}},
 DC:{n:'Défenseur central',g:'D',w:{4:.35,6:.25,5:.2,0:.1,2:.1}},
 LAT:{n:'Latéral',g:'D',w:{0:.3,4:.25,7:.2,2:.15,1:.1}},
 MDC:{n:'Milieu défensif',g:'M',w:{4:.3,2:.25,5:.2,7:.15,8:.1}},
 MC:{n:'Milieu central',g:'M',w:{2:.3,8:.25,1:.2,7:.15,4:.1}},
 MOC:{n:'Meneur de jeu',g:'M',w:{8:.3,1:.3,2:.2,3:.2}},
 AIL:{n:'Ailier',g:'A',w:{0:.35,1:.3,2:.15,3:.2}},
 BU:{n:'Avant-centre',g:'A',w:{3:.4,6:.2,5:.15,0:.15,1:.1}}
};
const ATTR_F=['Vitesse','Technique','Passes','Tir','Défense','Physique','Jeu de tête','Endurance','Vision'];
const ATTR_G=['Réflexes','Placement','Jeu au pied','Sorties','Mental','Physique'];
const ROFF={GB:[4,2,-6,0,1,-1],DC:[-4,-5,-3,-12,7,5,6,0,-4],LAT:[5,-1,1,-8,3,0,-3,5,-2],MDC:[-2,-1,3,-6,5,4,1,4,1],MC:[-1,2,5,-2,-1,0,-3,4,4],MOC:[1,6,4,3,-10,-4,-5,-1,7],AIL:[8,5,1,2,-10,-4,-5,2,1],BU:[2,1,-4,8,-14,4,5,-1,-2]};
// rôles compatibles par poste historique (G/D/M/A)
const ROLES_OF={G:['GB'],D:['DC','DC','DC','LAT','LAT'],M:['MDC','MC','MC','MOC','AIL'],A:['BU','BU','BU','AIL','AIL']};
const RGROUP={GB:'G',DC:'D',LAT:'D',MDC:'M',MC:'M',MOC:'M',AIL:'A',BU:'A'};
function ensureRole(p){
  if(p.role&&p.ao)return p;
  const h=k=>hashN((p.id||1)*37+k);
  if(!p.role||RGROUP[p.role]===undefined){const opts=ROLES_OF[p.pos]||['MC'];p.role=opts[Math.floor(h(1)*opts.length)];}
  if(p.role==='AIL'&&p.pos==='M')p.pos='M';
  if(p.role2===undefined){const alt=Object.keys(ROFF).filter(r=>r!==p.role&&r!=='GB'&&p.pos!=='G');p.role2=h(2)<.3&&alt.length?alt[Math.floor(h(3)*alt.length)]:null;if(p.role2&&RGROUP[p.role2]!==RGROUP[p.role]&&h(4)<.5)p.role2=null;}
  const base=ROFF[p.role];p.ao=base.map((o,k)=>Math.round(o+(h(10+k)-.5)*14));
  return p;
}
function ageAdj(k,age,gk){if(gk)return k===4?clamp((age-24)*.6,-3,5):k===5?-Math.max(0,age-31)*.8:0;
  return k===0?-Math.max(0,age-27)*1.3:k===7?-Math.max(0,age-29):k===8?clamp((age-23)*.6,-3,5):k===5?-Math.max(0,age-31)*.8:k===4||k===6?clamp((age-22)*.3,-1,2):0;}
function attrVals(p){ensureRole(p);const gk=p.pos==='G';return p.ao.map((o,k)=>clamp(Math.round(p.ovr+o+ageAdj(k,p.age,gk)),15,99));}
attrs=function(p){const v=attrVals(p),names=p.pos==='G'?ATTR_G:ATTR_F;return names.map((n,k)=>({n,v:v[k]}));};
const KCAL={};for(const r in ROLE){let c=0;for(const k in ROLE[r].w)c+=ROLE[r].w[k]*ROFF[r][k];KCAL[r]=c;}
function roleFit(p,role){const v=attrVals(p),w=ROLE[role].w;if(p.pos==='G'&&role!=='GB')return 25;if(role==='GB'&&p.pos!=='G')return 20;let s=0;for(const k in w)s+=v[k]*w[k];return s-KCAL[role];}
function famPen(p,role){ensureRole(p);if(p.role===role||p.role2===role)return 0;if(role==='GB'||p.pos==='G')return 18;return RGROUP[role]===RGROUP[p.role]?2:5;}
// valeur d'un joueur dans un rôle (sur l'échelle de la note générale)
function roleVal(p,role){return p.ovr+(roleFit(p,role)-p.ovr)*.5-famPen(p,role);}
const FSLOTS={'4-4-2':['GB','LAT','DC','DC','LAT','AIL','MC','MC','AIL','BU','BU'],'4-3-3':['GB','LAT','DC','DC','LAT','MDC','MC','MC','AIL','BU','AIL'],'3-5-2':['GB','DC','DC','DC','LAT','MDC','MC','MOC','LAT','BU','BU'],'5-3-2':['GB','LAT','DC','DC','DC','LAT','MDC','MC','MC','BU','BU'],'4-2-3-1':['GB','LAT','DC','DC','LAT','MDC','MDC','AIL','MOC','AIL','BU']};
const SLOTG={'4-4-2':'GDDDDMMMMAA','4-3-3':'GDDDDMMMAAA','3-5-2':'GDDDMMMMMAA','5-3-2':'GDDDDDMMMAA','4-2-3-1':'GDDDDMMMMMA'};
function buildXI(form,av,sc){
  const slots=FSLOTS[form],order=[...slots.keys()].sort((a,b)=>({GB:0,BU:1,DC:2,MOC:3,AIL:4,MDC:5,LAT:6,MC:7})[slots[a]]-({GB:0,BU:1,DC:2,MOC:3,AIL:4,MDC:5,LAT:6,MC:7})[slots[b]]);
  const used=new Set(),res=new Array(slots.length);
  for(const i of order){const role=slots[i];let best=null,bv=-1e9;for(const p of av){if(used.has(p.id))continue;const v=roleVal(p,role)*(0.8+0.2*p.fit/100)+sc(p);if(v>bv){bv=v;best=p;}}
    if(best){used.add(best.id);res[i]={p:best,slot:SLOTG[form][i],role,pen:famPen(best,role),eff:roleVal(best,role)};}}
  // amélioration par échanges deux à deux
  for(let pass=0;pass<2;pass++)for(let i=0;i<res.length;i++)for(let j=i+1;j<res.length;j++){const a=res[i],b=res[j];if(!a||!b)continue;
    const cur=roleVal(a.p,a.role)+roleVal(b.p,b.role),sw=roleVal(b.p,a.role)+roleVal(a.p,b.role);
    if(sw>cur+.5){res[i]={p:b.p,slot:a.slot,role:a.role,pen:famPen(b.p,a.role),eff:roleVal(b.p,a.role)};res[j]={p:a.p,slot:b.slot,role:b.role,pen:famPen(a.p,b.role),eff:roleVal(a.p,b.role)};}}
  return res.filter(Boolean);
}
function xiValue(xi){return xi.reduce((s,e)=>s+e.eff*(0.8+0.2*e.p.fit/100),0)-(11-xi.length)*45;}
pickXI=function(){
  const rq=S.req||{play:[],bench:[]};
  let av=S.players.filter(p=>!p.inj&&!p.susp&&!p.loan);av.forEach(ensureRole);
  const noBench=av.filter(p=>!rq.bench.includes(p.id));if(noBench.length>=11)av=noBench;
  const sc=p=>(rq.play.includes(p.id)?100:0)+(p.promise==='Titulaire'&&S.gw-(p.joinGw||0)<=S.N?2.5:0);
  return buildXI(S.tactic.formation,av,sc);
};
// l'entraîneur choisit le système selon les profils
function bestFormation(){
  const c=S.staff.coach,av=S.players.filter(p=>!p.inj&&!p.susp&&!p.loan);av.forEach(ensureRole);const sc=()=>0;
  const res=Object.keys(FSLOTS).map(f=>{const xi=buildXI(f,av,sc);let v=xiValue(xi)/11+FORM[f].att*.15+FORM[f].def*.15;if(c&&c.form===f)v+=1.5*(c.stub||.5)+.6;return {f,v,xi};}).sort((a,b)=>b.v-a.v);
  return res;
}
const FORM_WHY={
 '4-4-2':xi=>{const b=xi.filter(e=>e.role==='BU').map(e=>pshort(e.p));return 'deux avant-centres complémentaires'+(b.length?' ('+b.join(' et ')+')':'')+' et des ailiers pour centrer';},
 '4-3-3':xi=>{const a=xi.filter(e=>e.role==='AIL').map(e=>pshort(e.p));return 'des ailiers rapides'+(a.length?' ('+a.join(' et ')+')':'')+' pour étirer la défense adverse';},
 '3-5-2':xi=>{const m=xi.filter(e=>e.slot==='M').map(e=>pshort(e.p));return 'un milieu fourni et des pistons capables de couvrir tout le couloir';},
 '5-3-2':xi=>{const d=xi.filter(e=>e.role==='DC').map(e=>pshort(e.p));return 'trois défenseurs centraux solides'+(d.length?' ('+d.join(', ')+')':'');},
 '4-2-3-1':xi=>{const m=xi.find(e=>e.role==='MOC');return 'un vrai meneur de jeu'+(m?' ('+pshort(m.p)+')':'')+' derrière l’attaquant, protégé par deux récupérateurs';}
};
function coachPickFormation(){
  const c=S.staff.coach;if(!c||S.req.formation)return;

function leagueCarry(){
  const sn=S._snap;S._snap=null;if(!sn||S.div>2)return;
  const L=LV[S.div],Lp=LV[sn.div],n=sn.teams.length,same=sn.div===S.div;
  let keep;
  if(same)keep=sn.teams.filter(t=>!t.user&&t.rank>Lp.promo&&t.rank<=n-Lp.rel);
  else if(S.div>sn.div)keep=sn.teams.filter(t=>!t.user&&t.rank<=Lp.promo);
  else keep=sn.teams.filter(t=>!t.user&&t.rank>n-Lp.rel);
  const ai=S.teams.filter(t=>!t.user),mid=(n+1)/2;
  keep=keep.slice(0,ai.length);
  keep.forEach((k,i)=>{const t=ai[i];let r=k.rating;
    if(same)r+=(mid-k.rank)*.12+rf(-1.5,1.5);else if(S.div>sn.div)r=Math.max(L.str[0]+rf(0,2),r+rf(0,1.5));else r=Math.min(L.str[1]+rf(-1,1),r-rf(0,1));
    r=clamp(r,L.str[0]-3,L.str[1]+3);
    t.name=k.name;t.rating=r;t.att=r+rf(-2.5,2.5);t.def=r+rf(-2.5,2.5);t.sq=sqTurnover(k.sq);if(k.c)t.c=k.c;
    t.last=k.rank+'e'+(same?'':' en '+Lp.n);t.tag=same?'':(S.div>sn.div?'promu':'relégué');});
  // les nouveaux venus : relégués de la division du dessus (plus forts) et promus du dessous
  const fresh=ai.slice(keep.length);const nTop=S.div<6?Math.min(fresh.length,LV[S.div+1].rel||2):0;
  fresh.forEach((t,i)=>{const top=i<nTop;const r=top?L.str[1]-rf(-.5,2):L.str[0]+rf(0,3);t.rating=r;t.att=r+rf(-2.5,2.5);t.def=r+rf(-2.5,2.5);t.tag=top?'relégué':'promu';t.last=top?'descend de '+LV[Math.min(6,S.div+1)].n:'monte de '+(S.div>0?LV[S.div-1].n:'Régional 3');});
  {const used=new Set(S.teams.map(t=>t.name));S.teams.forEach(t=>used.add('t:'+t.name.split(' ').slice(1).join(' ')));if(S.terr)used.add('t:'+S.terr.n);const tw=new Set(keep.map(k=>k.name.split(' ').slice(1).join(' ')));
   fresh.forEach(t=>{if(tw.has(t.name.split(' ').slice(1).join(' '))&&t.name!==S.rivalName){const nm=clubNameLocal(used);used.add(nm);t.name=nm;}});}

}

const FTAC={'4-3-3':['AIL','Les ailiers du 4-3-3 ont fait la différence sur les côtés','LAT','Le 4-3-3 a laissé trop d’espaces dans le dos des ailiers'],
 '4-4-2':['BU','Le duo d’attaque du 4-4-2 a pesé sur la défense adverse','MC','Le milieu à deux du 4-4-2 a souvent été pris en infériorité'],
 '3-5-2':['MC','Le milieu à cinq du 3-5-2 a confisqué le ballon','LAT','Les pistons du 3-5-2 n’ont pas réussi à défendre et attaquer à la fois'],
 '5-3-2':['DC','Le bloc bas du 5-3-2 n’a presque rien laissé passer','BU','Le 5-3-2 a manqué de solutions pour se projeter'],
 '4-2-3-1':['MOC','Le meneur du 4-2-3-1 a trouvé les espaces entre les lignes','BU','L’avant-centre du 4-2-3-1 s’est retrouvé trop isolé']};
function tacComment(r,lineup){
  const F=FTAC[S.tactic.formation];if(!F||!lineup.length)return '';
  const good=r.res==='V'||(r.res==='N'&&(r.poss>=55||r.ga===0));
  const key=lineup.filter(l=>l.role===(good?F[0]:F[2])).sort((a,b)=>good?b.note-a.note:a.note-b.note)[0];
  const out=[];
  out.push((good?F[1]:F[3])+(key?' ('+key.n+', '+String(key.note).replace('.',',')+')':'')+'.');
  const ce=lineup.filter(l=>l.ce);if(ce.length){const pl=ce.length>1,bad=ce.some(l=>l.note<5.5);const nms=ce.map(l=>l.n);out.push((nms.length>1?nms.slice(0,-1).join(', ')+' et '+nms[nms.length-1]:nms[0])+(pl?', alignés à contre-emploi, ':', aligné à contre-emploi, ')+(bad?(pl?'ont souffert.':'a souffert.'):(pl?'s’en sortent correctement.':'s’en sort correctement.')));}
  const m=S.tactic.mentality;
  if(m==='Offensif'&&r.ga>=3)out.push('Le choix de jouer offensif s’est payé cher derrière.');
  else if(m==='Offensif'&&r.gf>=3)out.push('L’animation offensive a porté ses fruits.');
  else if(m==='Défensif'&&r.gf===0)out.push('Prudent, l’équipe n’a presque rien tenté.');
  else if(m==='Défensif'&&r.ga===0)out.push('Le plan défensif a été appliqué à la lettre.');
  if(r.poss<=38)out.push('Avec '+r.poss+' % de possession, il a fallu courir après le ballon.');else if(r.poss>=62)out.push(r.poss+' % de possession : la maîtrise était de notre côté.');
  return out.join(' ');
}

function yPotSeen(p){const fo=slvl('formateur');if(fo>=3)return String(p.pot);const e=fo>=1?4:7;return Math.max(p.ovr,p.pot-e)+'-'+(p.pot+e);}
function yComment(p){
  const fo=slvl('formateur'),gap=p.pot-p.ovr,L=LV[S.div],mid=(L.str[0]+L.str[1])/2;const a=[];
  a.push(yProf(p));
  if(p.ovr>=mid-2)a.push('déjà au niveau de l’équipe première');else if(gap>=14)a.push(fo>=2?'un énorme potentiel':'semble avoir beaucoup de marge');else if(gap>=7)a.push('peut devenir un joueur de rotation');else a.push('plafond limité');
  if(fo>=2){const at=attrs(p).slice().sort((x,y)=>y.v-x.v);if(at[0])a.push('point fort : '+at[0].n.toLowerCase());}
  if(fo>=3)a.push('caractère '+(p.pers||'').toLowerCase());
  return a.join(', ')+'.';
}
// génération des U18 proposés par le formateur
function yGenCandidates(){
  const fl=S.infra.formation,fo=slvl('formateur'),L=LV[S.div];
  const gen=+rf(.85,1.2).toFixed(2);S.yGen=gen;
  const nK=2+Math.floor(fl/2)+(fo>=3?1:0),nC=nK+2+(S.yDetect||0);S.yDetect=0;
  const out=[];
  for(let k=0;k<nC;k++){
    const ovr=Math.round(L.str[0]-16+fl*1.6+fo*1+rf(-4,4)+(S.flags.youthBoost||0)*.5+(gen-1)*8);
    const p=genPlayer({age:ri(16,18),ovr,youth:true,contract:3});p.contract=Math.max(1,20-p.age);
    p.pot=clamp(Math.round(ovr+ri(4,15)+fl*1.2+fo*.8+(gen-1)*10+(R()<.08?ri(4,9):0)),ovr,94);
    p.wage=Math.max(40,Math.round(wageFor(ovr)*.4/10)*10);p.pers=pick(PERS);ensureRole(p);p.yst=p.age<=17?'aspirant':'stagiaire';
    out.push(p);
  }
  out.sort((a,b)=>(b.pot+b.ovr*.3)-(a.pot+a.ovr*.3));
  return {list:out,keep:nK};
}
function yFinishing(){return S.players.filter(p=>p.yst&&p.age>=19&&!p.loan);}
function yDefaultPro(p){const L=LV[S.div];return p.pot>=(L.str[0]+L.str[1])/2+2||p.ovr>=L.str[0]-3;}
function yIntakeStart(msgs){
  const c=yGenCandidates();S.yCand={ids:c.list.map(p=>p.id),keep:c.keep,pool:c.list};
  const fin=yFinishing();
  if(UI.multiRun){yIntakeApply(c.list.slice(0,c.keep).map(p=>p.id),fin.filter(yDefaultPro).map(p=>p.id),msgs);return;}
  UI.queue.push({type:'yintake'});
}
function yIntakeApply(keepIds,proIds,msgs){
  const C=S.yCand;if(!C)return;msgs=msgs||[];const kept=[];
  C.pool.forEach(p=>{if(keepIds.includes(p.id)&&squadN()<30){S.players.push(p);logMove(p,'Contrat aspirant','Formation du club',S.club.name,0,'in');kept.push(pname(p)+' ('+ensureRole(p).role+', '+p.ovr+')');}});
  const gq=S.yGen>=1.1?' Une génération exceptionnelle selon le formateur !':S.yGen<=.92?' Une génération modeste cette année.':'';
  if(kept.length)msgs.push('Centre de formation : '+kept.length+' contrat'+(kept.length>1?'s':'')+' aspirant signé'+(kept.length>1?'s':'')+' — '+kept.join(', ')+'.'+gq);
  // fin de formation
  yFinishing().forEach(p=>{
    if(proIds.includes(p.id)){p.yst=null;p.contract=3;p.wage=Math.max(p.wage,Math.round(wageFor(p.ovr)*.85/10)*10);p.morale=clamp(p.morale+10,0,100);logMove(p,'Premier contrat pro','Formation du club',S.club.name,0,'in');msgs.push(pname(p)+' signe son premier contrat '+(yPro()?'professionnel':'senior')+'.');}
    else{S.players=S.players.filter(x=>x!==p);logMove(p,'Fin de formation',S.club.name,R()<.5?'Libre':clubName(new Set()),0,'out');msgs.push(pname(p)+' n’est pas conservé à l’issue de sa formation.');}
  });
  // statut des autres jeunes
  S.players.forEach(p=>{if(p.yst){p.yst=p.age<=17?'aspirant':'stagiaire';if(p.yst==='stagiaire')p.wage=Math.max(p.wage,Math.round(wageFor(p.ovr)*.6/10)*10);}});
  S.yCand=null;
}

function seasonExtrasData(){
  const y=seasonLabel(S.year),out={},R_=S.records||(S.records={});
  // partenariats
  const spInc=(S.sf.inc||{}).Sponsors||0;const signed=(S.spSigned||[]).filter(x=>x.y===S.year);
  out.sp={inc:spInc,signed};
  // recrutement
  const mis=(S.misHist||[]).filter(h=>h.y===y);
  const fromMis=S.players.filter(p=>p.mis&&(p.moves||[]).some(m=>m.y===y&&m.to===S.club.name));
  out.rec={mis:mis.length,auto:mis.filter(h=>h.auto).length,signed:fromMis.map(p=>({id:p.id,n:pname(p)}))};
  // formation
  const ac=S.players.filter(p=>((p.moves||[]).some(m=>m.type==='Contrat aspirant'||m.type==='Centre de formation')||(p.age<=21&&!(p.moves||[]).length))&&p.s&&(p.s.mj+p.s.cmj)>0).sort((a,b)=>(b.s.mj+b.s.cmj)-(a.s.mj+a.s.cmj));
  out.yo=ac.slice(0,3).map(p=>({id:p.id,n:pname(p),mj:p.s.mj+p.s.cmj,age:p.age}));
  // homme du match
  const mo=S.players.filter(p=>p.s&&p.s.motm).sort((a,b)=>b.s.motm-a.s.motm)[0];
  out.motm=mo?{id:mo.id,n:pname(mo),c:mo.s.motm}:null;
  // confrontations de la saison
  const per={};(S.myResults||[]).forEach(r=>{const o=per[r.opp]||(per[r.opp]={pts:0,lost:0,n:0});o.n++;const p=r.res==='V'?3:r.res==='N'?1:0;o.pts+=p;o.lost+=3-p;});
  const ar=Object.entries(per);
  const bete=ar.filter(([,o])=>o.lost>=4).sort((a,b)=>b[1].lost-a[1].lost)[0];
  const fav=ar.filter(([,o])=>o.pts===6).sort((a,b)=>b[1].pts-a[1].pts)[0];
  out.h2h={bete:bete?bete[0]:null,fav:fav?fav[0]:null};
  // records du club
  const nr=[];
  const big=(S.myResults||[]).slice().sort((a,b)=>(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)[0];
  if(big&&big.gf-big.ga>=3&&(!R_.win||big.gf-big.ga>R_.win.d)){R_.win={d:big.gf-big.ga,s:big.gf+'-'+big.ga,opp:big.opp,y};nr.push('Plus large victoire de l’histoire du club : '+big.gf+'-'+big.ga+' contre '+big.opp+'.');}
  const att=(S.myResults||[]).filter(r=>r.att).sort((a,b)=>b.att-a.att)[0];
  if(att&&(!R_.att||att.att>R_.att.v)){const first=!R_.att;R_.att={v:att.att,opp:att.opp,y};if(!first)nr.push('Record d’affluence : '+nf(att.att)+' spectateurs contre '+att.opp+'.');}
  const sc=S.players.filter(p=>p.s).sort((a,b)=>(b.s.g+b.s.cg)-(a.s.g+a.s.cg))[0];
  if(sc&&(sc.s.g+sc.s.cg)>=8&&(!R_.sc||sc.s.g+sc.s.cg>R_.sc.v)){const first=!R_.sc;R_.sc={v:sc.s.g+sc.s.cg,n:pname(sc),y};if(!first)nr.push('Record de buts sur une saison : '+pname(sc)+' ('+(sc.s.g+sc.s.cg)+').');}
  const me=S.teams.find(t=>t.user);if(me){const k='pts'+S.div;if(!R_[k]||me.Pts>R_[k].v){const first=!R_[k];R_[k]={v:me.Pts,y};if(!first)nr.push('Record de points en '+LV[S.div].n+' : '+me.Pts+'.');}}
  out.records=nr;
  return out;
}
function seasonExtras(e){
  if(!e.ext)e.ext=seasonExtrasData();const x=e.ext;
  const blk=(t,b)=>`<div class="bx"><b>${t}</b><div>${b}</div></div>`;
  const parts=[];
  parts.push(blk('🤝 Partenaires',`${money(x.sp.inc)} de sponsoring${x.sp.signed.length?' · nouveaux contrats : '+x.sp.signed.map(s=>esc(s.b)).join(', '):''}`));

  parts.push(blk('🎓 Formation',x.yo.length?x.yo.map(p=>plk(p.id,p.n)+' ('+p.mj+' match'+(p.mj>1?'s':'')+')').join(', '):'Aucun jeune formé au club n’a joué'));

  return `<div class="bxgrid">${parts.join('')}</div>${x.records.length?x.records.map(r=>`<div class="alert g">🏅 ${esc(r)}</div>`).join(''):''}`;
}

function hexLum(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};return .2126*f(r)+.7152*f(g)+.0722*f(b);}
function hexSat(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx?(mx-mn)/mx:0;}
// couleur d'accent lisible sur fond sombre : couleur 1 du club, sinon couleur 2, sinon l'or du jeu
function clubAccent(){const ok=c=>{const l=hexLum(c);return l>.06&&l<.85&&hexSat(c)>.25;};return ok(S.club.c1)?S.club.c1:ok(S.club.c2)?S.club.c2:'#e8c214';}
function nextDerby(){const ri=S.teams.findIndex(t=>t.name===S.rivalName);if(ri<0||!S.sched)return null;for(let k=S.week;k<S.N;k++){for(const [h,a] of S.sched[k]){if((S.teams[h].user&&a===ri)||(S.teams[a].user&&h===ri))return {j:k+1,home:S.teams[h].user};}}return null;}

  if(o.age!=null&&o.age>=29){p.ovr=clamp(p.ovr+ri(1,3),25,92);p.pot=p.ovr;}
  p.ovr=clamp(p.ovr+Math.round(rec*.6-.5)+(o.ovr||0),25,92);p.pot=Math.max(p.pot,p.ovr);

function misFind(m){

// sans consigne, le recruteur choisit lui-même sa mission
function misAutoPick(){

  const wi=winInfo(),soon=wi.cur||(wi.next&&wi.next.a-S.week<=3);
  if(an&&an.rec.length&&soon){
    const P=an.rec[0],roles=[...new Set(ROLES_OF[P.k])];
    const cnt=r=>S.players.filter(p=>!p.loan&&(ensureRole(p).role===r||p.role2===r)).length;
    const role=roles.sort((a,b)=>cnt(a)-cnt(b))[0];
    return {k:'poste',role,why:'le poste '+ROLE[role].n.toLowerCase()+' est le plus faible de l’effectif'};
  }
  const exp=S.players.filter(p=>!p.loan&&p.contract<=1).length;
  if(exp>=4&&soon)return {k:'libres',why:exp+' contrats expirent bientôt'};
  if(nf&&rec>=2&&(nf.opp.derby||nf.opp.rating>=strength().ovr))return {k:'adv',why:'le prochain adversaire ('+nf.opp.name+') est un gros morceau'};
  if(soon)return {k:pick(['jeunes','region','inf']),why:'préparer le prochain mercato'};

  const last=(S.misHist||[])[0];if(last&&last.l===misLabel(c)){c=S.players.filter(p=>!p.loan&&p.contract<=1).length>=3?{k:'libres',why:'des contrats arrivent à échéance'}:{k:pick(['jeunes','region','inf']),why:'élargir les pistes après sa dernière mission'};}
  if(S.cash<misCost(c.k)*8)return;
  if(misStart(c.k,c.role,true)){S.mission.why=c.why;}
}
function misOppBonus(me,nf){

A.misSend=function(){

A.misReport=function(){

   <div class="row">${ps.length&&!windowOpen()?'<span class="muted" style="font-size:13px">Mercato fermé : vous pourrez négocier (ou proposer un pré-contrat) à la réouverture. Ils restent dans votre liste de suivi.</span>':''}<button class="btn" onclick="A.close()">Fermer</button></div>`,true);
};
function misComment(p){
  const rec=slvl('recruteur'),gap=p.pot-p.ovr,mid=(LV[S.div].str[0]+LV[S.div].str[1])/2;
  const a=[];
  if(p.ovr>=mid+3)a.push('Il serait titulaire tout de suite chez nous');else if(p.ovr>=mid-1)a.push('Niveau de la division, solide en rotation');else a.push('Un peu juste pour l’instant');
  if(gap>=10)a.push(rec>=2?'énorme marge de progression':'il a l’air d’avoir de la marge');else if(gap>=4)a.push('peut encore progresser');
  if(rec>=2){const at=attrs(p).slice().sort((x,y)=>y.v-x.v);if(at[0])a.push('point fort : '+at[0].n.toLowerCase());}
  if(p.local)a.push('attaché à la région');
  if(rec>=3)a.push('caractère '+p.pers.toLowerCase());
  return a.join(', ')+'.';
}

  const hist=(S.misHist||[]).slice(0,4).map(h=>`<div class="muted" style="font-size:12.5px">${h.y} J${h.j} · ${esc(h.l)} → ${esc(h.r)}${h.auto?' <span class="pill">son initiative</span>':''}</div>`).join('');
  const cur=m?`<div class="spread"><div><b>${MIS[m.k].ic} En mission : ${esc(misLabel(m))}</b><br><span class="muted" style="font-size:13px">${m.auto?'Choisie par '+esc(w.name)+(m.why?' : '+esc(m.why):'')+'. ':''}Retour ${m.end-S.gw<=1?'après la prochaine journée':'dans '+(m.end-S.gw)+' journées'}.</span></div><button class="btn sm" onclick="A.misCancel()">Rappeler</button></div>`
   :`<div class="row" style="flex-wrap:wrap;gap:8px"><select id="misK" onchange="A.misK(this.value)">${Object.entries(MIS).map(([kk,v])=>`<option value="${kk}" ${kk===k?'selected':''}>${v.ic} ${v.n}</option>`).join('')}</select>
     ${k==='poste'?`<select id="misR">${Object.entries(ROLE).map(([r,v])=>`<option value="${r}">${v.n}</option>`).join('')}</select>`:''}

  return `<div class="card"><header><h3>🕵️ Cellule de recrutement</h3><span class="muted" style="font-size:13px">${esc(w.name)} ${stars(rec)}</span></header>${cur}

}

 pelouse:{w:1,cond:()=>S.div<=3&&S.week>2,make:()=>({c:smallAmt(.04)}),k:'Installations',title:'La pelouse est un champ de patates',

 recordAffluence:{w:.8,cond:()=>S.week>5&&S.mood>65,make:()=>({}),k:'Supporters',title:'Les supporters veulent un déplacement en bus',

 agentMalin:{w:.9,cond:()=>S.week>3,make:()=>{const p=pick(topPlayers(5,p=>!p.loan&&p.contract>=2));return p?{pid:p.id}:null;},k:'Mercato',title:'Un agent fait monter les enchères',
  text:d=>`L’agent de ${pname(getP(d.pid))} laisse entendre dans la presse que « plusieurs clubs sont intéressés ». Il réclame une revalorisation de 15 %.`,
  ch:[{t:'Revaloriser son salaire',f:d=>{const p=getP(d.pid);p.wage=Math.round(p.wage*1.15/10)*10;p.morale=clamp(p.morale+10,0,100);return pname(p)+' est rassuré.';}},{t:'Ne pas céder au chantage',f:d=>{const p=getP(d.pid);p.morale=clamp(p.morale-12,0,100);return 'L’agent claque la porte. '+pname(p)+' est moins motivé.';}}]}
};

 vol:{w:1,cond:()=>S.div<=3,make:()=>({c:smallAmt(.03)}),k:'Insolite',title:'Cambriolage au local du club',

 concert:{w:.9,cond:()=>S.infra.stade>=3&&S.week>2,make:()=>({g:smallAmt(.06)}),k:'Économie',title:'Un concert dans votre stade ?',

 diplome:{w:.9,make:()=>{const p=pick(S.players.filter(p=>!p.loan&&p.age>=30));return p?{pid:p.id}:null;},k:'Vestiaire',title:'Un cadre passe ses diplômes d’entraîneur',

function migrate(){
  S.transfers=S.transfers||[];S.rec=S.rec||{};S.watch=S.watch||[];S.talks=S.talks||{};S.offers=S.offers||[];S.pre=S.pre||[];S.scouting=S.scouting||{};
  (S.market||[]).forEach(p=>{if(!p.pers)p.pers=pick(PERS);if(p.firm==null)p.firm=.85;});S.req=S.req||{play:[],bench:[]};S.req.play=S.req.play||[];S.req.bench=S.req.bench||[];S.reqLog=S.reqLog||[];S.roundRes=S.roundRes||[];
  S.players.forEach(p=>{if(!p.s)p.s=Object.assign(newS(),{mj:p.sa||0,g:p.sg||0});p.assists=p.assists||0;p.hist=p.hist||[];p.moves=p.moves||[];});
  (S.teams||[]).forEach(t=>{if(!t.user&&!t.sq)t.sq=genSq();});
  ensureCoach(S.staff.coach);
}
function boot(data){
  try{const lp=localStorage.getItem('president-club-lite');document.body.classList.toggle('lite',lp==='1'||(lp===null&&/Electron/.test(navigator.userAgent)));}catch(e){}
  let saved=data&&data.S?data.S:null;
  try{const n=+(localStorage.getItem('president-club-slot')||1);if(n>=1&&n<=SLOTS)KEY=keyFor(n);}catch(e){}
  if(!saved){try{const t=localStorage.getItem(KEY);if(t)saved=JSON.parse(t);}catch(e){}}
  if(saved&&saved.v===1){S=saved;migrate();S.track=S.track||{cash:[],pos:[]};S.sf.fi=S.sf.fi||{};UI.tab=(data&&data.tab)||'accueil';render();if(S.over)UI.queue.push({type:'over'});nextQueue();}
  else renderStart();
}
/* ---------- Trousse de test (outils-communs/testkit.js) ---------- */
const TK=Testkit({jeu:'president',secours:true,canvas:()=>document.createElement('canvas'),capture:()=>domCapture(document.body),
 etat:()=>S?{onglet:UI.tab,test:TEST.on,club:S.club.name,division:LV[S.div].n,saison:S.year,semaine:S.week,tresorerie:Math.round(S.cash),humeur:Math.round(S.mood),confiance:Math.round(S.confidence),
  fenetre:UI.modalOpen?(document.getElementById('mbox').innerText||'').slice(0,600):'',actus:(S.news||[]).slice(0,10).map(n=>n.w+' '+n.t),allege:document.body.classList.contains('lite'),sauvegarde:JSON.stringify(S).slice(0,180000)}:{ecran:'accueil',allege:document.body.classList.contains('lite')}});
TK.bouton(document.body,'position:fixed;right:8px;bottom:8px;z-index:70;width:34px;height:34px;border-radius:50%;opacity:.55;border:1px solid #3c5a48;background:#14201a;color:#fff;font-size:16px;line-height:1;cursor:pointer;padding:0');
// Mode test : partie d'essai jamais sauvegardée (toutes les clés « president-club… » sont gelées), banc de fluidité sur les onglets et un match en direct.
const TEST={on:false};
const tkWait=ms=>new Promise(r=>setTimeout(r,ms));
function tkClear(){UI.queue=[];UI.evBack=null;UI.backFn=null;stopRep();document.getElementById('modal').classList.add('hidden');UI.modalOpen=false;}
function tkScroll(ms){const t0=performance.now(),max=Math.max(0,document.documentElement.scrollHeight-innerHeight);if(!max)return;const f=t=>{const k=(t-t0)/ms;if(k>=1){scrollTo(0,0);return;}scrollTo(0,max*(k<.5?k*2:2-k*2));requestAnimationFrame(f);};requestAnimationFrame(f);}
A.modeTest=async function(){
 if(TEST.on)return;TEST.on=true;TK.modeTest();
 const P=Storage.prototype;TEST.set=P.setItem;TEST.rem=P.removeItem;TEST.key=KEY;
 P.setItem=function(k,v){if(TEST.on&&/^president-club/.test(String(k)))return;return TEST.set.call(this,k,v);};
 P.removeItem=function(k){if(TEST.on&&/^president-club/.test(String(k)))return;return TEST.rem.call(this,k);};
 if(TK.ov&&!TK.ov.querySelector('button')){const b=document.createElement('button');b.textContent='Quitter le test';b.style.cssText='margin-left:8px;font:11px system-ui;padding:2px 6px;border-radius:4px;cursor:pointer';b.onclick=()=>A.quitTest();TK.ov.appendChild(b);}
 UI.setup.real=null;UI.setup.diff=1;renderStart();document.getElementById('cTown').value='Clichy';document.getElementById('cName').value='Banc d’essai FC';A.create();await tkWait(400);tkClear();
 const tabs=[['accueil','Accueil'],['calendrier','Calendrier'],['classement','Classement'],['stats','Statistiques'],['effectif','Effectif'],['mercato','Mercato'],['staff','Staff'],['infra','Installations'],['finances','Finances'],['coupe','Coupe'],['club','Club']];
 const res=[];toast('Mode test : mesure en cours (environ 45 s), ne touchez à rien.');
 for(const [t,n] of tabs){if(!TEST.on)return;try{tkClear();A.tab(t);await tkWait(500);const r=[];for(let k=0;k<5;k++){const t0=performance.now();render();r.push(performance.now()-t0);}r.sort((a,b)=>a-b);
   tkScroll(2500);const m=await TK.mesurer(2500);res.push(Object.assign({scene:n,rendu_ms:+r[2].toFixed(1)},m));}catch(e){res.push({scene:n,erreur:String(e).slice(0,200)});}}
 try{tkClear();A.tab('accueil');const opp=S.teams.find(t=>!t.user);coachDecide(opp);const d=userMatch(true,opp,strength(),false,false);d.opp={name:opp.name,rating:opp.rating};d.comp='Mode test · match en direct';d.home=true;
   UI.queue=[{type:'report',d}];nextQueue();await tkWait(800);res.push(Object.assign({scene:'Match en direct'},await TK.mesurer(5000)));}catch(e){res.push({scene:'Match en direct',erreur:String(e).slice(0,200)});}
 if(!TEST.on)return;tkClear();
 const out={jeu:'president',date:new Date().toISOString(),gpu:(()=>{try{const g=document.createElement('canvas').getContext('webgl'),x=g.getExtension('WEBGL_debug_renderer_info');return x?g.getParameter(x.UNMASKED_RENDERER_WEBGL):g.getParameter(g.RENDERER);}catch(e){return '?';}})(),
  ua:navigator.userAgent,ecran:innerWidth+'x'+innerHeight+' @'+devicePixelRatio,allege:document.body.classList.contains('lite'),res};
 out.enregistre=await TK.envoyer('mesures_'+Date.now(),out);out.base=TK.base;TEST.last=out;
 const cell=v=>v==null?'—':v;
 openModal(`<div class="kicker">🧪 Mode test</div><h2>Mesures de fluidité</h2><p class="muted" style="font-size:13px">${esc(out.ecran)} · affichage ${out.allege?'allégé':'complet'} · ${esc(String(out.gpu).slice(0,60))}</p>
  <div class="tbl-wrap"><table><thead><tr><th>Écran</th><th class="r">Rendu</th><th class="r">img/s</th><th class="r">1 % bas</th><th class="r">Pire</th></tr></thead><tbody>${res.map(x=>`<tr><td>${esc(x.scene)}</td><td class="r">${x.rendu_ms!=null?x.rendu_ms+' ms':'—'}</td><td class="r">${cell(x.fps)}</td><td class="r">${cell(x.bas1)}</td><td class="r">${x.pire!=null?x.pire+' ms':(x.erreur?'erreur':'—')}</td></tr>`).join('')}</tbody></table></div>
  <p style="font-size:13px">${out.enregistre?'✓ Mesures envoyées à Claude.':'Les mesures n’ont pas pu être envoyées automatiquement (base de l’artefact non activée). Utilisez « Rapport à copier » pour les transmettre à Claude.'}</p>
  <div class="row">${out.enregistre?'':'<button class="btn" onclick="TK.rapport(TEST.last,\'Mesures de fluidité\')">Rapport à copier</button>'}<button class="btn" onclick="A.modeTestAgain()">Recommencer</button><button class="play" onclick="A.quitTest()">Quitter le mode test</button></div>`);
};
A.modeTestAgain=function(){tkClear();TEST.on=false;A.quitTest(true);A.modeTest();};
A.quitTest=function(keepOv){const P=Storage.prototype;if(TEST.set){P.setItem=TEST.set;P.removeItem=TEST.rem;}TEST.on=false;TK.test=false;KEY=TEST.key||KEY;S=null;tkClear();UI.tab='accueil';
 if(!keepOv&&TK.ov){TK.ov.remove();TK.ov=null;}renderStart();scrollTo(0,0);};
const _saveTK=save;save=function(){if(TEST.on)return;_saveTK();};
try{window.claude?.hot?.snapshot?.(()=>({S,tab:UI.tab}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
