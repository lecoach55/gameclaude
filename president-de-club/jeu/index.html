<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Président de Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Un stade de nuit sous projecteurs : pelouse sombre, traits de craie, tableau d'affichage ambré. Thème unique. */
:root{
  --night:#0c1410; --turf:#13201a; --turf2:#192a21; --line:#2b4034;
  --chalk:#e9efe5; --muted:#91a596; --flood:#f4c430; --flood-ink:#1b1606;
  --good:#5ccf88; --bad:#ff6a5c; --warn:#f2a03a;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--night);
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 80px,transparent 80px 160px);
  color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.45;
}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;text-wrap:balance;margin:0;font-weight:800;text-transform:uppercase}
h2{font-size:26px;line-height:1}
h3{font-size:19px;line-height:1.05}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .gold{color:var(--flood)}
a{color:var(--flood)}

/* ---------- En-tête tableau d'affichage ---------- */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:16px clamp(16px,3vw,32px);border-bottom:2px solid var(--line);background:linear-gradient(180deg,#0f1a14,var(--night))}
.crest{width:58px;height:66px}
.ident h1{font-size:clamp(26px,4vw,40px);line-height:.9;font-weight:900}
.ident .sub{color:var(--muted);font-size:13px;margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.board{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);background:#070c09;border-radius:6px;overflow:hidden}
.board .cell{flex:1 1 130px;padding:8px 14px;border-right:1px solid var(--line)}
.board .cell:last-child{border-right:0}
.board .lab{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.board .val{font-family:var(--display);font-size:26px;font-weight:800;color:var(--flood);line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(244,196,48,.35)}
.board .val.neg{color:var(--bad);text-shadow:0 0 12px rgba(255,106,92,.35)}
.meter{height:5px;background:#203128;border-radius:3px;margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--flood)}
.play{background:var(--flood);color:var(--flood-ink);border:0;border-radius:6px;padding:14px 22px;font-family:var(--display);font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;box-shadow:0 0 0 0 rgba(244,196,48,.5);transition:transform .1s, box-shadow .2s}
.play:hover{box-shadow:0 0 24px rgba(244,196,48,.45)}
.play:active{transform:translateY(1px)}
.play:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.play small{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.06em;opacity:.75}

/* ---------- Onglets ---------- */
.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 clamp(16px,3vw,32px);border-bottom:1px solid var(--line);background:var(--night);position:sticky;top:0;z-index:5}
.tabs button{background:none;border:0;padding:12px 14px;color:var(--muted);font-family:var(--display);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--chalk)}
.tabs button.on{color:var(--chalk);border-bottom-color:var(--flood)}
.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-left:5px;vertical-align:3px}

main{padding:20px clamp(16px,3vw,32px) 60px;max-width:1320px;margin:0 auto;display:grid;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.card{background:var(--turf);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.card.hl{border-color:var(--flood)}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.chalk{border-top:1px dashed var(--line);margin:2px 0}

.btn{background:var(--turf2);border:1px solid var(--line);color:var(--chalk);border-radius:5px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--flood);color:var(--flood-ink);border-color:var(--flood)}
.btn.dan{border-color:#6b2a24;color:#ffb3aa}
.btn.sm{padding:4px 8px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--flood);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#0e1813;white-space:nowrap}
.pill.g{color:var(--good);border-color:#2d5a3f}.pill.b{color:var(--bad);border-color:#6b2a24}.pill.w{color:var(--warn);border-color:#6a4a1f}.pill.y{color:var(--flood);border-color:#6b5717}
.form{display:inline-flex;gap:3px}
.form i{width:20px;height:20px;border-radius:3px;display:inline-grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#08110c}
.form .V{background:var(--good)}.form .N{background:#b8c2b9}.form .D{background:var(--bad)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 10px;background:#0f1a14;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #1e2f25;white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.me td{background:rgba(244,196,48,.08);color:var(--flood);font-weight:700}
tr.zone-up td:first-child{box-shadow:inset 3px 0 0 var(--good)}
tr.zone-down td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
td.r,th.r{text-align:right}
th.sort{cursor:pointer}
.pos{display:inline-grid;place-items:center;width:24px;height:20px;border-radius:3px;font-size:11px;font-weight:800;color:#08110c}
.pos.G{background:#f4c430}.pos.D{background:#6cb6ff}.pos.M{background:#5ccf88}.pos.A{background:#ff8a70}
.ovr{font-family:var(--display);font-size:19px;font-weight:800}
.stars{color:var(--flood);letter-spacing:1px}
.stars s{color:#3a4f42;text-decoration:none}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#0f1a14;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}

.feed{display:grid;gap:6px;max-height:340px;overflow:auto;padding-right:4px}
.feed div{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:14px;padding:5px 0;border-bottom:1px solid #1e2f25}
.feed b{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500;padding-top:2px}
.alerts{display:grid;gap:6px}
.alert{padding:8px 10px;border-radius:5px;border-left:3px solid var(--warn);background:#1c1b12;font-size:14px}
.alert.b{border-left-color:var(--bad);background:#211412}
.alert.g{border-left-color:var(--good);background:#11201a}

.match-next{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.match-next .t{font-family:var(--display);font-size:24px;font-weight:800;line-height:1;text-transform:uppercase}
.match-next .vs{font-family:var(--display);color:var(--flood);font-size:30px;font-weight:900}
.cmp{display:grid;grid-template-columns:70px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.cmp .bar{height:8px;background:#203128;border-radius:4px;overflow:hidden;position:relative}
.cmp .bar i{position:absolute;top:0;bottom:0;left:0;background:var(--flood)}
.cmp .bar i.o{background:#6cb6ff}

.build{height:8px;background:#203128;border-radius:4px;overflow:hidden}
.build i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--flood) 0 8px,#d9a91c 8px 16px)}

/* ---------- Modale ---------- */
.modal{position:fixed;inset:0;background:rgba(3,6,4,.78);display:grid;place-items:center;z-index:50;padding:16px;overflow:auto}
.modal.hidden{display:none}
.mbox{background:var(--turf);border:1px solid var(--line);border-radius:10px;max-width:640px;width:100%;padding:22px;display:grid;gap:14px;max-height:calc(100% - 20px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mbox.wide{max-width:820px}
.mbox .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--flood);font-weight:700}
.mbox h2{font-size:30px}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--turf2);border:1px solid var(--line);border-radius:6px;padding:11px 14px;cursor:pointer;font-weight:600}
.choice:hover{border-color:var(--flood)}
.choice small{display:block;font-weight:400;color:var(--muted);margin-top:2px}

.scoreboard{background:#050806;border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.scoreboard .tn{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;line-height:1}
.scoreboard .tn.me{color:var(--flood)}
.digits{font-family:var(--display);font-weight:900;font-size:64px;line-height:.9;color:var(--flood);text-shadow:0 0 18px rgba(244,196,48,.5);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.digits em{font-style:normal;color:#5e5222;margin:0 6px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.tl li{display:grid;grid-template-columns:38px 74px 1fr;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid #1e2f25}
.tl .m{font-family:var(--mono);color:var(--muted);font-size:12px}
.tag{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:3px;text-align:center;letter-spacing:.05em}
.tag.goal{background:var(--flood);color:var(--flood-ink)}.tag.goalo{background:#2a3a31;color:var(--chalk)}
.tag.occ{background:#3a4a41;color:var(--chalk)}.tag.save{background:#2c5d8a;color:#eaf4ff}.motm{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:10px;background:rgba(232,194,20,.1);border:1px solid rgba(232,194,20,.35);font-size:14px}.tacnote{font-size:13.5px;padding:8px 12px;border-left:3px solid var(--flood,#e8c214);background:rgba(255,255,255,.03);border-radius:6px}
.tag.yc{background:#e8d23a;color:#1b1606}.tag.rc{background:var(--bad);color:#200}.tag.inj{background:#6cb6ff;color:#06121e}
.statbar{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.statbar .b{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#6cb6ff}
.statbar .b i{background:var(--flood)}
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px;font-size:13px}
.lineup div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dotted #2a3d31;padding:2px 0}

label.fld{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input[type=text],select{background:#0b130f;border:1px solid var(--line);border-radius:5px;padding:8px 10px;color:var(--chalk)}
input[type=range]{width:100%;accent-color:var(--flood)}
textarea{width:100%;min-height:90px;background:#0b130f;border:1px solid var(--line);border-radius:5px;color:var(--chalk);font-family:var(--mono);font-size:11px;padding:8px}

#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:grid;gap:6px;z-index:60;width:min(92vw,460px)}
.toast{background:#050806;border:1px solid var(--flood);color:var(--chalk);padding:10px 14px;border-radius:6px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}

/* ---------- Écran de départ ---------- */
.start{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.start .inner{max-width:760px;width:100%;display:grid;gap:22px}
.start h1{font-size:clamp(52px,10vw,112px);line-height:.82;font-weight:900}
.start h1 span{color:var(--flood);display:block}
.start .lede{font-size:17px;max-width:60ch;color:#c9d4c9}
.ladder{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--display);font-size:14px;text-transform:uppercase;font-weight:700;letter-spacing:.05em}
.ladder span{padding:4px 9px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.ladder span:first-child{color:var(--flood);border-color:var(--flood)}
.ladder span:last-child{color:var(--chalk)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:44px;height:30px;border-radius:4px;border:2px solid transparent;cursor:pointer;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;padding:0}
.sw.on{border-color:var(--chalk)}
.diff{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.diff button{text-align:left;background:var(--turf);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.diff button.on{border-color:var(--flood);background:#1d2a17}
.diff b{display:block;font-family:var(--display);font-size:19px;text-transform:uppercase}
.diff small{color:var(--muted)}


.mbox>*{min-width:0}
.scoreboard{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.scoreboard .tn{overflow-wrap:anywhere}
.scoreboard.flash{animation:flash .6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(244,196,48,.85);border-color:var(--flood)}100%{box-shadow:0 0 0 22px rgba(244,196,48,0)}}
.clock{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:6px;text-align:center}
.tl li.pend,.later{display:none!important}
.tl li.in{animation:slidein .35s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.match-next{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{font:11px var(--mono);fill:var(--muted)}
.odds{display:flex;height:22px;border-radius:4px;overflow:hidden;font-size:11px;font-weight:800;color:#08110c}
.odds span{display:grid;place-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.odds .w{background:var(--good)}.odds .d{background:#b8c2b9}.odds .l{background:var(--bad)}
.stadium{width:100%;max-width:760px;height:auto;display:block;margin:0 auto;border-radius:6px;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.pitch-wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.pitch{width:100%;height:auto;display:block;border-radius:6px}
.pitch .pv{font:800 17px var(--display)}
.pitch .pn{font:600 11.5px var(--body);fill:#e9efe5}
.bench{display:grid;gap:4px;font-size:14px}
.bench div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dotted #2a3d31}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.025)}
.potbar{position:relative;height:10px;background:#203128;border-radius:5px;margin-top:6px}
.potbar i{position:absolute;left:0;top:0;bottom:0;background:var(--flood);border-radius:5px}
.potbar b{position:absolute;top:-4px;width:3px;height:18px;background:var(--good);border-radius:2px}
.road{display:grid;gap:10px}
.road .step{border-left:3px solid var(--line);padding:2px 0 2px 12px}
.road .step.ok{border-left-color:var(--good)}
.road .step.next{border-left-color:var(--flood)}
.road h4{margin:0 0 4px;font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.road ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:13.5px}
.road li::before{content:'○ ';color:var(--bad)}
.road li.ok::before{content:'● ';color:var(--good)}
@media (max-width:820px){.pitch-wrap{grid-template-columns:1fr}}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);font-family:var(--display);font-size:16px;font-weight:700;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.subtabs button.on{color:var(--chalk);border-bottom-color:var(--flood)}
.radar{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.radar text{font:600 11px var(--body);fill:var(--muted)}
.attr{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.attr .bar{height:7px;background:#203128;border-radius:4px;overflow:hidden}.attr .bar i{display:block;height:100%;background:var(--flood)}
.cal-row td{vertical-align:middle}
tr.next td{background:rgba(244,196,48,.06)}
tr.cupr td{background:rgba(108,182,255,.06)}
tr.sep td{background:#0f1a14;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;padding:5px 10px}
tr.det td{background:#0b130f;padding:4px 10px 10px}
.mini td{padding:3px 8px;font-size:13px;border:0}
.resb{display:inline-grid;place-items:center;min-width:46px;padding:2px 6px;border-radius:4px;font-weight:800;font-variant-numeric:tabular-nums;color:#08110c}
.resb.V{background:var(--good)}.resb.N{background:#b8c2b9}.resb.D{background:var(--bad)}
.rank1 td:first-child{color:var(--flood);font-weight:800}
thead th{cursor:pointer;user-select:none}
thead th:hover{color:var(--chalk)}
thead th.on{color:var(--flood)}
thead th[tabindex]{cursor:pointer;user-select:none}
thead th[tabindex]:hover{color:var(--chalk);background:#13211a}
thead th[tabindex]:not(.on)::after{content:'↕';margin-left:4px;opacity:.35;font-size:10px}
.wintl{display:grid;gap:6px}
.wintl .bar{display:flex;gap:2px;height:22px}
.wintl .bar i{flex:1;border-radius:2px;background:#1c2b22;position:relative}
.wintl .bar i.w{background:#5e4d14}
.wintl .bar i.w.now,.wintl .bar i.now{outline:2px solid var(--chalk);outline-offset:1px}
.wintl .bar i.past{opacity:.45}
.wintl .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--mono)}
.mtabs{display:flex;gap:4px;flex-wrap:wrap}
.status{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;text-transform:uppercase}
.rules{margin:0;padding-left:18px;display:grid;gap:3px;font-size:13.5px;color:#c9d4c9}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.steps div{padding:6px 8px;border-radius:4px;background:#0f1a14;border:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}
.steps div.on{border-color:var(--flood);color:var(--flood);font-weight:700}
.steps div.ok{border-color:#2d5a3f;color:var(--good)}
.chat{display:grid;gap:6px;max-height:220px;overflow:auto;padding:8px;background:#0b130f;border:1px solid var(--line);border-radius:6px}
.chat div{padding:7px 10px;border-radius:8px;font-size:13.5px;max-width:88%}
.chat .me{justify-self:end;background:#2a2610;border:1px solid #5e4d14}

:root{
  --night:#09100c; --turf:#111c16; --turf2:#17251d; --line:#24372c; --line2:#1a2a21;
  --radius:14px; --c1:#1d6b3a; --c2:#ffffff;

}
body{
  background:
    radial-gradient(1100px 480px at 50% -200px,rgba(244,196,48,.11),transparent 70%),
    radial-gradient(800px 520px at 105% -10%,color-mix(in srgb,var(--c1) 26%,transparent),transparent 70%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 96px,transparent 96px 192px),
    var(--night);
  background-repeat:no-repeat,no-repeat,repeat,no-repeat;
}
::selection{background:rgba(244,196,48,.35)}
*{scrollbar-width:thin;scrollbar-color:#2c4236 transparent}

/* en-tête aux couleurs du club */
.top{position:relative;border-bottom:0;padding-top:22px;

.crest{filter:drop-shadow(0 8px 16px rgba(0,0,0,.55))}
.ident h1{letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.ident .sub{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;letter-spacing:.06em}

.board{border-radius:14px;border-color:#1e3027;background:#050907 radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.3px) 0 0/4px 4px;box-shadow:inset 0 2px 14px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.04)}

.play{border-radius:14px;background:linear-gradient(180deg,#ffdb63,#efb51a);box-shadow:0 10px 28px -10px rgba(244,196,48,.75),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.12);padding:14px 26px}

/* onglets avec pictogrammes */

/* cartes */
.card{background:linear-gradient(180deg,#14221a 0%,#0f1914 100%);border-color:var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}

<script>/*TESTKIT-DEBUT*/
// ===== Trousse de test à intégrer dans n'importe quel jeu (artefact Claude) =====
// Ajoute : compteur d'images par seconde (mode test), bouton 🐞 « signaler un problème » (capture + état + erreurs),
// banc de mesure scripté, et envoi des résultats dans la base de l'artefact (lisible par Claude avec db_list).
// Usage dans le jeu :
//   import {Testkit} from './testkit.js';
//   const TK=Testkit({jeu:'hameau', canvas:()=>renderer.domElement, etat:()=>({...}), rendu:()=>renderer.render(scene,cam)});
//   TK.bouton(document.body);            // bouton 🐞 permanent
//   TK.modeTest();                       // affiche le compteur (à appeler depuis un bouton « Mode test »)
//   await TK.banc([{nom:'scène 1', preparer:async()=>{...}}, ...], 5000);  // mesure chaque scène 5 s
// Jeux sans canvas (SVG/DOM) : fournir capture:async()=>dataURL (voir svgCapture ci-dessous) et canvas:()=>document.createElement('canvas') pour le nom du GPU.
// Jeux en HTML/DOM : capture:()=>domCapture(document.body). Sans base (capacité db absente, hors ligne, app Electron) :
// option secours:true → 🐞 ouvre un rapport à copier / enregistrer (TK.rapport(obj,titre) réutilisable pour le banc).
// Le mode test ne doit jamais écrire dans la vraie sauvegarde : c'est au jeu de couper sa sauvegarde quand TK.test est vrai.
function Testkit(o){
 const TK={test:false,ft:[],rec:null,lt:0,erreurs:[]};
 let DB=null,UID=null,init=null;
 // Base de l'artefact : window.claude peut arriver après le premier passage du script → on l'attend (10 s max),
 // on ne retient que le succès (un échec sera retenté au prochain envoi) et on garde la raison dans TK.base.
 TK.base='pas encore essayé';
 const cloud=()=>init||(init=(async()=>{try{
   for(let i=0;i<50&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,200));
   if(!window.claude||!window.claude.use){TK.base='window.claude absent (page hors de claude.ai ?)';return false;}
   const [db,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
   if(!db){TK.base='base refusée (db null : déconnecté ou capacité non accordée)';return false;}
   if(!u){TK.base='identité refusée (user null)';return false;}
   UID=await u.id();DB=db;if(!UID){TK.base='identifiant vide';return false;}TK.base='ok';return true;
  }catch(e){TK.base='erreur : '+String(e&&e.message||e).slice(0,160);return false;}})().then(ok=>{if(!ok)init=null;return ok;}));
 TK.envoyer=async(nom,obj)=>{try{localStorage.setItem(o.jeu+'_'+nom.split('_')[0],JSON.stringify(obj));}catch(e){}if(!await cloud())return false;try{await DB.collection('data/users/'+UID).doc(nom).set(obj);return true;}catch(e){TK.base='écriture refusée : '+String(e&&(e.code||e.message)||e).slice(0,160);return false;}};
 addEventListener('error',e=>{TK.erreurs.push(String(e.message||e).slice(0,300));if(TK.erreurs.length>20)TK.erreurs.shift();});
 addEventListener('unhandledrejection',e=>TK.erreurs.push('promesse: '+String(e.reason).slice(0,300)));
 const gpu=()=>{try{const c0=o.canvas&&o.canvas();let gl=c0&&(c0.getContext('webgl2')||c0.getContext('webgl'));if(!gl){const c=document.createElement('canvas');gl=c.getContext('webgl');} // jeux 2D : canvas WebGL temporaire
  const x=gl.getExtension('WEBGL_debug_renderer_info');return x?gl.getParameter(x.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);}catch(e){return '?';}};
 const stats=a0=>{const a=a0.filter(d=>d<1000),pz=a0.length-a.length;if(!a.length)return{};const s=a.slice().sort((x,y)=>x-y),m=a.reduce((x,y)=>x+y,0)/a.length;return{fps:+(1000/m).toFixed(1),bas1:+(1000/s[Math.floor(s.length*.99)]).toFixed(1),pire:+s[s.length-1].toFixed(1),n:a.length,...(pz?{pauses:pz,pauseMax:Math.round(Math.max(...a0))}:{})};};
 const tick=t=>{if(TK.lt){const d=t-TK.lt;TK.ft.push(d);if(TK.ft.length>240)TK.ft.shift();if(TK.rec)TK.rec.push(d);}TK.lt=t;if(TK.ov&&t-(TK.tt||0)>500){TK.tt=t;const s=stats(TK.ft.slice(-60));TK.ov.firstChild.textContent=`🧪 ${s.fps||'-'} img/s · pire ${s.pire||'-'} ms`;}requestAnimationFrame(tick);};requestAnimationFrame(tick);
 TK.modeTest=()=>{TK.test=true;if(TK.ov)return;const d=document.createElement('div');d.style.cssText='position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(0,0,0,.72);color:#9fe0a0;font:12px monospace;padding:4px 8px;border-radius:6px';d.innerHTML='<span>🧪</span>';document.body.appendChild(d);TK.ov=d;};
 // Mesure fiable : on attend que la page soit visible ; si le navigateur a suspendu l'affichage pendant la mesure
 // (onglet masqué, fenêtre en arrière-plan, volet replié), on recommence une fois puis on le signale (masquee:true).
 const visible=()=>new Promise(r=>{if(!document.hidden)return r();const f=()=>{if(!document.hidden){document.removeEventListener('visibilitychange',f);r();}};document.addEventListener('visibilitychange',f);});
 TK.mesurer=async(ms,essai=0)=>{await visible();TK.rec=[];let masq=false;const vf=()=>{if(document.hidden)masq=true;};document.addEventListener('visibilitychange',vf);
  await new Promise(r=>setTimeout(r,ms));document.removeEventListener('visibilitychange',vf);const a=TK.rec;TK.rec=null;
  const suspendu=masq||a.length<ms/1000*3; // moins de 3 images/s mesurées : affichage suspendu par le navigateur
  if(suspendu&&essai<1){if(TK.surSuspension)TK.surSuspension();return TK.mesurer(ms,essai+1);}
  const st=stats(a);if(suspendu)st.masquee=true;return st;};
 TK.banc=async(scenes,ms=5000)=>{const res=[];for(const s of scenes){try{await s.preparer();await new Promise(r=>setTimeout(r,1500));res.push(Object.assign({scene:s.nom},await TK.mesurer(ms)));}catch(e){res.push({scene:s.nom,erreur:String(e)});}}
  const out={jeu:o.jeu,date:new Date().toISOString(),gpu:gpu(),ua:navigator.userAgent,ecran:innerWidth+'x'+innerHeight+' @'+devicePixelRatio,res};out.enregistre=await TK.envoyer('mesures_'+Date.now(),out);out.base=TK.base;return out;};
 TK.signaler=async()=>{let img='';try{if(o.capture)img=await o.capture();else{if(o.rendu)o.rendu();const src=o.canvas(),k=Math.min(1,480/src.width),c=document.createElement('canvas');c.width=src.width*k|0;c.height=src.height*k|0;c.getContext('2d').drawImage(src,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.6);}}catch(e){}
  const st={jeu:o.jeu,test:TK.test,date:new Date().toISOString(),gpu:gpu(),ua:navigator.userAgent,img_s:stats(TK.ft.slice(-60)).fps,etat:(()=>{try{return o.etat?o.etat():null;}catch(e){return String(e);}})(),erreurs:TK.erreurs.slice(),capture:img};
  TK.dernier=st;return TK.envoyer('signalement_'+Date.now(),st);};
 // Secours quand la base est indisponible (capacité db non déclarée, hors ligne, app de bureau) : panneau avec le rapport
 // à copier (sans les gros champs) et bouton pour l'enregistrer en fichier. Option o.secours:true pour l'activer sur 🐞.
 TK.rapport=(obj,titre)=>{try{const gros=new Set(['capture','sauvegarde']);const court=JSON.stringify(obj,(k,v)=>gros.has(k)?(v?'['+String(v).length+' car. — voir le fichier]':v):v,1);
  const f=document.createElement('div');f.style.cssText='position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:12px';
  f.innerHTML='<div style="background:#14201a;color:#e8efe9;border:1px solid #3c5a48;border-radius:12px;padding:14px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;gap:8px;font:14px system-ui,sans-serif"><b></b><div style="font-size:12.5px;opacity:.8">La base de l’artefact n’est pas joignable ('+(TK.base||'?').replace(/</g,'&lt;')+'). Copiez ce rapport dans la conversation avec Claude, ou enregistrez le fichier complet.</div><textarea readonly style="flex:1;min-height:200px;font:11px monospace;background:#0b130e;color:#cfe;border:1px solid #2c4436;border-radius:6px"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button data-k="c">Copier</button><button data-k="t">Enregistrer le fichier</button><button data-k="f">Fermer</button></div></div>';
  f.querySelector('b').textContent=titre||'Rapport';const ta=f.querySelector('textarea');ta.value=court;
  f.onclick=async e=>{const k=e.target.dataset&&e.target.dataset.k;if(e.target===f||k==='f')f.remove();
   else if(k==='c'){ta.select();let ok=false;try{await navigator.clipboard.writeText(court);ok=true;}catch(_){try{ok=document.execCommand('copy');}catch(__){}}e.target.textContent=ok?'Copié ✓':'Sélectionné : copiez à la main';}
   else if(k==='t'){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'}));a.download=(o.jeu||'jeu')+'_'+(obj.date||Date.now()).toString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}catch(_){e.target.textContent='Impossible ici';}}};
  document.body.appendChild(f);return f;}catch(e){return null;}};
 TK.bouton=(parent,style)=>{const b=document.createElement('button');b.textContent='🐞';b.title='Signaler un problème à Claude';b.style.cssText=style||'position:fixed;right:10px;bottom:10px;z-index:9999;width:38px;height:38px;border-radius:50%;opacity:.75';parent.appendChild(b);
  b.onclick=async()=>{b.disabled=true;const ok=await TK.signaler();b.disabled=false;b.textContent=ok?'✓':'🐞';setTimeout(()=>b.textContent='🐞',1500);if(!ok&&o.secours&&TK.dernier)TK.rapport(TK.dernier,'Signalement (non envoyé)');};return b;};
 return TK;}

// Capture d'un <svg> (jeux en SVG) : sérialise, dessine dans un canvas réduit, renvoie un JPEG en dataURL.
function svgCapture(svg,largeur=480){return new Promise(res=>{try{
 // on recopie les feuilles de style de la page dans le clone : sans elles, les classes CSS (display, fill…) sont perdues
 const css=[...document.styleSheets].flatMap(st=>{try{return [...st.cssRules].map(r=>r.cssText);}catch(e){return [];}}).join('\n');
 const cl=svg.cloneNode(true);const stl=document.createElementNS('http://www.w3.org/2000/svg','style');stl.textContent=css;cl.insertBefore(stl,cl.firstChild);
 const xml=new XMLSerializer().serializeToString(cl);const r=svg.getBoundingClientRect();const k=Math.min(1,largeur/r.width);
 const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=r.width*k|0;c.height=r.height*k|0;const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6));}catch(e){res('');}};img.onerror=()=>res('');
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml.replace('<svg','<svg width="'+r.width+'" height="'+r.height+'"'));}catch(e){res('');}});}
// Capture d'une page HTML/DOM (jeux sans canvas ni SVG principal) : clone l'élément dans un <foreignObject>, recopie les styles,
// remplace les <canvas> par leur image, renvoie un JPEG en dataURL ('' si le navigateur refuse, ex. Safari qui « salit » le canvas).
function domCapture(el,largeur=480){return new Promise(res=>{try{el=el||document.body;
 const css=[...document.styleSheets].flatMap(st=>{try{return [...st.cssRules].map(r=>r.cssText);}catch(e){return [];}}).join('\n');
 const r=el.getBoundingClientRect(),W=Math.max(1,Math.round(innerWidth)),H=Math.max(1,Math.round(innerHeight)),k=Math.min(1,largeur/W);
 const cl=el.cloneNode(true);const src=el.querySelectorAll('canvas'),dst=cl.querySelectorAll('canvas');
 src.forEach((c,i)=>{try{const im=document.createElement('img');im.src=c.toDataURL();im.style.cssText=c.style.cssText;im.className=c.className;im.width=c.clientWidth;im.height=c.clientHeight;dst[i].replaceWith(im);}catch(e){}});
 cl.querySelectorAll('script').forEach(x=>x.remove());
 const wrap=document.createElement('div');wrap.setAttribute('xmlns','http://www.w3.org/1999/xhtml');wrap.style.cssText=document.documentElement.style.cssText+';width:'+W+'px;height:'+H+'px;overflow:hidden;background:'+getComputedStyle(document.body).backgroundColor;
 const inner=document.createElement('div');inner.className=document.body.className;inner.style.cssText='position:relative;top:'+(-scrollY)+'px';inner.appendChild(cl);
 const st=document.createElement('style');st.textContent=css;wrap.appendChild(st);wrap.appendChild(inner);
 const xml=new XMLSerializer().serializeToString(wrap);
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject width="100%" height="100%">'+xml+'</foreignObject></svg>';
 const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=W*k|0;c.height=H*k|0;const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6));}catch(e){res('');}};img.onerror=()=>res('');
 img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);setTimeout(()=>res(''),4000);}catch(e){res('');}});}
// Jeux en scripts classiques (sans import) : exposer aussi la trousse sur window.
// Plus sûr dans un artefact : charger une copie SANS les mots « export » en <script src> classique
// (sed 's/^export //' testkit.js > jeu/testkit.js) : un <script type="module"> peut ne pas se charger dans le cadre isolé.
if(typeof window!=="undefined"){window.Testkit=Testkit;window.svgCapture=svgCapture;window.domCapture=domCapture;}
/*TESTKIT-FIN*/</script>
<script>

const R=Math.random;

const rf=(a,b)=>R()*(b-a)+a;
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=R();}while(p>L&&k<12);return k-1;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function money(n){
  const s=n<0?'−':'';n=Math.abs(n);
  if(n>=1e6)return s+(n/1e6).toFixed(n>=1e7?1:2).replace('.',',')+' M€';
  if(n>=1e4)return s+Math.round(n/1e3).toLocaleString('fr-FR')+' k€';
  return s+Math.round(n).toLocaleString('fr-FR')+' €';
}
const nf=n=>Math.round(n).toLocaleString('fr-FR');

function wageFor(ovr){return Math.max(40,Math.round(60*Math.exp(0.17*(ovr-40))*Math.exp(0.1*Math.max(0,ovr-78))/10)*10);}
const DIVF=[.06,.1,.16,.25,.45,.75,1];
function valueFor(p,d){
  const af=p.age<21?1.7:p.age<24?1.35:p.age<28?1:p.age<31?.7:p.age<33?.45:.25;
  const pf=1+Math.max(0,p.pot-p.ovr)/25;
  const o=p.ovr,base=3000*Math.exp(0.2*(Math.min(o,76)-40))*Math.exp(0.11*Math.max(0,o-76));
  return Math.round(Math.min(base*af*pf*DIVF[clamp(d??(S?S.div:6),0,6)],180e6)/100)*100;
}

}

/* ---------- Équipe & match ---------- */
function pickXI(){
  const f=FORM[S.tactic.formation];
  const rq=S.req||{play:[],bench:[]};
  let av=S.players.filter(p=>!p.inj&&!p.susp&&!p.loan);
  const noBench=av.filter(p=>!rq.bench.includes(p.id));if(noBench.length>=11)av=noBench;
  const sc=p=>p.ovr*(0.8+0.2*p.fit/100)+(rq.play.includes(p.id)?100:0)+(p.promise==='Titulaire'&&S.gw-(p.joinGw||0)<=S.N?2.5:0);
  const used=new Set(),xi=[];
  const need={G:1,D:f.D,M:f.M,A:f.A},miss={};
  for(const pos of ['G','D','M','A']){
    const c=av.filter(p=>p.pos===pos).sort((a,b)=>sc(b)-sc(a)).slice(0,need[pos]);
    c.forEach(p=>{used.add(p.id);xi.push({p,slot:pos,pen:0});});
    miss[pos]=need[pos]-c.length;
  }
  for(const pos of ['G','D','M','A'])for(let i=0;i<miss[pos];i++){
    const c=av.filter(p=>!used.has(p.id)).sort((a,b)=>sc(b)-sc(a))[0];
    if(c){used.add(c.id);xi.push({p:c,slot:pos,pen:pos==='G'?18:7});}
  }
  return xi;
}
// niveau d'entraîneur « normal » dans chaque division : un 5 étoiles fait la différence en N2, beaucoup moins en Ligue 1 où tous les clubs en ont un bon
const COACH_TYP=[2,2,2,2.5,3,3.5,4];
function strength(xi){
  xi=xi||pickXI();
  const val=e=>(e.eff!=null?e.eff:e.p.ovr-e.pen)*(0.8+0.2*e.p.fit/100);
  const avg=pos=>{const a=xi.filter(e=>e.slot===pos);return a.length?a.reduce((s,e)=>s+val(e),0)/a.length:28;};
  const missing=11-xi.length;
  const f=FORM[S.tactic.formation],m=MENT[S.tactic.mentality],c=S.staff.coach;
  const cm=c?(c.lvl-COACH_TYP[S.div])*1.4+(c.form===S.tactic.formation?1.5:0)+(c.style===S.tactic.mentality?.5:0):-4;
  const mor=xi.length?(xi.reduce((s,e)=>s+e.p.morale,0)/xi.length-60)/12:0;
  const att=avg('A')*.55+avg('M')*.45+f.att+m.att+cm+mor-missing*4;
  const def=avg('D')*.55+avg('G')*.25+avg('M')*.2+f.def+m.def+cm+mor-missing*4;
  return {att,def,ovr:(att+def)/2,xi};
}
function genSq(){const a=[];[['A',3],['M',3],['D',2]].forEach(([pos,n])=>{for(let k=0;k<n;k++)a.push({n:pick(FIRST)+' '+pick(LAST),pos,w:{A:5,M:2.2,D:.8}[pos]*rf(.55,1.6),g:0,a:0});});return a;}
function wPick(arr,wf,ex){const c=arr.filter(x=>x!==ex);const tot=c.reduce((s,x)=>s+wf(x),0);let r=R()*tot;for(const x of c){r-=wf(x);if(r<=0)return x;}return c[0];}
const AW={A:2.5,M:4,D:1.2,G:.1};
function creditAI(t,goals,track){const out=[];if(!t.sq)t.sq=genSq();for(let i=0;i<goals;i++){const sc=wPick(t.sq,x=>x.w);const as=R()<.75?wPick(t.sq,x=>AW[x.pos],sc):null;if(track){sc.g++;if(as)as.a++;}out.push([sc,as]);}return out;}
function aiStr(t){return {att:t.att+t.mom+rf(-2,2),def:t.def+t.mom+rf(-2,2),ovr:t.rating};}
function lam(att,def,home){return clamp(1.2*Math.exp((att-def)/11)*(home==null?1:home?1.1:.9),.15,5);}
function simGoals(a,b,neutral){return [poisson(lam(a.att,b.def,neutral?null:true)),poisson(lam(b.att,a.def,neutral?null:false))];}

function userMatch(home,opp,me,neutral,cup){
  const os=aiStr(opp);
  const gf=poisson(lam(me.att,os.def,neutral?null:home)),ga=poisson(lam(os.att,me.def,neutral?null:!home));
  const xi=me.xi,ev=[];
  const roleOf=e=>e.role||({G:'GB',D:'DC',M:'MC',A:'BU'})[e.slot];
  const av=e=>attrVals(e.p);
  const w=e=>{const r=roleOf(e);if(r==='GB'||e.p.pos==='G')return .02;return ({BU:5,AIL:3,MOC:2.6,MC:1.3,MDC:.6,LAT:.55,DC:.6}[r]||1)*(.4+(av(e)[3]||40)/80)*(e.p.ovr/50);};
  const aw=x=>{const r=roleOf(x);if(r==='GB'||x.p.pos==='G')return .01;const v=av(x);return ({AIL:2.3,MOC:2.5,MC:1.6,LAT:1.2,BU:1,MDC:.8,DC:.3}[r]||1)*(.3+((v[2]||40)+(v[8]||40))/140)*(x.p.ovr/50);};
  const goals={},assists={},saves={},miss={};
  for(let i=0;i<gf;i++){
    if(!xi.length)break;
    const pen=R()<.08;const e=wPick(xi,w),as=!pen&&R()<.75&&xi.length>1?wPick(xi,aw,e):null;
    goals[e.p.id]=(goals[e.p.id]||0)+1;if(as)assists[as.p.id]=(assists[as.p.id]||0)+1;
    const rl=roleOf(e),hd=!pen&&av(e)[6]>=e.p.ovr+3&&R()<.4;const cr=as&&['AIL','LAT'].includes(roleOf(as))&&R()<.5;
    const how=pen?'sur penalty':hd?'de la tête'+(cr?' sur un centre de '+pshort(as.p):', passe de '+(as?pshort(as.p):'')):cr?'sur un centre de '+pshort(as.p):as?'passe de '+pshort(as.p):(rl==='BU'||rl==='AIL')&&R()<.5?'en solo':'';
    ev.push({m:ri(1,90),k:'goal',n:pname(e.p)+(how?' ('+how.replace(/, passe de $/,'')+')':'')});
  }
  // occasions manquées et arrêts du gardien
  {const att=xi.filter(e=>['BU','AIL','MOC'].includes(roleOf(e)));const gk=xi.find(e=>roleOf(e)==='GB');
   const nm=ri(0,2);for(let i=0;i<nm&&att.length;i++){const e=pick(att);miss[e.p.id]=(miss[e.p.id]||0)+1;ev.push({m:ri(3,89),k:'occ',n:pname(e.p)+' '+pick(['trouve le poteau','manque le cadre seul face au gardien','voit sa frappe repoussée sur la ligne','bute sur le gardien'])});}

}

const fanCap=()=>LV[S.div].fcap*(1+S.rep/150)*terrFan();
function afterResult(res,att,diff,home){

function playCup(){
  const i=S.cup.round;
  const od=i<6?clamp(Math.floor(i*.7)+ri(-1,1),0,4):clamp(ri(Math.max(0,i-4),6),0,6);
  const Lo=LV[od];let r=rf(Lo.str[0],Lo.str[1]);if(od===6&&R()<.3)r=rf(80,86);
  const opp={name:clubName(new Set(S.teams.map(t=>t.name))),rating:r,att:r+rf(-2,2),def:r+rf(-2,2),mom:0,div:od,sq:genSq()};
  const final=i===11;
  const home=final?false:od>S.div?true:od<S.div?false:R()<.5;
  S.players.forEach(p=>{p.fit=clamp(p.fit+4,20,100);});
  coachDecide(opp);const me=strength();
  const d=userMatch(home,opp,me,final,true);
  let win=d.gf>d.ga,tab=null;
  if(d.gf===d.ga){const pw=clamp(.5+(me.ovr-r)*.01,.25,.75);win=R()<pw;const a=ri(3,5);tab=win?[a,a-ri(1,2)]:[a-ri(1,2),a];tab=tab.map(x=>Math.max(x,1));if(tab[0]===tab[1])tab[win?0:1]++;}
  d.tab=tab;d.home=final?true:home;d.neutral=final;
  d.opp={name:opp.name+' ('+LV[od].n+')',rating:r};
  d.comp='Coupe de France · '+CUP_R[i];
  if(home||final){
    const att=final?80000:Math.min(cap(),Math.round(attendance(opp,1.3+od*.15)));
    d.att=att;
    if(final)fin('Coupe de France',600000);else{fin('Coupe de France',att*S.ticket);fin('Buvette',att*BUV[S.infra.commerce]);}
  }else fin('Déplacements',-TRAVEL[S.div]);
  if(win){
    fin('Coupe de France',CUP_PRIZE[i]);
    S.cup.log.push({r:CUP_R[i],opp:opp.name,od,gf:d.gf,ga:d.ga,tab,win:true,prime:CUP_PRIZE[i]});
    S.cup.round++;S.fans+=Math.round(Math.max(0,fanCap()-S.fans)*(.02+i*.006));S.mood=clamp(S.mood+5,0,100);S.confidence=clamp(S.confidence+2,0,100);
    if(i>=6)S.rep=clamp(S.rep+1.5,0,100);
    if(i===5&&S.div<=2&&!S.cup.poucet){S.cup.poucet=true;fin('Coupe de France',5000);S.cup.log[S.cup.log.length-1].poucet=5000;S.fans=Math.round(S.fans*1.08);S.mood=clamp(S.mood+6,0,100);S.rep=clamp(S.rep+2,0,100);news('Petit Poucet de la Coupe de France ! Le club amateur se hisse en 32es de finale : prime de 5 000 €, la presse nationale débarque.','g');}
    if(S.div<=3&&od>S.div){const bx=1500*(od-S.div);fin('Coupe de France',bx);S.cup.log[S.cup.log.length-1].exploit=bx;news('Bonus exploit de la FFF : '+money(bx)+' pour avoir éliminé un club de '+LV[od].n+'.','g');}
    if(i===11){S.cup.won=true;S.palmares.push('Coupe de France '+seasonLabel(S.year));S.rep=clamp(S.rep+10,0,100);news('LA COUPE DE FRANCE EST À NOUS !','g');}
    else news('Coupe de France : qualification face à '+opp.name+' ('+LV[od].n+') '+d.gf+'-'+d.ga+(tab?' ('+tab[0]+'-'+tab[1]+' t.a.b.)':''),'g');
  }else{
    S.cup.out=true;S.cup.log.push({r:CUP_R[i],opp:opp.name,od,gf:d.gf,ga:d.ga,tab,win:false});
    news('Coupe de France : élimination en '+CUP_R[i]+' face à '+opp.name+(tab?' aux tirs au but':''),'b');
  }
  d.cupWin=win;
  if(win){const g=S.cup.log[S.cup.log.length-1];d.comp+=' · '+cupGainTxt(g,true);}
  return d;
}

const PERS=['Ambitieux','Loyal','Mercenaire','Professionnel','Casanier'];
const PERS_D={Ambitieux:'veut jouer et viser plus haut, sensible à la promesse de temps de jeu',Loyal:'attaché à ses clubs, peu de surenchère',Mercenaire:'l’argent avant tout, adore les primes',Professionnel:'rationnel, accepte une offre juste',Casanier:'préfère un projet stable et un contrat long'};
function genMarket(n){
  const out=[],rec=slvl('recruteur'),used=new Set(S.teams?S.teams.map(t=>t.name):[]);
  for(let k=0;k<n;k++){
    const d=clamp(S.div+pick([-1,-1,0,0,0,0,0,1,rec>=4?1:0]),0,6);
    const p=genPlayer({div:d});
    p.ovr=clamp(p.ovr+Math.round(rec*.5-1),25,92);p.pot=Math.max(p.pot,p.ovr);
    const free=R()<(S.div<=2?.65:.25);
    p.fee=free?0:Math.round(valueFor(p,d)*rf(.85,1.3)/100)*100;
    p.demand=Math.round(wageFor(p.ovr)*rf(1,1.35)*(1+Math.max(0,p.ovr-LV[S.div].str[1])*.06)/10)*10;
    p.club=free?'Libre':(R()<.5?clubName(used):'Club de '+LV[d].n);
    p.pers=pick(PERS);p.firm=+rf(.78,.93).toFixed(2);p.lastYear=!free&&R()<.28;
    genHist(p,p.club==='Libre'||p.club.startsWith('Club de')?null:p.club,d);
    p.potSeen=rec>=3?[p.pot,p.pot]:rec>=1?[clamp(p.pot-ri(1,8-2*rec),p.ovr,99),p.pot+ri(1,8-2*rec)]:null;
    out.push(p);
  }
  return out;
}
function interest(p){
  const L=LV[S.div];
  const eu=S.euro?{ldc:3,lde:1.5,lce:.7}[S.euro.k]:0;
  const gap=p.ovr-((L.str[0]+L.str[1])/2+2+S.rep/40+S.infra.pelouse*.6+eu)+(p.ovr>=85&&!S.euro?3:0);
  return gap<=0?.9:gap<=3?.6:gap<=6?.3:gap<=9?.1:.02;
}
function negoChance(p,n){
  const w=clamp((n.wage/p.demand-.7)/.33,0,1.15);
  const f=p.fee>0?(n.fee>=p.fee?1:n.fee>=p.fee*.85?.55:n.fee>=p.fee*.7?.2:0):1;
  const y=p.age>=30?(n.years>=2?1.08:.92):1;
  return clamp(interest(p)*w*f*y,0,.97);
}

function maybeEvent(){
  if(R()>.42)return;
  const pool=Object.entries(EVENTS).filter(([id,e])=>e.w>0&&(!e.cond||e.cond())&&(S.gw-(S.evLast[id]||-99))>10);
  if(!pool.length)return;
  const tot=pool.reduce((s,[,e])=>s+e.w,0);let r=R()*tot,sel=pool[0];
  for(const x of pool){r-=x[1].w;if(r<=0){sel=x;break;}}
  const [id,e]=sel;const d=e.make?e.make():{};if(!d)return;
  S.evLast[id]=S.gw;UI.queue.push({type:'event',id,d});
}

function reqs(t){
  const i=S.infra,r=[];const add=(l,ok,need)=>r.push({l,ok,need});
  if(t===2){add('Trésorerie positive (sinon interdiction d’accession)',S.cash>=0);}
  if(t===3){add('Éclairage d’entraînement',i.eclairage>=1);add('Stade de 800 places',i.stade>=1,1);add('Trésorerie positive',S.cash>=0);}
  if(t===4){add('Statut professionnel (SASP)',S.sasp);add('Tribune couverte, 1 500 places (niveau T2)',i.stade>=2,2);add('Éclairage fédéral E4',i.eclairage>=2);add('Terrain synthétique ou mieux',i.pelouse>=1);add('Trésorerie positive',S.cash>=0);}
  if(t===5){add('Statut professionnel (SASP)',S.sasp);add('Stade de 5 000 places',i.stade>=4,4);add('Éclairage fédéral E4',i.eclairage>=2);add('Pelouse naturelle',i.pelouse>=2);add('Centre de formation : Pôle espoirs',i.formation>=2);add('Trésorerie positive',S.cash>=0);}
  if(t===6){add('Statut professionnel (SASP)',S.sasp);add('Stade de 12 000 places',i.stade>=6,6);add('Éclairage TV E1',i.eclairage>=3);add('Pelouse naturelle',i.pelouse>=2);add('Centre de formation agréé',i.formation>=3);add('Centre d’entraînement complet',i.entrainement>=3);add('Trésorerie positive',S.cash>=0);}
  return r;
}
function promoDecide(notes,pre){const t=S.div+1,rq=reqs(t);let bad=rq.filter(x=>!x.ok);
  const cashBad=bad.find(x=>/^Trésorerie/.test(x.l)),tol=Math.max(5000,(S.sponsorAnnual+LV[S.div].sub+LV[S.div].tv)*.08);
  if(cashBad&&-S.cash<=tol&&bad.length===1+bad.filter(x=>x.need).length){S._guar=Math.ceil(-S.cash/1000)*1000+2000;bad=bad.filter(x=>x!==cashBad);notes.push('Trésorerie légèrement négative ('+money(S.cash)+') : la Ligue accepte une garantie bancaire de '+money(S._guar)+', remboursable sur deux saisons.');}
  if(!bad.length)return 'up';
  if(t>=3&&!S.deloc&&bad.every(x=>x.need)){const need=Math.max(...bad.map(x=>x.need));notes.push((pre?pre+'montée':'Montée')+' validée par dérogation : faute de stade aux normes, le club jouera à domicile dans un stade voisin de '+INFRA.stade.cap[need].toLocaleString('fr-FR')+' places (loyer à chaque match) jusqu’à la mise aux normes, deux saisons maximum.');S._deloc=need;return 'up';}
  notes.push(pre?pre+'montée refusée : cahier des charges de '+LV[t].n+' non rempli.':'Montée refusée : le club ne remplit pas le cahier des charges de '+LV[t].n+'.');return 'refused';}
function computeSeasonEnd(){S._deloc=null;S._guar=null;leagueSnap();
  const L=LV[S.div],tbl=standings(),pos=tbl.findIndex(t=>t.user)+1;

  if(pos>L.teams-L.rel&&S.div>0){out='down';S._deloc=null;}
  let barrage=null;const me=strength().ovr;
  if(out==='stay'&&(S.div===4||S.div===5)&&pos===3){const oppR=LV[S.div+1].str[0]+rf(1,4),pw=clamp(.5+(me-oppR)*.035,.12,.88),win=R()<pw;
    barrage={up:true,win,txt:'Barrage d’accession contre le 16e de '+LV[S.div+1].n+' : '+(win?'victoire, le club monte !':'défaite, pas de montée.')};
    if(win)out=promoDecide(notes,'Barrage gagné : ');}
  if((S.div===5||S.div===6)&&pos===L.teams-L.rel){const oppR=LV[S.div-1].str[1]+rf(-2,2),pw=clamp(.5+(me-oppR)*.035,.12,.88),win=R()<pw;
    barrage={up:false,win,txt:'Barrage pour le maintien contre le 3e de '+LV[S.div-1].n+' : '+(win?'victoire, maintien assuré.':'défaite, relégation.')};if(!win)out='down';}

    else if(S.div>=2&&S.cash<-(S.sponsorAnnual+LV[S.div].sub)*.15){out='dncg';notes.push('La DNCG fédérale prononce une rétrogradation administrative : comptes trop déficitaires.');}
  }
  const objOk=S.objective==='montee'?pos<=(S.div===6?3:Math.max(L.promo,1)):S.objective==='milieu'?pos<=Math.ceil(L.teams/2):pos<=L.teams-L.rel;
  let dc=objOk?16:{montee:-14,milieu:-12,maintien:-20}[S.objective];

    const sum=o=>Object.entries(o).filter(([k])=>!NB.has(k)).reduce((a,[,v])=>a+v,0);const real=sum(S.sf.inc)-sum(S.sf.exp),tol=Math.max(3000,S.budget.ti*.05);
    if(real>=S.budget.res-tol){dc+=3;notes.push('Budget tenu : résultat d’exploitation de '+money(real)+' pour '+money(S.budget.res)+' prévus. Les adhérents apprécient (+3).');}
    else{dc-=4;notes.push('Budget dépassé : résultat d’exploitation de '+money(real)+' pour '+money(S.budget.res)+' prévus (−4 de confiance).');}}
  const merit=MERIT[S.div]*(L.teams-pos+1)/(L.teams*(L.teams+1)/2);
  const sgt=p=>p.s.g+p.s.cg;const top=[...S.players].sort((a,b)=>sgt(b)-sgt(a))[0];const lt=leaders('g')[0],la=leaders('a')[0];
  if(barrage)notes.unshift(barrage.txt);

  return {euroNext,guar:S._guar,deloc:S._deloc,barrage,pos,out,notes,objOk,dc,merit:Math.round(merit),champion:pos===1,top:top&&sgt(top)?pname(top)+' ('+sgt(top)+' buts)':'—',lgTop:lt?lt.n+' ('+lt.club+', '+lt.v+')':'—',lgAst:la?la.n+' ('+la.club+', '+la.v+')':'—',

}

    if(M.goal<=0){b.x=b.tx=.5;b.y=b.ty=.5;M.poss=M.gx>.5?1:0;M.pick();}return;}
  if(M.chance){const C=M.chance;C.t-=dt;

function genOffers(){
  S.offers=(S.offers||[]).filter(o=>o.exp>=S.gw&&getP(o.pid));
  if(!windowOpen()){S.offers=[];return;}
  const top=topPlayers(3).map(p=>p.id);
  S.players.forEach(p=>{
    if(S.offers.some(o=>o.pid===p.id))return;
    const v=valueFor(p);
    if(p.listed){p.askP=p.askP||Math.round(v/100)*100;
      if(R()<.4){const bd=clamp(S.div+ri(-1,1),0,6);const fee=capFee(Math.round(Math.min(p.askP,v*1.3)*rf(.6,1)/100)*100,bd);S.offers.push({id:S.uid++,pid:p.id,club:clubName(new Set()),fee,max:Math.max(fee,Math.min(Math.round(Math.max(fee,Math.min(p.askP*1.08,v*rf(.95,1.35)))/100)*100,BUYCAP[bd])),exp:S.gw+2});news('Offre de '+money(fee)+' reçue pour '+pname(p)+'.');}}
    else if(top.includes(p.id)&&S.div<6&&R()<.04){const fee=capFee(Math.round(v*rf(1,1.5)/100)*100,S.div+2);S.offers.push({id:S.uid++,pid:p.id,club:clubName(new Set())+' ('+LV[clamp(S.div+ri(1,2),0,6)].n+')',fee,max:Math.round(fee*rf(1.05,1.25)/100)*100,exp:S.gw+2,spont:true});news('Un club de l’échelon supérieur s’intéresse à '+pname(p)+' : '+money(fee)+' sur la table.');}
  });
}

function buildCost(key){const I=INFRA[key],l=S.infra[key];if(l>=I.cost.length-1)return null;let c=I.cost[l+1];if(S.flags.subvBuild)c=Math.round(c*.7);return c;}

  if(/^[GDMA]$/.test(t))return {G:0,D:1,M:2,A:3}[t];
  const m=t.match(/^[+−-]?\s*\d[\d ]*(?:[.,]\d+)?/);

function alerts(){

  if(S.week<S.N){const pr=projection();if(pr<0){const race=L.promo&&S.div<6&&S.week>=4&&myPos()<=L.promo+2;
    a.push(['b',race?'Course à la montée en danger : la montée exige une trésorerie positive en fin de saison, or la projection est de '+money(pr)+'. Il manque environ '+money(-pr)+' : vendez, réduisez les salaires ou empruntez (onglet Finances).':'Au rythme actuel, la trésorerie finira la saison à '+money(pr)+'. Réduisez la masse salariale, vendez ou empruntez.']);}}
  if(S.dncg)a.push(['b',S.dncg.lvl>=2?'DNCG : interdiction de recruter jusqu’à la fin de la saison.':'DNCG : masse salariale encadrée (plafond '+money(S.dncg.cap)+'/mois).']);
  if(!S.staff.coach)a.push(['b','Aucun entraîneur : l’équipe joue avec un gros handicap. Recrutez-en un dans l’onglet Staff.']);
  const av=S.players.filter(p=>!p.inj&&!p.susp);
  if(av.length<14)a.push(['w','Seulement '+av.length+' joueurs disponibles.']);
  if(!av.some(p=>p.pos==='G'))a.push(['b','Aucun gardien disponible !']);
  {const idle=S.players.filter(p=>!p.loan&&p.age<=21&&S.week>=8&&(p.s?p.s.mj+p.s.cmj:0)<=1);if(idle.length>=3)a.push(['w',idle.length+' jeunes n’ont presque pas joué cette saison. Un prêt les ferait progresser (bouton « Prêter » dans leur fiche, pendant le mercato).']);}
  const exp=S.players.filter(p=>p.contract<=1).length;
  if(exp)a.push(['w',exp+' contrat'+(exp>1?'s':'')+' expire'+(exp>1?'nt':'')+' en fin de saison. Prolongez depuis l’onglet Effectif.']);
  if(windowOpen())a.push(['g','Mercato ouvert'+(S.week<=3?' (fenêtre estivale)':' (fenêtre hivernale)')+'.']);
  if(delocOn())a.push([S.deloc.left<=0?'b':'w','Dérogation stade : vous jouez à domicile dans un stade voisin (loyer à chaque match, affluence réduite). Construisez un stade de '+INFRA.stade.cap[S.deloc.need].toLocaleString('fr-FR')+' places'+(S.deloc.left<=0?' : le loyer est désormais doublé.':' avant la fin de la saison prochaine.')]);
  if(S.div<6&&L.promo){const r=reqs(S.div+1).filter(x=>!x.ok);if(r.length)a.push(['w','En cas de montée en '+LV[S.div+1].n+', il manque : '+r.map(x=>x.l.toLowerCase()).join(', ')+'.'+(S.div+1>=3&&!S.deloc&&r.every(x=>x.need)?' Seul le stade manque : une dérogation (stade voisin, loyer) reste possible.':'')]);}
  if(S.ticket>tk()*1.5)a.push(['w','Prix du billet très élevé pour la division : l’affluence et l’humeur en pâtissent.']);
  return a;
}

function vCal(){
  const L=LV[S.div],tbl=standings(),rows=[],half=Math.floor(S.N/2),entry=CUP_ENTRY[S.div];
  for(let w=0;w<S.N;w++){
    if(w===0)rows.push(`<tr class="sep"><td colspan="6">Phase aller · mercato d’été ouvert jusqu’à la J3</td></tr>`);
    if(w===half)rows.push(`<tr class="sep"><td colspan="6">Trêve hivernale · phase retour · mercato d’hiver J${half-1} à J${half+2}</td></tr>`);
    const [h,a]=S.sched[w].find(([h,a])=>S.teams[h].user||S.teams[a].user);
    const home=S.teams[h].user,o=S.teams[home?a:h],r=S.myResults[w],next=w===S.week;
    const rk=tbl.indexOf(o)+1;
    rows.push(`<tr class="cal-row ${next?'next':''} ${r?'click':''}" ${r?`onclick="A.cal(${w})"`:''}><td class="num">J${w+1}</td><td class="muted">${matchDate(w)}</td><td>${home?'<span class="pill">Dom.</span>':'<span class="pill">Ext.</span>'}</td><td>${tc(o.name)}${o.derby?' <span class="pill b">Rival</span>':derbyLocal(o)?' <span class="pill y" title="Club voisin : affluence et ambiance renforcées">Derby</span>':''} <span class="muted" style="font-size:12px">${S.week?rk+'e':''}</span></td>
      <td class="r">${r?`<span class="resb ${r.res}">${home?r.gf+' - '+r.ga:r.ga+' - '+r.gf}</span>`:next?'<span class="pill y">Prochain match</span>':'<span class="muted">à venir</span>'}</td><td class="r muted" style="font-size:12px">${r&&r.att?nf(r.att)+' spect.':r?'':'force '+Math.round(o.rating)}</td></tr>`);
    if(r&&UI.calOpen===w&&S.roundRes[w])rows.push(`<tr class="det"><td colspan="6"><table class="mini"><tbody>${S.roundRes[w].map(([h2,a2,gh,ga])=>`<tr class="${S.teams[h2].user||S.teams[a2].user?'me':''}"><td class="r">${tc(S.teams[h2].name)}</td><td style="text-align:center"><b>${gh} - ${ga}</b></td><td>${tc(S.teams[a2].name)}</td></tr>`).join('')}</tbody></table></td></tr>`);
    if(S.euro){const E=S.euro,C=EURO[E.k];const lpi=E.lpw.indexOf(w+1);
      const lg=lpi>=0?E.log.find(l=>l.r==='J'+(lpi+1)):null;
      if(lpi>=0){const o=E.teams[E.opp[lpi]],hm=lpi%2===0;rows.push(`<tr class="eur" style="--ec:${C.col}"><td>${C.s}</td><td class="muted">${matchDate(w,true)}</td><td><span class="pill eu">J${lpi+1}</span></td><td>${tc(o.name)} <span class="flag">${o.c}</span> <span class="muted" style="font-size:12px">${hm?'à domicile':'à l’extérieur'}</span></td><td class="r">${lg?`<span class="resb ${lg.res}">${hm?lg.gf+' - '+lg.ga:lg.ga+' - '+lg.gf}</span>`:'<span class="muted">à venir</span>'}</td><td class="r muted" style="font-size:12px">force ${Math.round(o.rating)}</td></tr>`);}
      else{E.log.filter(l=>!/^J\d/.test(l.r)&&l.w===w+1).forEach(l=>rows.push(`<tr class="eur" style="--ec:${C.col}"><td>${C.s}</td><td class="muted">${matchDate(w,true)}</td><td><span class="pill eu">${l.r}</span></td><td>${tc(l.opp)} <span class="flag">${l.c}</span></td><td class="r"><span class="resb ${l.res}">${l.home?l.gf+' - '+l.ga:l.ga+' - '+l.gf}</span></td><td></td></tr>`));
        if(E.phase==='ko'&&E.ko.weeks[E.ko.leg]===w+1)rows.push(`<tr class="eur" style="--ec:${C.col}"><td>${C.s}</td><td class="muted">${matchDate(w,true)}</td><td><span class="pill eu">${KO_N[E.ko.r]}</span></td><td>${tc(E.ko.opp.name)} <span class="flag">${E.ko.opp.c}</span></td><td class="r"><span class="muted">à venir</span></td><td class="r muted" style="font-size:12px">force ${Math.round(E.ko.opp.rating)}</td></tr>`);}}
    for(let i=entry;i<12;i++){if(cupDay(i)!==w+1)continue;
      const lg=S.cup.log.find(x=>x.r===CUP_R[i]);
      if(lg)rows.push(`<tr class="cupr"><td>CdF</td><td class="muted">${matchDate(w,true)}</td><td><span class="pill y">${CUP_R[i]}</span></td><td>${tc(lg.opp)} <span class="muted" style="font-size:12px">${LV[lg.od].n}</span></td><td class="r"><span class="resb ${lg.win?'V':'D'}">${lg.gf} - ${lg.ga}</span>${lg.tab?' <span class="muted" style="font-size:12px">t.a.b.</span>':''}</td><td class="r good" style="font-size:12px">${cupGainTxt(lg)}</td></tr>`);
      else if(!S.cup.out&&!S.cup.won&&i===S.cup.round)rows.push(`<tr class="cupr"><td>CdF</td><td class="muted">${matchDate(w,true)}</td><td><span class="pill y">${CUP_R[i]}</span></td><td class="muted">Adversaire tiré au sort le jour du match</td><td class="r"><span class="muted">à venir</span></td><td></td></tr>`);
    }
  }
  const played=S.myResults.length,W=S.myResults.filter(r=>r.res==='V').length,N=S.myResults.filter(r=>r.res==='N').length;
  return `<div class="card"><header><h3>Calendrier ${seasonLabel(S.year)} · ${L.n}</h3><span class="muted" style="font-size:13px">${played} matchs joués · ${W} V · ${N} N · ${played-W-N} D</span></header>

}

const FEM_LV=['Régional féminin','Régional féminin','Division 3 féminine','Division 3 féminine','Seconde Ligue','Seconde Ligue','Première Ligue'];
A.reserveCreate=function(){if(S.reserve)return;const c=RESCOST[S.div];if(S.cash<c*.25){toast('Trésorerie insuffisante.');return;}S.reserve={since:S.year,W:0,D:0,L:0,GF:0,GA:0,pos:null};news('Création de l’équipe réserve en '+RES_LV[S.div]+' : les remplaçants et les jeunes auront du temps de jeu.','g');save();render();};
A.reserveClose=function(){if(!S.reserve)return;S.reserve=null;news('L’équipe réserve est dissoute.','b');save();render();};
A.femCreate=function(){if(S.flags.fem)return;S.flags.fem=true;S.subsidyMult*=1.1;S.fans=Math.round(S.fans*1.05);S.confidence=clamp(S.confidence+4,0,100);S.rep=clamp(S.rep+2,0,100);S.femT={W:0,D:0,L:0,since:S.year};news('La section féminine est lancée en '+FEM_LV[S.div]+'.','g');save();render();};
function reserveWeek(st){
  const R_=S.reserve;if(!R_)return;
  const inXI=new Set(st.xi.map(e=>e.p.id));
  const pool=S.players.filter(p=>!inXI.has(p.id)&&!p.inj&&!p.loan);
  pool.forEach(p=>{if(R()<(p.age<=23?.85:.6)){p.lastPlayed=S.gw;p.morale=clamp(p.morale+.6,0,100);p.rmj=(p.rmj||0)+1;}});
  const top=pool.sort((a,b)=>b.ovr-a.ovr).slice(0,11),avg=top.length?top.reduce((s,p)=>s+p.ovr,0)/top.length:30;
  const lvl=LV[Math.max(0,S.div-2)].str,ref=(lvl[0]+lvl[1])/2-4;
  const [g1,g2]=[poisson(lam(avg,ref,true)),poisson(lam(ref,avg,false))];
  R_.GF+=g1;R_.GA+=g2;if(g1>g2)R_.W++;else if(g1<g2)R_.L++;else R_.D++;
  if(S.flags.fem){const F=S.femT||(S.femT={W:0,D:0,L:0,since:S.year});const q=clamp(.45+(S.infra.entrainement*.04)+(S.rep/400),.2,.8);const x=R();if(x<q)F.W++;else if(x<q+.22)F.D++;else F.L++;}
}
function reserveWeekFem(){if(!S.flags.fem||S.reserve)return;const F=S.femT||(S.femT={W:0,D:0,L:0,since:S.year});const q=clamp(.45+(S.infra.entrainement*.04)+(S.rep/400),.2,.8);const x=R();if(x<q)F.W++;else if(x<q+.22)F.D++;else F.L++;}
function teamsSeasonEnd(msgs){
  if(S.reserve){const R_=S.reserve,n=R_.W+R_.D+R_.L||1,pts=(R_.W*3+R_.D)/n,pos=clamp(Math.round(13-pts*4.2+rf(-1,1)),1,14);R_.last={pos,W:R_.W,D:R_.D,L:R_.L,lv:RES_LV[S.div]};msgs.push('Équipe réserve : '+pos+'e de '+RES_LV[S.div]+' ('+R_.W+' V, '+R_.D+' N, '+R_.L+' D).');Object.assign(R_,{W:0,D:0,L:0,GF:0,GA:0});S.players.forEach(p=>p.rmj=0);}
  if(S.flags.fem&&S.femT){const F=S.femT,n=F.W+F.D+F.L||1,pts=(F.W*3+F.D)/n,pos=clamp(Math.round(12-pts*4+rf(-1,1)),1,12);F.last={pos,lv:FEM_LV[S.div]};msgs.push('Section féminine : '+pos+'e de '+FEM_LV[S.div]+'.');if(pos===1){S.palmares.push('Championnat féminin ('+FEM_LV[S.div]+') '+seasonLabel(S.year-1));S.rep=clamp(S.rep+2,0,100);}Object.assign(F,{W:0,D:0,L:0});}
}

/* ====================== Légendes du club ====================== */
function legendCheck(p,how){
  const own=(p.hist||[]).filter(h=>h.own);const seasons=own.length+((p.s&&(p.s.mj+p.s.cmj))?1:0);
  const apps=own.reduce((a,h)=>a+(h.mj||0),0)+(p.s?p.s.mj+p.s.cmj:0),goals=own.reduce((a,h)=>a+(h.g||0),0)+(p.s?p.s.g+p.s.cg:0);
  if(!(seasons>=6||apps>=160||goals>=60||(seasons>=4&&goals>=35)))return;
  S.legends=S.legends||[];if(S.legends.some(l=>l.id===p.id))return;
  S.legends.push({id:p.id,n:pname(p),pos:p.pos,num:shirtNo(p),seasons,apps,goals,y:S.year,how,retired:false,tribune:false,jubile:false,ret:how==='Retraite'});
  news(pname(p)+' entre dans la légende du club : '+seasons+' saisons, '+apps+' matchs, '+goals+' buts.','g');S.mood=clamp(S.mood+2,0,100);
}
A.legRetire=function(i){const l=S.legends[i];if(!l||l.retired)return;l.retired=true;S.mood=clamp(S.mood+3,0,100);news('Le numéro '+l.num+' de '+l.n+' est retiré à vie.','g');save();render();};
A.legTribune=function(i){const l=S.legends[i];if(!l||l.tribune)return;if(S.legends.filter(x=>x.tribune).length>=Math.min(4,S.infra.stade)){toast('Toutes les tribunes portent déjà un nom (agrandissez le stade).');return;}l.tribune=true;S.mood=clamp(S.mood+6,0,100);S.rep=clamp(S.rep+1,0,100);news('Une tribune portera désormais le nom de '+l.n+'.','g');save();render();};
A.legJubile=function(i){const l=S.legends[i];if(!l||l.jubile||!l.ret)return;l.jubile=true;const att=Math.min(cap(),Math.round(S.fans*.7));const amt=Math.round(att*S.ticket*1.3);fin('Billetterie',amt);S.mood=clamp(S.mood+5,0,100);news('Jubilé de '+l.n+' devant '+nf(att)+' spectateurs : '+money(amt)+' de recette, des larmes et des souvenirs.','g');toast('Jubilé : '+money(amt));save();render();};

const ULTRA_N=['Ultras','Brigade','Kop','Commando','Fanatics','Virage','Armata','Indépendants'];
function ultrasTick(rep){
  const U=S.ultras;if(!U)return;const L=LV[S.div];
  U.rel=clamp(U.rel+(S.ticket<=tk()*1.1?.35:S.ticket>tk()*1.4?-.9:-.3)+(rep.res==='V'?.8:rep.res==='D'?-.9:0)+(S.naming?-.15:0),0,100);
  U.size=Math.round(clamp(U.size+(rep.res==='V'?3:-1)*(1+S.div*.6),20,S.fans*.12));
  if(U.sec>0)U.sec--;
  if(rep.home){
    const pyro=(.05+(U.rel<35?.1:0))*(U.sec>0?.4:1);
    if(R()<pyro){const amt=[300,600,1500,4000,15000,40000,90000][S.div];fin('Amendes',-amt);news('Fumigènes en tribune : la commission de discipline inflige '+money(amt)+' d’amende.','b');
      if(U.rel<20&&R()<.35){S.flags.huisClos=1;S.confidence=clamp(S.confidence-3,0,100);news('Sanction : le prochain match à domicile se jouera à huis clos.','b');}}
    if(U.rel<30&&R()<.3){S.confidence=clamp(S.confidence-1.5,0,100);news('Banderole hostile au président déployée par les '+U.name+'.','b');}
  }
}
function ultraBoost(me){const U=S.ultras;if(!U||U.rel<55)return me;const b=U.rel>=75?1.6:1;return Object.assign({},me,{att:me.att+b,def:me.def+b});}
A.ultraMeet=function(){const U=S.ultras;if(!U)return;if(S.gw-(U.met||-99)<6){toast('Vous les avez rencontrés récemment.');return;}U.met=S.gw;const L=LV[S.div];
  if(S.ticket>tk()*1.2){U.rel=clamp(U.rel+3,0,100);toast('Ils exigent une baisse du prix des places.');news('Réunion tendue avec les '+U.name+' : ils réclament des billets moins chers.','');}
  else{U.rel=clamp(U.rel+8,0,100);toast('Échange constructif avec les '+U.name+'.');news('Rencontre cordiale avec les leaders des '+U.name+'.','g');}save();render();};
A.ultraTifo=function(){const U=S.ultras;if(!U)return;if(U.tifo===S.year){toast('Déjà fait cette saison.');return;}const c=Math.round(Math.max(500,S.sponsorAnnual*.015)/100)*100;if(S.cash<c){toast('Trésorerie insuffisante.');return;}fin('Vie associative',-c);U.tifo=S.year;U.rel=clamp(U.rel+12,0,100);news('Le club finance un local et un tifo pour les '+U.name+' ('+money(c)+').','g');save();render();};
A.ultraSec=function(){const U=S.ultras;if(!U)return;U.sec=8;U.rel=clamp(U.rel-10,0,100);news('Contrôles renforcés aux entrées du virage : les '+U.name+' protestent.','b');save();render();};

function pressCtx(rep){
  const r=S.myResults.slice(-3).map(x=>x.res).join('');const c=S.staff.coach;
  if(r==='DDD')return 'crise';
  if(r==='VVV')return 'serie';
  if(rep&&rep.opp&&rep.opp.derby)return 'rival';
  if(c&&c.rel<35)return 'coach';
  if(S.euro&&S.euro.phase!=='out'&&R()<.5)return 'europe';
  if(windowOpen())return 'mercato';
  if(projection()<0)return 'finances';
  return pick(['ambition','arbitrage','jeunes']);
}

  b.innerHTML=`<span>${UI.cmp.map(id=>esc(pshort(cmpFind(id)))).join(' · ')}</span><button class="btn sm pri" onclick="A.cmpShow()" ${UI.cmp.length<2?'disabled':''}>Comparer (${UI.cmp.length})</button><button class="btn sm" onclick="UI.cmp=[];cmpBar();document.querySelectorAll('[data-cmp]').forEach(b=>b.classList.remove('on'))" aria-label="Vider le comparateur">×</button>`;}
const CMPC=['#f4c430','#5fd3ff','#ff7ab6'];
function radarMulti(list){
  const W=300,cx=150,cy=135,R0=95,n=list[0].at.length,pt=(k,r)=>{const a=-Math.PI/2+k*2*Math.PI/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  let g='';[.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${list[0].at.map((_,k)=>pt(k,R0*f).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" style="stroke:var(--line)"/>`;});
  list[0].at.forEach((a,k)=>{const [lx,ly]=pt(k,R0+18);g+=`<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle">${a.n}</text>`;});
  list.forEach((x,i)=>{g+=`<polygon points="${x.at.map((a,k)=>pt(k,R0*a.v/100).map(v=>v.toFixed(1)).join(',')).join(' ')}" style="fill:${CMPC[i]};fill-opacity:.14;stroke:${CMPC[i]}" stroke-width="2"/>`;});
  return `<svg viewBox="0 0 ${W} 270" class="radar" role="img" aria-label="Comparaison des profils">${g}</svg>`;}
A.cmpShow=function(){
  const ps=UI.cmp.map(cmpFind).filter(Boolean);if(ps.length<2)return;
  const mine=p=>!!getP(p.id),seen=p=>mine(p)||p.scouted;
  const rows=[['Club',p=>mine(p)?esc(S.club.name):esc(p.club)],['Poste',p=>POSN[p.pos]],['Âge',p=>p.age,'low'],['Note',p=>p.ovr,'high'],['Potentiel',p=>mine(p)||p.potSeen?potTxt(p):'?'],
    ['Valeur',p=>money(valueFor(p)),'v'],['Prix demandé',p=>mine(p)?'—':p.fee?money(p.fee):'Libre'],['Salaire',p=>money(mine(p)?p.wage:p.demand)+'/mois'],
    ['Personnalité',p=>seen(p)?p.pers||'—':'?'],['Forme',p=>mine(p)?p.fit+' %':'—'],['Moral',p=>mine(p)?p.morale:'—'],
    ['Matchs (saison)',p=>mine(p)?(p.s.mj+p.s.cmj):'—'],['Buts (saison)',p=>mine(p)?(p.s.g+p.s.cg):'—'],['Note moyenne',p=>mine(p)&&p.s.nn?(p.s.ns/p.s.nn).toFixed(2).replace('.',','):'—']];
  const best=(f,mode)=>{if(!mode)return -1;const v=ps.map(p=>{const x=f(p);return typeof x==='number'?x:mode==='v'?valueFor(p):NaN;});if(v.some(isNaN))return -1;const t=mode==='low'?Math.min(...v):Math.max(...v);return v.filter(x=>x===t).length===1?v.indexOf(t):-1;};
  const same=ps.every(p=>(p.pos==='G')===(ps[0].pos==='G'));

   <div class="cmp-head" style="grid-template-columns:repeat(${ps.length},1fr)">${ps.map((p,i)=>`<div style="--cc:${CMPC[i]}">${jersey(p,40)}<b>${esc(pname(p))}</b><span class="ovr">${p.ovr}</span></div>`).join('')}</div>
   ${same?`<div style="max-width:340px;margin:0 auto">${radarMulti(ps.map(p=>({at:attrs(p)})))}</div>`:'<p class="muted" style="font-size:13px;margin:0">Profils non comparables sur le radar (gardien contre joueur de champ).</p>'}
   <div class="tbl-wrap"><table class="mini cmp"><tbody>${rows.map(([k,f,m])=>{const b=best(f,m);return `<tr><td class="muted">${k}</td>${ps.map((p,i)=>`<td class="${i===b?'gold':''}">${f(p)}</td>`).join('')}</tr>`;}).join('')}</tbody></table></div>
   <div class="row"><button class="btn" onclick="A.close()">Fermer</button><button class="btn" onclick="UI.cmp=[];cmpBar();A.close()">Vider la sélection</button></div>`,true);
};

const SLOTS=3,keyFor=n=>n===1?'president-club-save-v1':'president-club-save-v1-s'+n,CAREER_KEY='president-club-career';
function slotInfo(n){try{const t=localStorage.getItem(keyFor(n));if(!t)return null;const x=JSON.parse(t);return {name:x.club.name,c1:x.club.c1,c2:x.club.c2,div:x.div,year:x.year,over:x.over?x.over.t:null,pal:(x.palmares||[]).length};}catch(e){return null;}}
function careerGet(){try{return JSON.parse(localStorage.getItem(CAREER_KEY)||'[]');}catch(e){return [];}}
function careerAdd(reason){if(!S||S.careerDone)return;S.careerDone=true;const c=careerGet();c.unshift({club:S.club.name,c1:S.club.c1,c2:S.club.c2,from:S.club.start||2026,to:S.year,seasons:S.history.length,best:LV[S.maxDiv].n,maxDiv:S.maxDiv,pal:S.palmares.slice(0,12),end:reason});try{localStorage.setItem(CAREER_KEY,JSON.stringify(c.slice(0,20)));}catch(e){}}

const REQ_MAP=[[/Stade|Tribune/,'stade',null],[/Éclairage d’entraînement/,'eclairage',1],[/E4/,'eclairage',2],[/TV E1/,'eclairage',3],[/synthétique/,'pelouse',1],[/Pelouse naturelle/,'pelouse',2],[/Pôle espoirs/,'formation',2],[/formation agréé/,'formation',3],[/entraînement complet/,'entrainement',3]];
function licenceItems(t){
  return reqs(t).filter(r=>!r.ok).map(r=>{const m=REQ_MAP.find(([re])=>re.test(r.l));if(!m)return {l:r.l,admin:true};
    const k=m[1],need=m[2]??r.need,cur=S.infra[k],bd=S.builds.find(b=>b.key===k);const lv=bd?bd.to:cur;
    let w=bd?bd.left:0,c=0;for(let x=lv+1;x<=need;x++){w+=INFRA[k].weeks[x]||0;c+=INFRA[k].cost[x]||0;}
    return {l:r.l,k,need,w,c,bd:!!bd,blk:buildBlocked(k)};});
}
function licenceCard(){

  const best=by(p=>p.s.ns/p.s.nn),sc=by(p=>p.s.g+p.s.cg),as=by(p=>p.s.a+p.s.ca),yg=by(p=>p.age<=21?p.s.ns/p.s.nn:0);

   <div class="sv-c"><h4>Où est passé l’argent</h4><div class="fbars"><div><div class="muted" style="font-size:12px;margin-bottom:4px">Principales recettes</div>${bars(inc,'good')}</div><div><div class="muted" style="font-size:12px;margin-bottom:4px">Principales dépenses</div>${bars(exp,'bad')}</div></div></div>

function commFind(name){const k=(name||'').trim().toLowerCase();return COMM.find(c=>c[0].toLowerCase()===k)||null;}
function terrFor(town,small){const c=commFind(town);
  if(c)return {n:c[0],dep:c[1],reg:REGIONS[c[2]],pop:c[3],prof:c[4],real:true};
  const sz=SMALL[small||'bourg'];return {n:(town||'').trim()||'Clichy',dep:null,reg:null,pop:sz.pop,prof:small==='ville'?'moy':'rural',real:false,size:small||'bourg'};}
const TP=()=>PROF[(S&&S.terr&&S.terr.prof)||'mixte'];
const popF=e=>S&&S.terr?clamp(Math.pow(S.terr.pop/40000,e),.25,3):1;
function terrFan(){if(!S||!S.terr)return 1;return clamp(Math.pow(S.terr.pop/40000,.42)*TP().fan,.3,2.6)*(S.terr.comp||1);}
function terrEco(){if(!S||!S.terr)return 1;return TP().eco*clamp(Math.pow(S.terr.pop/40000,.16),.72,1.4);}
const tk=()=>LV[S.div].tick*(S.terr?TP().w:1);
function terrNeighbors(n){const t=S.terr;if(!t||!t.dep)return [];const ri_=REGIONS.indexOf(t.reg);let pool=COMM.filter(c=>c[1]===t.dep&&c[0]!==t.n);if(pool.length<2)pool=COMM.filter(c=>c[2]===ri_&&c[0]!==t.n);return pool.sort((a,b)=>Math.abs(Math.log(a[3]/t.pop))-Math.abs(Math.log(b[3]/t.pop))).slice(0,n||6).map(c=>c[0]);}
function terrTowns(){const t=S.terr;if(!t||!t.reg)return null;const ri_=REGIONS.indexOf(t.reg);return COMM.filter(c=>c[2]===ri_&&c[0]!==t.n).map(c=>c[0]);}
// noms d'équipes : en régional et en National 2, les adversaires viennent de la même région
function clubNameLocal(used){
  const loc=S&&S.terr&&S.div<=2?terrTowns():null;
  if(loc&&loc.length&&R()<Math.min(1,loc.length/20)){for(let k=0;k<40;k++){const tw=pick(loc),n=pick(PREF)+' '+tw;if(!used.has(n)&&!used.has('t:'+tw)){used.add(n);used.add('t:'+tw);return n;}}}
  return clubName(used);
}

  ch:[{t:'Demander un rendez-vous au maire',f:d=>{const m=d.pro?rf(1.08,1.2):rf(.88,.98);S.subsidyMult*=m;return d.pro?'La subvention municipale augmente de '+Math.round((m-1)*100)+' %.':'La subvention baisse de '+Math.round((1-m)*100)+' %, mais le dialogue est engagé.';}},{t:'Mobiliser les supporters pour défendre le club',s:'Risqué',f:d=>{if(d.pro||R()<.45){S.subsidyMult*=1.1;S.mood=clamp(S.mood+4,0,100);return 'La mobilisation paie : +10 % de subvention.';}S.subsidyMult*=.85;return 'La mairie n’apprécie pas la pression : −15 % de subvention.';}}]},
 quartiers:{w:1,cond:()=>S.terr&&S.terr.prof==='popu'&&!S.flags.qpv,make:()=>{S.flags.qpv=1;return {};},k:'Politique de la ville',title:'Le club, acteur des quartiers',

function plk(id,name,extra){return `<span class="plink" data-pid="${id}" ${extra||''}>${esc(name)}</span>`;}
function plAI(club,name){return `<span class="plink" data-ai="${esc(club)}|${esc(name)}">${esc(name)}</span>`;}
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-pid],[data-ai]');if(!t||!S)return;
  if(t.closest('button'))return;e.stopPropagation();e.preventDefault();
  if(UI.modalOpen&&t.closest('#mbox')){if(UI.curEv)UI.evBack=UI.curEv;else if(UI.curModalFn)UI.backFn=UI.curModalFn;}

function histTable(h){return h&&h.length?`<div class="tbl-wrap"><table class="mini"><thead><tr><th>Saison</th><th>Club</th><th>Division</th><th class="r">MJ</th><th class="r">Buts</th><th class="r">Passes</th></tr></thead><tbody>${[...h].reverse().slice(0,10).map(x=>`<tr><td>${x.y}</td><td>${esc(x.club)}</td><td class="muted">${esc(x.div||'')}</td><td class="r">${x.mj??'—'}</td><td class="r">${x.g??'—'}</td><td class="r">${x.a??'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted" style="margin:0">Pas d’historique connu.</p>';}

      <div class="kpi"><div class="l">Personnalité</div><div class="v" style="font-size:18px">${sc?esc(m.pers):'?'}</div>${sc?`<div class="muted" style="font-size:12px">${esc(PERS_D[m.pers])}</div>`:''}</div>
      <div class="kpi"><div class="l">Intérêt pour le club</div><div class="v">${Math.round(interest(m)*100)} %</div></div></div></div>

     <div class="row"><button class="btn pri" onclick="A.close();setTimeout(()=>A.nego(${m.id}),40)">${t?'Reprendre la négociation':'Négocier'}</button>${sc?'':`<button class="btn" onclick="A.scoutP(${m.id});A.close()">Superviser</button>`}<button class="btn" onclick="A.watch(${m.id});A.close()">${(S.watch||[]).includes(m.id)?'Retirer du suivi':'Suivre'}</button><button class="btn" onclick="A.cmpToggle(${m.id})">⇄ Comparer</button><button class="btn" onclick="A.close()">Fermer</button></div>`,true);return;}
  const g=(S.gone||{})[id];
  if(g){openModal(`<div class="kicker">Ancien joueur du club</div><div class="spread"><h2>${esc(g.n)}</h2><span class="ovr" style="font-size:40px;color:var(--flood)">${g.ovr}</span></div>
     <p style="margin:0">${POSN[g.pos]}, ${g.age} ans au départ · ${esc(g.how)} (${esc(g.y)})${g.to&&g.to!=='—'?' · aujourd’hui à <b>'+esc(g.to)+'</b>':''}.</p>
     <h3>Carrière</h3>${histTable(g.hist)}<div class="row"><button class="btn" onclick="A.close()">Fermer</button></div>`,true);return;}
  toast('Ce joueur n’est plus suivi par le club.');
};

A.aiInfo=function(club,name){
  const t=S.teams.find(x=>x.name===club)||(S.euro&&S.euro.teams.find(x=>x.name===club));const x=t&&(t.sq||[]).find(q=>q.n===name);
  const lvl=t?Math.round(t.rating+(x?({A:1.5,M:.5,D:-.5}[x.pos]||0)+Math.min(4,(x.g+x.a)*.25):0)):null;

   <div class="kpi"><div class="l">Niveau estimé</div><div class="v">${lvl?'≈ '+lvl:'?'}</div><div class="muted" style="font-size:12px">d’après son équipe et ses statistiques</div></div></div>
