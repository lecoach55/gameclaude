<!doctype html><meta charset=utf-8><body style="margin:0;background:#000"><script src="three.js"></script><script>
// Page factice du contrôle de profil3d.py : une forêt lourde (≈ 90 % des triangles), un sol, des rochers, une lampe ponctuelle,
// des ombres, un objet que le « jeu » remet visible à chaque image. Rien n'est exposé au profil : il doit tout trouver seul.
const W=360,H=360,r=new THREE.WebGLRenderer();r.setSize(W,H);r.shadowMap.enabled=true;document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.fog=new THREE.Fog(0x8899aa,20,80);const cam=new THREE.PerspectiveCamera(50,1,.1,200);cam.position.set(0,14,26);cam.lookAt(0,0,0);
const sol=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x557744}));sol.name='sol';sol.rotation.x=-Math.PI/2;sol.receiveShadow=true;sc.add(sol);
const foret=new THREE.Group();foret.name='foret';sc.add(foret);const ga=new THREE.SphereGeometry(1,FINESSE,FINESSE),ma=new THREE.MeshStandardMaterial({color:0x2d6a2d});
for(let i=0;i<NARBRES;i++){const m=new THREE.Mesh(ga,ma);m.name='arbre_'+i;m.position.set((i%12-6)*2.6,1,(Math.floor(i/12)-5)*2.6);m.castShadow=true;foret.add(m);}
for(let i=0;i<3;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x888888}));m.name='roche'+i;m.position.set(i*3-3,.5,9);sc.add(m);}
const clig=new THREE.Mesh(new THREE.TorusKnotGeometry(1,.3,64,8),new THREE.MeshBasicMaterial({color:0xff0}));clig.name='balise';clig.position.set(0,4,6);sc.add(clig);
const so=new THREE.DirectionalLight(0xffffff,2);so.position.set(10,20,10);so.castShadow=true;sc.add(so);sc.add(new THREE.AmbientLight(0xffffff,.4));
const lp=new THREE.PointLight(0xffaa66,30,30);lp.position.set(0,3,8);sc.add(lp);
let t=0;function boucle(){t+=1/60;foret.rotation.y=t*.1;clig.visible=true;r.render(sc,cam);requestAnimationFrame(boucle);}requestAnimationFrame(boucle);
window.pret=1;</script></body>
