<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Une vie parmi 8 milliards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f13;--card:#161920;--card2:#1d212a;--ink:#efeae2;--mute:#958f86;--acc:#e8a35c;--accd:#e8a35c33;--line:#262a33;--good:#7bc49a;--bad:#e5786a;--warn:#e3c06a;--blue:#7aa7e0;
--serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:16.5px/1.55 var(--serif);background:radial-gradient(1200px 500px at 50% -120px,var(--accd),transparent 70%),var(--bg);min-height:100vh;transition:background .8s}
.wrap{max-width:580px;margin:0 auto;padding:14px 14px 80px}
h1{font-weight:400;font-size:38px;line-height:1.08;margin:46px 0 14px;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--acc)}
p.lead{color:#ddd6cb;font-size:18px}
.sub{color:var(--mute);font:13.5px/1.5 var(--sans)}
button{font:600 15px var(--sans);border:0;border-radius:14px;padding:13px 15px;cursor:pointer;background:var(--acc);color:#1a1206;width:100%;margin-top:8px;text-align:left;display:block;transition:transform .08s,background .2s}
button.c{text-align:center}
button.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
button.ghost:hover{border-color:#3a3f4a}
button.link{background:none;color:var(--mute);font-weight:500;font-size:13px;text-align:center;padding:8px}
button small{display:block;font-weight:400;font-size:12.5px;opacity:.72;margin-top:2px}
button .pc{float:right;font-weight:700;font-size:12px;padding:2px 8px;border-radius:9px;margin-left:8px}
.pc.hi{background:#7bc49a22;color:var(--good)}.pc.md{background:#e3c06a22;color:var(--warn)}.pc.lo{background:#e5786a22;color:var(--bad)}
button:active{transform:scale(.985)}
/* en-tête */
.id{background:#161920f2;border:1px solid var(--line);border-radius:18px;padding:11px 13px;position:sticky;top:6px;z-index:3;box-shadow:0 10px 30px #000b}
.top{display:flex;gap:11px;align-items:center}
.flag{font-size:34px;line-height:1}
.idt{min-width:0;flex:1}.idt b{font:600 17px var(--serif);display:block}
.idt span{font:12px var(--sans);color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.age{text-align:right;font:10.5px var(--sans);color:var(--mute)}
.age b{display:block;font:600 24px var(--serif);color:var(--ink);line-height:1}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;font:10.5px var(--sans);color:var(--mute)}
.st{position:relative}
.st .v{float:right;color:#c9c3b9;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar i.lo{background:var(--bad)}.bar i.hi{background:var(--good)}
.st .v{position:relative}.dlt{position:absolute;right:0;top:0;font:700 10.5px var(--sans);font-style:normal;background:#161920;padding-left:4px;animation:rise 2.4s ease forwards;white-space:nowrap}
.dlt.up{color:var(--good)}.dlt.dn{color:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translateY(4px)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;visibility:hidden}}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{font:11px var(--sans);padding:3px 8px;border-radius:20px;background:var(--card2);border:1px solid var(--line);color:#cfc9bf}
.chip.r{border-color:#5a2f2a;color:var(--bad)}.chip.t{border-color:#4a3b25;color:var(--acc)}
.chip.btn{cursor:pointer;color:var(--blue);border-color:#2c3d55}
.fam{margin-top:9px;font:12.5px/1.65 var(--sans);border-top:1px solid var(--line);padding-top:8px;display:none;color:#cfc9bf}
.fam.on{display:block}.fam .dead{color:var(--mute);text-decoration:line-through}
/* journal */
.log{margin-top:16px}
.stage{display:flex;align-items:center;gap:10px;margin:14px 0 12px;font:700 11px var(--sans);text-transform:uppercase;letter-spacing:1.6px;color:var(--acc)}
.stage:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--accd),transparent)}
.turn{position:relative;padding:0 0 14px 34px;animation:in .45s ease}
.turn:before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.ico{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px}
.turn .a{font:600 11px var(--sans);color:var(--mute);letter-spacing:.6px;margin:4px 0 4px}
.turn .a b{color:var(--ink);font-size:12.5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.notes{font:13px/1.5 var(--sans);color:#bdb7ad;margin:0 0 6px}
.notes div{margin:2px 0}
.ev{font-size:16.5px}
.out{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:16px}
.out .tag{font:700 10px var(--sans);text-transform:uppercase;letter-spacing:1px;margin-right:7px;padding:2px 6px;border-radius:6px}
.tag.ok{color:var(--good);background:#7bc49a1a}.tag.ko{color:var(--bad);background:#e5786a1a}
.fx{font:11.5px var(--sans);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 10px}
.up{color:var(--good)}.dn{color:var(--bad)}
.focus{font:12px var(--sans);color:var(--mute);margin-top:7px}
.act{margin-top:8px;animation:in .35s ease}
.act .q{font:600 11px var(--sans);color:var(--mute);text-transform:uppercase;letter-spacing:1.2px;margin:4px 2px 0}
.turn.dead .ico{background:#222;border-color:#444}
/* fiche de naissance */
.reveal{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px;text-align:center;animation:pop .6s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.reveal .bf{font-size:88px;line-height:1.1}
.reveal h2{font:600 30px var(--serif);margin:6px 0 0}
.reveal .where{font:14px var(--sans);color:var(--mute)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 6px;text-align:left}
.fact{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;font:12px var(--sans);color:var(--mute)}
.fact b{display:block;font:600 17px var(--serif);color:var(--ink)}
.dots{display:flex;gap:3px;margin-top:5px}.dots i{width:16px;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--acc)}
.traits{display:flex;flex-direction:column;gap:6px;margin-top:10px;text-align:left}
.trait{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid #4a3b25;border-radius:12px;padding:8px 11px;font:13px var(--sans)}
.trait b{color:var(--acc);font-weight:600}
.spin{font-size:100px;text-align:center;margin:110px 0 10px;filter:drop-shadow(0 10px 30px #0008)}
/* bilan */
.end{scroll-margin-top:190px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 16px;margin:10px 0;animation:in .6s ease}
.end h2{font:600 26px var(--serif);margin:0}
.end h3{font:600 11px var(--sans);color:var(--mute);text-transform:uppercase;letter-spacing:1.2px;margin:20px 0 8px}
.ring{display:flex;gap:16px;align-items:center;margin:14px 0 4px}
.ring svg text{font:600 26px var(--serif);fill:var(--ink)}
.comp{flex:1;font:12px var(--sans);color:var(--mute)}
.comp div{margin:4px 0}.comp .bar{height:5px}
.comp span{float:right;color:var(--ink);font-weight:600}
.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:7px 0;font:13.5px var(--sans)}
.row span:first-child{color:var(--mute)}.row span:last-child{text-align:right}
.ach{display:flex;gap:10px;align-items:center;font:13.5px var(--sans);padding:6px 0}
.ach i{font-style:normal;font-size:22px}
.ach.new b:after{content:"NOUVEAU";font-size:9.5px;color:var(--good);margin-left:6px;border:1px solid var(--good);border-radius:5px;padding:0 4px}
.moments{font-size:20px;letter-spacing:2px;line-height:1.6;word-wrap:break-word}
.past{margin-top:26px}.past h3{font:600 11px var(--sans);color:var(--mute);text-transform:uppercase;letter-spacing:1.2px}
.past .pl{font:13.5px var(--sans);padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.grid span{font:12px var(--sans);padding:4px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.grid span.off{opacity:.28}
footer{font:11px/1.5 var(--sans);color:var(--mute);margin-top:34px}
svg text{font:10px var(--sans);fill:var(--mute)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
body{background:radial-gradient(900px 420px at 50% -60px,var(--sky,transparent),transparent 72%),radial-gradient(1200px 500px at 50% -120px,var(--accd),transparent 70%),var(--bg);transition:background 1.2s}
body.night:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(1px 1px at 12% 8%,#fff,transparent),radial-gradient(1px 1px at 33% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 6%,#fff,transparent),radial-gradient(1px 1px at 76% 17%,#fff,transparent),radial-gradient(1px 1px at 88% 9%,#fff,transparent),radial-gradient(1px 1px at 22% 22%,#fff,transparent),radial-gradient(1px 1px at 67% 25%,#fff,transparent);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
/* carte */
.map{display:block;width:100%;height:auto}
.hero{position:relative;margin:4px -14px 0;padding:0 6px}
.hero .map{max-height:44vh}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(5);opacity:0}}
.tw{transform-box:fill-box;transform-origin:center;animation:twk 2.6s ease-in-out infinite;opacity:0}
@keyframes twk{0%,100%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1)}}
.arc{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.8s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spinflag{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:46px;filter:drop-shadow(0 6px 18px #000a)}
.counter{font:600 13px var(--sans);color:var(--mute);text-align:center;margin-top:-4px}
.counter b{color:var(--ink);font-variant-numeric:tabular-nums}
/* avatar */
.av{display:block;width:100%;height:100%}
.deadav{filter:grayscale(1);opacity:.6}
.avw{position:relative;width:52px;height:52px;flex:none}
.avw .fb{position:absolute;right:-4px;bottom:-3px;font-size:17px;line-height:1;filter:drop-shadow(0 2px 3px #000a)}
.avw.big{width:104px;height:104px;margin:0 auto}.avw.big .fb{font-size:30px;right:-6px;bottom:-4px}
.avw .av{border-radius:50%;box-shadow:0 0 0 2px var(--line),0 6px 18px #0007}
/* fil de vie */
.life{position:relative;height:5px;border-radius:4px;margin-top:10px;background:linear-gradient(90deg,#f2a07b,#8fc3e8 18%,#bfe3ff 38%,#f3c37a 60%,#f08a5a 75%,#6a4a8a 88%,#1a2040)}
.life i{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #ffffff33,0 0 14px #fff;transition:left 1s cubic-bezier(.2,.8,.2,1)}
.life span{position:absolute;top:-3px;width:2px;height:11px;background:#ffffff88;border-radius:1px}
/* résultats */
.out.win{animation:win 1.2s ease}
@keyframes win{0%{background:#7bc49a33;border-radius:10px}100%{background:transparent}}
.out.lose{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.toast{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);z-index:9;background:#161920f2;border:1px solid var(--acc);color:var(--ink);font:600 15px var(--sans);padding:10px 18px;border-radius:30px;box-shadow:0 10px 40px #000c,0 0 30px var(--accd);animation:toast 2.4s ease forwards;white-space:nowrap;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.endhead{display:flex;gap:14px;align-items:center}
.endhead .avw{width:72px;height:72px}
.journey{margin:14px -4px 0;border-radius:14px;overflow:hidden;background:#0d0f13;border:1px solid var(--line)}
/* scène 3D */
.scene3d{position:relative}
.scene3d.has3d{position:sticky;top:0;z-index:4;margin:-14px -14px 0;height:min(56vh,460px);min-height:300px;background:#0d0f13;overflow:hidden;box-shadow:0 14px 34px #000c;border-bottom:1px solid var(--line)}
.scene3d.has3d #w3{position:absolute;inset:0}
.scene3d.has3d canvas{display:block;width:100%!important;height:100%!important;touch-action:none;cursor:grab}
.scene3d.has3d .id{position:absolute;left:8px;right:8px;bottom:8px;top:auto;background:#11131acc;box-shadow:0 6px 20px #0008;padding:9px 11px}
.scene3d.has3d .id .avw{display:none}
.scene3d.has3d .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.scene3d.has3d .chips::-webkit-scrollbar{display:none}
.scene3d.has3d .chip{white-space:nowrap}
.scene3d.has3d .fam{max-height:120px;overflow:auto}
.scene3d.has3d.off{height:auto;min-height:0;background:none;box-shadow:none;border:0;margin:0 -14px;padding:6px 6px 0}
.scene3d.has3d.off #w3,.scene3d.has3d.off .tools,.scene3d.has3d.off .hint{display:none}
.scene3d.has3d.off .id{position:relative;left:auto;right:auto;bottom:auto}
.scene3d.has3d.off .id .avw{display:block}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.tools button{width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:#11131ad9;border:1px solid #ffffff22;color:#fff;font-size:15px;text-align:center}
.hint{position:absolute;top:14px;left:14px;font:600 11px var(--sans);color:#ffffffb0;background:#0006;padding:5px 9px;border-radius:20px;transition:opacity .6s;pointer-events:none}
.has3d~.log .end{scroll-margin-top:calc(min(56vh,460px) + 10px)}
.scene3d.has3d.off~.log .end{scroll-margin-top:190px}
/* arbre */
.tree{position:fixed;inset:0;z-index:60;background:#0d0f13f8;overflow:auto;padding:16px 14px 40px;animation:in .3s ease}
.trh{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto 8px;font:600 18px var(--serif)}
.trh button{width:38px;height:38px;margin:0;padding:0;border-radius:50%;background:var(--card2);color:var(--ink);border:1px solid var(--line);text-align:center}
.fsec{max-width:560px;margin:14px auto 6px;font:700 11px var(--sans);color:var(--acc);text-transform:uppercase;letter-spacing:1.4px;text-align:center}
.gen{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.fc{width:96px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px;font:12px var(--sans)}
.fc.me{border-color:var(--acc);box-shadow:0 0 0 2px var(--accd),0 8px 24px #0008}
.fc.dd{opacity:.55}
.fa{width:64px;height:64px;margin:0 auto 6px}.fa .av{border-radius:50%;box-shadow:0 0 0 2px var(--line)}
.fc b{display:block;font:600 14px var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc span{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.heart{color:#ff6b8a;font-size:18px}
.vl{width:2px;height:18px;background:var(--line);margin:6px auto}
.fmore{text-align:center;font:12.5px var(--sans);color:var(--mute);margin-top:6px}
.lin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.ln{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:13px var(--sans);display:flex;gap:8px;align-items:center}
.ln b{color:var(--acc);font-weight:700;min-width:46px}.ln span{margin-left:auto;color:var(--mute);font-size:12px}
.ln.cur{border-color:var(--acc)}
</style>
</head>

let cur;
function turn(){

  if(S.dead){S.age=S.deathAge;card(notes);return die()}
  S.age=prev+dt;
  const fx=period(notes,dt);
  if(S.dead){card(notes);return die()}
  const ev=structural()||pickEvent();
  card(notes,fx,ev&&ev.ico);
  if(ev){showEvent(ev)}else{cur.querySelector(".ev").innerHTML=pick(["Les années passent sans grand bouleversement.","La vie suit son cours.","Les saisons se suivent, presque identiques.","Rien d'extraordinaire. Et parfois, c'est très bien comme ça."]);afterEvent()}
}

}

  <p class="sub" id="bt" style="text-align:center;margin-top:6px">Quelque part sur Terre, un bébé naît…</p><div id="rv"></div>`;
  let i=0;const LIM=S.gen>1?1:18;

  S.focus=null;single("Grandir",turn);

function intro(){
  W3.unmount();theme("x");setSky(35);if(IV){clearInterval(IV);IV=null}
  let tw="";for(let i=0;i<46;i++){let r=R()*TOTAL,c=C[0];for(const k of C){r-=k.w;if(r<=0){c=k;break}}const[gx,gy]=proj(GEO[c.n][0]+(R()-.5)*7,GEO[c.n][1]+(R()-.5)*9);tw+=`<circle class="tw" cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="2.6" fill="var(--acc)" style="animation-delay:${(R()*2.6).toFixed(2)}s"/>`}
  const past=SAVE.lives.slice(0,12).map(l=>{const c=C.find(k=>k.f==l.f);return c?proj(...GEO[c.n]):null}).filter(Boolean).map(([px,py])=>`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3" fill="#fff" opacity=".85"/>`).join("");

  $("app").innerHTML=`<div class="hero" style="margin-top:8px">${mapSVG({extra:tw+past})}</div><div class="counter">Depuis que tu as ouvert cette page, <b id="cnt">0</b> bébés sont nés.</div><h1 style="margin-top:22px">Une vie parmi<br><em>8 milliards</em></h1>
  <p class="lead">Chaque seconde, environ quatre bébés naissent sur Terre. L'un d'eux, c'est toi.</p>
  <p class="sub">Ton pays, ta famille et ton caractère sont tirés au sort selon la répartition réelle des naissances. À chaque étape, tu choisis ta priorité et tu affrontes les événements. Les choix risqués affichent leurs chances de réussite. Santé, argent, savoir et liens décident de la suite… jusqu'à la fin.</p>
  <div id="go"></div>
  ${SAVE.lives.length?`<div class="past"><h3>Tes vies · record ${best}</h3>${SAVE.lives.slice(0,8).map(l=>`<div class="pl"><span>${l.f} ${l.n} — ${l.a} ans${l.j?", "+l.j:""}</span><b>${l.s??""}</b></div>`).join("")}</div>`:""}
  <div class="past"><h3>Succès · ${SAVE.ach.length}/${Object.keys(ACH).length}</h3><div class="grid">${Object.entries(ACH).map(([k,v])=>`<span class="${SAVE.ach.includes(k)?"":"off"}" title="${v[2]}">${v[0]} ${v[1]}</span>`).join("")}</div></div>
  <div class="past"><h3>Régions de naissance · ${SAVE.born.length}/9</h3><div class="grid">${Object.entries(REG).map(([k,v])=>`<span class="${SAVE.born.includes(k)?"":"off"}">${v}</span>`).join("")}</div></div>
  <footer>Données approximatives (naissances, espérance de vie, mortalité infantile, fécondité) inspirées des estimations de l'ONU et de la Banque mondiale, arrondies pour le jeu. Les 30 pays représentés couvrent environ deux tiers des naissances mondiales.</footer>`;
  const b=document.createElement("button");b.className="c";b.textContent="Naître";b.onclick=birth;$("go").appendChild(b);
  const tb=document.createElement("button");tb.className="link";tb.textContent="🧪 Mode test : mesurer la fluidité sur cet appareil";tb.onclick=lancerBanc;$("go").appendChild(tb);
  if(!window.__bug){window.__bug=TK.bouton(document.body,"position:fixed;left:8px;bottom:8px;z-index:70;width:34px;height:34px;padding:0;margin:0;border-radius:50%;background:#11131acc;border:1px solid #ffffff22;text-align:center;opacity:.65;font-size:15px")}
  window.scrollTo(0,0);
  const t0=Date.now();IV=setInterval(()=>{const e=$("cnt");if(e)e.textContent=Math.floor((Date.now()-t0)/1000*4.3).toLocaleString("fr-FR")},230);

/* ================= TROUSSE DE TEST (outils-communs/testkit.js) ================= */
// ===== Trousse de test à intégrer dans n'importe quel jeu (artefact Claude) =====
// Ajoute : compteur d'images par seconde (mode test), bouton 🐞 « signaler un problème » (capture + état + erreurs),
// banc de mesure scripté, et envoi des résultats dans la base de l'artefact (lisible par Claude avec db_list).
// Usage dans le jeu :
//   import {Testkit} from './testkit.js';
//   const TK=Testkit({jeu:'hameau', canvas:()=>renderer.domElement, etat:()=>({...}), rendu:()=>renderer.render(scene,cam)});
/* qualité automatique : si la 3D HD tourne sous ~33 img/s sur cet appareil (et que le joueur n'a rien choisi), on passe en standard une fois */
setInterval(()=>{try{if(TK.test||typeof W3=="undefined"||!W3.quality||localStorage.getItem("vie8m_q")||W3.quality()!="hd"||document.hidden)return;const st=$("stage");if(!st||st.classList.contains("off"))return;const a=(TK.ft||[]).slice(-90);if(a.length<90)return;const m=a.reduce((x,y)=>x+y,0)/a.length;if(m>30){W3.quality(true);toast("⚙️ 3D allégée automatiquement pour plus de fluidité (bouton HD pour revenir)")}}catch(e){}},5000);
//   TK.bouton(document.body);            // bouton 🐞 permanent
//   TK.modeTest();                       // affiche le compteur (à appeler depuis un bouton « Mode test »)
//   await TK.banc([{nom:'scène 1', preparer:async()=>{...}}, ...], 5000);  // mesure chaque scène 5 s
// Le mode test ne doit jamais écrire dans la vraie sauvegarde : c'est au jeu de couper sa sauvegarde quand TK.test est vrai.
function Testkit(o){
 const TK={test:false,ft:[],rec:null,lt:0,erreurs:[]};
 let DB=null,UID=null,init=null;
 const cloud=()=>init||(init=(async()=>{try{if(!window.claude||!window.claude.use)return false;const [db,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);UID=await u.id();DB=db;return !!(db&&UID);}catch(e){return false;}})());
 TK.envoyer=async(nom,obj)=>{try{localStorage.setItem(o.jeu+'_'+nom.split('_')[0],JSON.stringify(obj));}catch(e){}if(!await cloud())return false;try{await DB.collection('data/users/'+UID).doc(nom).set(obj);return true;}catch(e){return false;}};
 addEventListener('error',e=>{TK.erreurs.push(String(e.message||e).slice(0,300));if(TK.erreurs.length>20)TK.erreurs.shift();});
 addEventListener('unhandledrejection',e=>TK.erreurs.push('promesse: '+String(e.reason).slice(0,300)));
 const gpu=()=>{try{const c=o.canvas();const gl=c.getContext('webgl2')||c.getContext('webgl');const x=gl.getExtension('WEBGL_debug_renderer_info');return x?gl.getParameter(x.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);}catch(e){return '?';}};
 const stats=a=>{if(!a.length)return{};const s=a.slice().sort((x,y)=>x-y),m=a.reduce((x,y)=>x+y,0)/a.length;return{fps:+(1000/m).toFixed(1),bas1:+(1000/s[Math.floor(s.length*.99)]).toFixed(1),pire:+s[s.length-1].toFixed(1),n:a.length};};
 const tick=t=>{if(TK.lt){const d=t-TK.lt;TK.ft.push(d);if(TK.ft.length>240)TK.ft.shift();if(TK.rec)TK.rec.push(d);}TK.lt=t;if(TK.ov&&t-(TK.tt||0)>500){TK.tt=t;const s=stats(TK.ft.slice(-60));TK.ov.firstChild.textContent=`🧪 ${s.fps||'-'} img/s · pire ${s.pire||'-'} ms`;}requestAnimationFrame(tick);};requestAnimationFrame(tick);
 TK.modeTest=()=>{TK.test=true;if(TK.ov)return;const d=document.createElement('div');d.style.cssText='position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(0,0,0,.72);color:#9fe0a0;font:12px monospace;padding:4px 8px;border-radius:6px';d.innerHTML='<span>🧪</span>';document.body.appendChild(d);TK.ov=d;};
 TK.mesurer=async ms=>{TK.rec=[];await new Promise(r=>setTimeout(r,ms));const a=TK.rec;TK.rec=null;return stats(a);};
 TK.banc=async(scenes,ms=5000)=>{const res=[];for(const s of scenes){try{await s.preparer();await new Promise(r=>setTimeout(r,1500));res.push(Object.assign({scene:s.nom},await TK.mesurer(ms)));}catch(e){res.push({scene:s.nom,erreur:String(e)});}}
  const out={jeu:o.jeu,date:new Date().toISOString(),gpu:gpu(),ua:navigator.userAgent,ecran:innerWidth+'x'+innerHeight+' @'+devicePixelRatio,res};out.enregistre=await TK.envoyer('mesures_'+Date.now(),out);return out;};
 TK.signaler=async()=>{let img='';try{if(o.rendu)o.rendu();const src=o.canvas(),k=Math.min(1,480/src.width),c=document.createElement('canvas');c.width=src.width*k|0;c.height=src.height*k|0;c.getContext('2d').drawImage(src,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.6);}catch(e){}
  const st={jeu:o.jeu,test:TK.test,date:new Date().toISOString(),gpu:gpu(),ua:navigator.userAgent,img_s:stats(TK.ft.slice(-60)).fps,etat:(()=>{try{return o.etat?o.etat():null;}catch(e){return String(e);}})(),erreurs:TK.erreurs.slice(),capture:img};
  return TK.envoyer('signalement_'+Date.now(),st);};
 TK.bouton=(parent,style)=>{const b=document.createElement('button');b.textContent='🐞';b.title='Signaler un problème à Claude';b.style.cssText=style||'position:fixed;right:10px;bottom:10px;z-index:9999;width:38px;height:38px;border-radius:50%;opacity:.75';parent.appendChild(b);
  b.onclick=async()=>{b.disabled=true;const ok=await TK.signaler();b.disabled=false;b.textContent=ok?'✓':'🐞';setTimeout(()=>b.textContent='🐞',1500);};return b;};
 return TK;}

const TK=Testkit({jeu:"une-vie",canvas:()=>document.querySelector("#w3 canvas")||document.createElement("canvas"),
  etat:()=>S?{age:S.age,pays:S.c.n,ab:S.ab?S.ab[0]:null,niveau:S.m,sante:S.h,bonheur:S.b,gen:S.gen,tour:S.turnNo,qualite:W3.quality&&W3.quality(),rendu:W3.info&&W3.info()}:null});
const BANC_SC=[
 ["Campagne pauvre","Niger",8,30,false,"agri",0,""],
 ["Appartement","Brésil",42,32,true,"serv",1,""],
 ["Villa","France",95,50,true,"sante",2,'S.f.robot=1'],
 ["Nuit (vieillesse)","France",80,88,true,"sante",2,'S.retired=true;S.job=null'],
 ["Hiver","Allemagne",60,40,false,"tech",1,'S.turnNo=3']];
function bancEtat(c){const[n,pays,m,age,urb,job,lvl,ex]=c;S.c=C.find(k=>k.n==pays);S.ab=null;S.m=m;S.age=age;S.b=62;S.urban=urb;S.school=null;S.job={s:job,lvl};S.partner={name:"Ama",sex:S.sex=="m"?"f":"m",rel:70,off:-2,since:age-8,married:true,work:true};S.kids=[{name:"Leo",sex:"m",at:age-8,alive:true,inv:0},{name:"Mia",sex:"f",at:age-1,alive:true,inv:0}];S.turnNo=1;if(ex)eval(ex);theme(S.c.r);hdr()}
async function lancerBanc(){
  TK.modeTest();newLife();start();await new Promise(r=>setTimeout(r,1500));
  const sc=[];["sd","hd"].forEach(q=>BANC_SC.forEach(c=>sc.push({nom:c[0]+" · "+q.toUpperCase(),preparer:async()=>{if(W3.quality()!=q){W3.quality(true);await new Promise(r=>setTimeout(r,800))}bancEtat(c)}})));
  toast("🧪 Banc en cours… (~1 min)");
  const out=await TK.banc(sc,4000);
  toast(out.enregistre?"✓ Mesures envoyées à Claude":"Mesures faites (non envoyées)");
  const d=document.createElement("div");d.className="end";d.innerHTML="<h3>🧪 Résultats du banc</h3>"+out.res.map(r=>`<div class="row"><span>${r.scene}</span><span>${r.fps||"?"} img/s · pire ${r.pire||"?"} ms</span></div>`).join("")+`<div class="sub" style="margin-top:8px">${out.gpu}</div>`;$("log").appendChild(d);d.scrollIntoView();
}

intro();
