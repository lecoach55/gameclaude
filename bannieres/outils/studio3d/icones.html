<!DOCTYPE html><html><body style="margin:0;background:transparent"><canvas id="c"></canvas>
<script src="/jeu/lib/three.js"></script>
<script>
// Studio d'icônes : ressources modelées par le code (or, bois, minerai, mercure, soufre, cristal, gemmes), rendu réaliste, fond transparent.
const T=THREE;const ren=new T.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true,preserveDrawingBuffer:true});
ren.outputColorSpace=T.SRGBColorSpace;ren.toneMapping=T.ACESFilmicToneMapping;ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;
let R=12345;const rnd=()=>(R=(R*16807)%2147483647)/2147483647;
const tl=new T.TextureLoader();const TXC={};const tex=n=>{if(TXC[n])return TXC[n];const t=TXC[n]=tl.load('/jeu/tex3d/'+n+'.jpg');t.colorSpace=T.SRGBColorSpace;t.wrapS=t.wrapT=T.RepeatWrapping;return t;};
function bruiter(g,k){const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);const n=Math.sin(x*7.1+y*3.3)*Math.cos(z*5.7+x*2.1)+Math.sin(y*11+z*9)*.5;const s=1+n*k;p.setXYZ(i,x*s,y*s,z*s);}g.computeVertexNormals();return g;}
const OBJ={
 or:sc=>{const m=new T.MeshStandardMaterial({color:0xffc84a,metalness:1,roughness:.28});const ring=new T.CylinderGeometry(.16,.16,.035,40);
  const pos=[];for(let k=0;k<26;k++){const a=rnd()*6.28,r=Math.sqrt(rnd())*.38;pos.push([Math.cos(a)*r,0,Math.sin(a)*r*.8]);}
  pos.sort((a,b)=>Math.hypot(a[0],a[2])-Math.hypot(b[0],b[2]));pos.forEach((p,i)=>{const c=new T.Mesh(ring,m);const h=Math.max(0,.36-Math.hypot(p[0],p[2]))*.9;c.position.set(p[0],h+.02+(i%3)*.01,p[2]);c.rotation.set((rnd()-.5)*.9,rnd()*6,(rnd()-.5)*.9);sc.add(c);});
  for(let k=0;k<6;k++){const c=new T.Mesh(ring,m);c.position.set(.38+k*0,.02+k*.036,.12);sc.add(c);}},
 bois:sc=>{const ec=new T.MeshStandardMaterial({map:tex('ecorce'),roughness:.9});const cv=document.createElement('canvas');cv.width=cv.height=128;const g=cv.getContext('2d');
  const gr=g.createRadialGradient(64,64,4,64,64,64);gr.addColorStop(0,'#c8a070');gr.addColorStop(1,'#8a6440');g.fillStyle=gr;g.fillRect(0,0,128,128);g.strokeStyle='rgba(90,60,30,.6)';for(let r=8;r<64;r+=7){g.beginPath();g.arc(64,64,r,0,7);g.stroke();}
  const bout=new T.MeshStandardMaterial({map:new T.CanvasTexture(cv),roughness:.85});bout.map.colorSpace=T.SRGBColorSpace;
  const pl=[[-.2,0],[.02,0],[.24,0],[-.09,.19],[.13,.19],[.02,.37]];for(const [x,y] of pl){const r=.11+rnd()*.015;const l=.9+rnd()*.1;const m=new T.Mesh(new T.CylinderGeometry(r,r*1.02,l,24),[ec,bout,bout]);m.rotation.z=Math.PI/2;m.rotation.y=.5+(rnd()-.5)*.1;m.position.set(x,y+r,0);sc.add(m);}},
 minerai:sc=>{const m=new T.MeshStandardMaterial({map:tex('roche'),color:0x8a8888,roughness:.85,metalness:.2});const fer=new T.MeshStandardMaterial({color:0x9a8a80,metalness:.9,roughness:.35});
  for(let k=0;k<7;k++){const g=bruiter(new T.DodecahedronGeometry(.13+rnd()*.06,1),.25);const o=new T.Mesh(g,k%3?m:fer);const a=k/7*6.28;const r=k?.22:0;o.position.set(Math.cos(a)*r,.1+(k?0:.12),Math.sin(a)*r*.8);o.rotation.set(rnd()*3,rnd()*3,rnd()*3);sc.add(o);}},
 mercure:sc=>{const verre=new T.MeshPhysicalMaterial({color:0xe8f4ff,metalness:0,roughness:.05,transmission:.92,thickness:.05,ior:1.45,transparent:true,opacity:.55});
  const prof=[];for(let i=0;i<=24;i++){const t=i/24;const y=t*.75;const r=t<.55?.24*Math.sin(Math.min(1,t/.55)*Math.PI*.5+.4):t<.8?.24-(t-.55)*.6:.09;prof.push(new T.Vector2(Math.max(.02,r),y));}
  const f=new T.Mesh(new T.LatheGeometry(prof,40),verre);sc.add(f);const liq=new T.Mesh(new T.SphereGeometry(.2,32,16,0,6.3,Math.PI*.42,Math.PI*.58),new T.MeshStandardMaterial({color:0xd8dce4,metalness:1,roughness:.08}));liq.position.y=.2;sc.add(liq);
  const bouchon=new T.Mesh(new T.CylinderGeometry(.07,.08,.1,20),new T.MeshStandardMaterial({color:0x7a5030,roughness:.9}));bouchon.position.y=.78;sc.add(bouchon);
  for(let k=0;k<3;k++){const g=new T.Mesh(new T.SphereGeometry(.035+k*.01,16,8),liq.material);g.scale.y=.5;g.position.set(.3+k*.06,.02,.15-k*.08);sc.add(g);}},
 soufre:sc=>{const m=new T.MeshStandardMaterial({map:tex('roche2'),color:0xfff060,roughness:.7,emissive:0x2a2000});for(let k=0;k<9;k++){const g=bruiter(new T.IcosahedronGeometry(.12+rnd()*.06,2),.45);const o=new T.Mesh(g,m);const a=rnd()*6.28,r=rnd()*.25;o.position.set(Math.cos(a)*r,.1+(r<.1?.12:0),Math.sin(a)*r*.8);sc.add(o);}},
 cristal:sc=>{const m=new T.MeshPhysicalMaterial({color:0xe02838,metalness:0,roughness:.08,transmission:.6,thickness:.3,ior:1.6,emissive:0x400008});
  const base=new T.Mesh(bruiter(new T.DodecahedronGeometry(.2,1),.2),new T.MeshStandardMaterial({map:tex('roche'),color:0x6a6460,roughness:.9}));base.scale.y=.45;base.position.y=.05;sc.add(base);
  for(let k=0;k<7;k++){const h=.35+rnd()*.35;const g=new T.CylinderGeometry(0,.06+rnd()*.03,h*.25,6);g.translate(0,h*.5+h*.125,0);const g2=new T.CylinderGeometry(.06,.06,h,6);g2.translate(0,h*.5,0);
   for(const gg of [g2,g]){const o=new T.Mesh(gg,m);o.position.set((rnd()-.5)*.2,.05,(rnd()-.5)*.15);o.rotation.set((rnd()-.5)*.8,rnd()*6,(rnd()-.5)*.8);sc.add(o);if(gg===g2){o.userData.k=k;}}}},
 gemmes:sc=>{const cs=[0x2a6ae8,0x28c858,0xe82a8a,0xf0d02a,0x2ad8e8,0xa040e0];for(let k=0;k<8;k++){const m=new T.MeshPhysicalMaterial({color:cs[k%cs.length],metalness:0,roughness:.03,transmission:.5,thickness:.2,ior:2.2,emissive:new T.Color(cs[k%cs.length]).multiplyScalar(.15)});
  const g=new T.OctahedronGeometry(.1+rnd()*.03,0);g.scale(1,.75,1);const o=new T.Mesh(g,m);const a=rnd()*6.28,r=rnd()*.3;o.position.set(Math.cos(a)*r,.07+(r<.12?.07:0),Math.sin(a)*r*.7);o.rotation.set(rnd()*3,rnd()*3,rnd()*3);sc.add(o);}},
};
window.rendre=(nom,S)=>{ren.setPixelRatio(1);ren.setSize(S,S,false);ren.setClearColor(0,0);R=777+nom.length*13;
 const sc=new T.Scene();const pm=new T.PMREMGenerator(ren);sc.environment=pm.fromScene(new T.RoomEnvironment(),.04).texture;sc.environmentIntensity=.9;
 sc.add(new T.HemisphereLight(0xfff4e0,0x3a3020,.6));const sun=new T.DirectionalLight(0xffecd0,2.4);sun.position.set(-2,4,3);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.0005;sc.add(sun);
 const sol=new T.Mesh(new T.CircleGeometry(.8,40),new T.ShadowMaterial({opacity:.35}));sol.rotation.x=-Math.PI/2;sol.receiveShadow=true;sc.add(sol);
 const gr=new T.Group();sc.add(gr);OBJ[nom](gr);gr.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
 const bb=new T.Box3().setFromObject(gr);const c=bb.getCenter(new T.Vector3()),sz=bb.getSize(new T.Vector3());const half=Math.max(sz.x,sz.y*1.2,sz.z)*.62;
 const cam=new T.OrthographicCamera(-half,half,half,-half,.01,50);cam.position.set(c.x,c.y+Math.sin(.6)*5,c.z+Math.cos(.6)*5);cam.lookAt(c);
 ren.render(sc,cam);return ren.domElement.toDataURL('image/png');};
</script></body></html>
