<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Le Trône de Braise</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- accueil -->
<section id="accueil" class="ecran on">
 <canvas id="braises"></canvas>
 <div class="titre-bloc">
  <h1>Le Trône de Braise</h1>
  <div class="sous">Fondez une dynastie, purgez les cryptes, prenez la couronne.</div>
  <div class="menu-acc">
   <button class="btn or" id="bContinuer" style="display:none">▶ Continuer la partie</button>
   <button class="btn" id="bNouvelle">⚔ Nouvelle partie</button>
   <button class="btn" id="bAide">📖 Comment jouer</button>
   <button class="btn petit" id="bTest">🧪 Mode test</button>
  </div>
 </div>
 <div class="credits">Un jeu créé pour Victor · musique et sons générés en direct · aucune connexion nécessaire</div>
</section>
<!-- création -->
<section id="creation" class="ecran">
 <div class="crea">
  <h2>Votre lignée</h2>
  <div class="ligne"><label>Nom de votre héros<br><input type="text" id="cNom" maxlength="18" value="Émeric"></label><label>Nom de votre maison<br><input type="text" id="cMaison" maxlength="18" value="Aubrac"></label></div>
  <div class="ligne"><div class="choix" id="cSexe"><button data-v="h" class="sel">Sire</button><button data-v="f">Dame</button></div></div>
  <div class="classes" id="cClasses"></div>
  <div class="ligne"><span style="align-self:center;font-size:14px;color:#c9b38a">Difficulté</span><div class="choix" id="cDif"><button data-v="facile">Clémente</button><button data-v="normale" class="sel">Normale</button><button data-v="difficile">Impitoyable</button></div></div>
  <div class="ligne"><span style="align-self:center;font-size:14px;color:#c9b38a">Chute au combat</span><div class="choix" id="cMort"><button data-v="0" class="sel">Blessure grave</button><button data-v="1">Mort réelle (l’héritier prend la suite)</button></div></div>
  <div class="ligne"><button class="btn" id="cRetour">← Retour</button><button class="btn or" id="cGo" style="font-size:18px;padding:.7em 2em">Prendre le gouvernement</button></div>
 </div>
</section>
<!-- royaume -->
<section id="royaume" class="ecran">
 <canvas id="carte"></canvas>
 <div class="barre" id="barre"></div>
 <div id="panneau"></div>
 <div class="bas-g">
  <button class="btn" id="bDyn">👑 Dynastie</button>
  <button class="btn" id="bArm">🛡️ Armurerie</button>
  <button class="btn" id="bMais">🤝 Maisons</button>
  <button class="btn" id="bChron">📜 Chronique</button>
  <button class="btn" id="bMenu">☰</button>
 </div>
 <button class="btn or" id="finSaison">⏳ Fin de la saison</button>
</section>
<!-- donjon -->
<section id="donjon" class="ecran">
 <canvas id="jeu"></canvas>
 <div class="hud">
  <div class="lieu" id="hLieu"></div>
  <canvas id="minicarte" width="150" height="150"></canvas>
  <div class="bossbar" id="hBoss"><div class="nm"></div><div class="j"><i></i></div></div>
  <div class="msg" id="hMsg"></div>
  <div class="bonus" id="hBonus"></div>
  <div class="tip" id="hTip"></div>
  <div class="orbe vie"><i id="hVie"></i><span id="hVieT"></span></div>
  <div class="orbe mana"><i id="hMana"></i><span id="hManaT"></span></div>
  <div class="barre-comp" id="hComp"></div>
  <div class="xp"><i id="hXp"></i></div><div class="niv" id="hNiv"></div>
  <div class="action" id="hAction"><button class="btn or" id="bDescendre">⬇ Descendre (E)</button></div>
  <div class="btns-d"><button class="btn" id="bPause">⏸ Échap</button><button class="btn" id="bInvD">🎒 I</button><button class="btn" id="bCompD">✦ K</button></div>
  <div class="tactile"><div id="joy"><i></i></div><button id="attq">⚔</button></div>
 </div>
</section>
<div id="voile"><div class="fenetre" id="fen"></div></div>
<div class="toast" id="toast" style="opacity:0"></div>
<script>/* graine fixe pour les tests : ?graine=N */(function(){var m=/[?&]graine=(\d+)/.exec(location.search);if(!m)return;var a=+m[1];Math.random=function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};})();</script>
<script src="data.js"></script>
<script src="objets.js"></script>
<script src="monde.js"></script>
<script src="sons.js"></script>
<script src="donjon.js"></script>
<script src="royaume.js"></script>
<script src="evenements.js"></script>
<script src="rendu.js"></script>
<script src="carte.js"></script>
<script src="nuage.js"></script>
<script src="ui.js"></script>
<script type="module" src="testkit.js"></script>
</body>
</html>
