<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couronnes &amp; Complots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Plan : une carte de cartographe enluminée posée sur une table de cuir sombre ; l'audace est dans la carte, le reste reste sobre et chaud. Thème unique. */
:root{
  --table:#17110d; --panel:#211812; --card:#2b2019; --line:#4a3828;
  --ink:#f1e5cc; --muted:#b5a083; --gold:#d4a548; --gold-d:#9c7426; --blood:#a8382f;
  --parch:#efe1bf; --parch-ink:#2b1d10;
  --f-display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-map:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-body:"Alegreya", Georgia, "Times New Roman", serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--table);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(ellipse at 30% 20%,rgba(120,70,30,.10),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(90,40,20,.12),transparent 55%)}
button{font-family:var(--f-body);font-size:14px;cursor:pointer;border-radius:5px;border:1px solid var(--line);background:linear-gradient(#35281e,#2a1f17);color:var(--ink);padding:7px 12px;transition:border-color .15s,transform .1s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--gold);box-shadow:0 0 0 1px rgba(212,165,72,.25)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(#e2b85a,#b8892f);color:#24170a;border-color:#7c5a1c;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,240,200,.5),0 2px 6px rgba(0,0,0,.35);letter-spacing:.01em}
button.primary:hover:not(:disabled){border-color:#f3d48a}
button.danger{border-color:#7a3530;color:#f0b9b2}
select,input{font-family:var(--f-body);font-size:14px;background:#2a1f17;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:6px 8px}
a{color:var(--gold)}
header{display:flex;align-items:center;gap:14px;padding:8px 16px 6px}
.brand{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;color:var(--gold);white-space:nowrap;display:flex;align-items:center;gap:9px;text-shadow:0 1px 0 #000}
.brand svg{width:26px;height:22px}
.brand small{font-family:var(--f-map);font-style:italic;font-size:14px;color:var(--muted);letter-spacing:0;text-shadow:none}
header .spacer{flex:1}
.hbtn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hbtn button{white-space:nowrap}
#pbar{padding:0 16px 8px;overflow-x:auto;border-bottom:1px solid var(--line);box-shadow:0 6px 14px -10px #000}
#players{display:flex;flex-wrap:wrap;gap:6px 8px}
#players .chip{flex:1 1 auto}
.chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 8px;white-space:nowrap;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:13px;font-variant-numeric:tabular-nums;position:relative;overflow:hidden}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--hc)}
.chip.cur{border-color:var(--gold);background:linear-gradient(90deg,rgba(212,165,72,.14),var(--panel) 60%)}
.chip.dead{opacity:.38;text-decoration:line-through}
.chip .sw{width:14px;height:16px;flex:none;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.shieldI{flex:none;display:inline-block;vertical-align:middle;overflow:visible}
.chip .nm{flex:none;margin-right:auto;font-family:var(--f-display);font-size:14.5px;font-weight:400}
.chip .tag{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.chip .ph{font-size:11px;color:var(--gold);font-style:italic}
.chip .st{display:inline-flex;gap:1.5px;vertical-align:middle}
.chip .st i{width:4px;height:10px;background:#3e3127;border-radius:1px}
.chip .st i.on{background:#93b874}.chip .st i.low{background:#cf6a50}.chip .st i.hi{background:var(--gold)}
main{flex:1;display:flex;min-height:0}
#board{flex:1;position:relative;min-width:0;display:flex;align-items:center;justify-content:center;padding:14px;
  background:radial-gradient(ellipse at 50% 45%,#2b1e15,#120c08 78%)}
#map{width:100%;height:100%;max-height:100%}
.land{cursor:pointer}
.tint{transition:fill .5s}
.tok{cursor:pointer}
.tok .shield{transition:fill .5s}
.tok:hover .shield{stroke:#fff3cf}
.tok text.n{font:700 13px var(--f-body);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}
.tok text.lbl{font:italic calc(13px * var(--lk, 1)) var(--f-map);transform:translateY(calc((var(--lk, 1) - 1) * 9px));fill:#24180c;text-anchor:middle;paint-order:stroke;stroke:#efe2c0;stroke-width:3.2px;stroke-linejoin:round;pointer-events:none;letter-spacing:.01em}
.sea{font:italic 14px var(--f-map);fill:#d9e6e1;opacity:.72;letter-spacing:.18em;text-anchor:middle}
.ring{fill:none;stroke-width:2.5;pointer-events:none}
.ring.sel{stroke:#ffd76a;stroke-width:3}
.ring.tgt{stroke:#ff5a45;stroke-width:3}
.ring.claim{stroke:#ffd76a;stroke-width:3;animation:claimPulse 1.6s ease-in-out infinite}
@keyframes claimPulse{0%,100%{stroke-opacity:1;r:21px}50%{stroke-opacity:.25;r:27px}}
.claimTag{color:#24170a;background:var(--gold);border-radius:3px;padding:0 5px;font-size:11px;font-weight:700}
.claimCard{border-color:var(--gold);background:linear-gradient(rgba(212,165,72,.18),rgba(212,165,72,.06))}
.ol{fill:none;stroke-linecap:round;pointer-events:none;display:none}
.ol.sel{display:inline;stroke:#ffd76a;stroke-width:4;filter:drop-shadow(0 0 4px rgba(255,215,106,.8))}
.ol.tgt{display:inline;stroke:#ff5a45;stroke-width:4;filter:drop-shadow(0 0 4px rgba(255,90,69,.8))}
.ol.valid{display:inline;stroke:#fffaf0;stroke-width:2.2;stroke-dasharray:5 4;animation:spin 6s linear infinite}
@keyframes spin{to{stroke-dashoffset:-56}}
#arrow{fill:none;stroke:#2a1608;stroke-width:5;stroke-linecap:round;pointer-events:none;opacity:.8}
#arrowIn{fill:none;stroke-width:2.8;stroke-linecap:round;pointer-events:none}
#map.striking #arrow,#map.striking #arrowIn,#map.striking #arrowHead{visibility:hidden}
.tok.flash .body{animation:pop .7s ease-out}
.tok.flash .ring{animation:halo .9s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes halo{0%{stroke:#fff;stroke-width:9;opacity:1}100%{stroke:#fff;stroke-width:1;opacity:0}}
.tok .body{transform-box:fill-box;transform-origin:center}
.tok.enter .body{animation:drop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
@keyframes drop{from{transform:translateY(-14px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.flag .flagIn{animation:plant .55s cubic-bezier(.3,1.5,.5,1) both, fadeFlag 1.7s ease-in forwards}
@keyframes plant{from{transform:translateY(-22px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeFlag{0%,70%{opacity:1}100%{opacity:0}}
#modal .crest{display:flex;justify-content:center;margin:-6px 0 2px}
#modal .kicker{text-align:center;font-family:var(--f-map);font-style:italic;color:#6e5838;margin:0 auto 2px;font-size:14px}
#modal:has(.crest){backdrop-filter:blur(4px) sepia(.25)}
.strike{pointer-events:none}
.strike .sk{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 1.5px #1a0f06);animation:strikeDraw .28s ease-out forwards, strikeFade .75s ease-in forwards}
.strike .sh{stroke:#1a0f06;stroke-width:.8;opacity:0;animation:strikeHead .75s ease-in forwards}
.strike .clash path{fill:none;stroke:#fff6d8;stroke-width:2.2;stroke-linecap:round;opacity:0;transform:scale(.3);animation:clash .5s .22s ease-out forwards}
.strike.hit .clash path{stroke:#ffcf6a}
@keyframes strikeDraw{to{stroke-dashoffset:0}}
@keyframes strikeFade{0%,65%{opacity:1}100%{opacity:0}}
@keyframes strikeHead{0%,30%{opacity:0}40%,65%{opacity:1}100%{opacity:0}}
@keyframes clash{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
.tok.shake .body{animation:shake .32s .22s ease-in-out}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}
.chron{list-style:none;margin:6px 0 4px;padding:0;font-size:13px;columns:2 220px;column-gap:18px}
.chron li{break-inside:avoid;padding:1px 0}
.chron .ci{font-family:serif;color:#2b1d10;display:inline-block;width:1.1em;text-align:center}
.chron .cr{color:#8a6d45;font-variant-numeric:tabular-nums;margin-right:2px}
.float.loss{fill:#ffd2c8;font-size:17px;stroke-width:3.8px}
.float{font:700 16px var(--f-body);fill:#fff;paint-order:stroke;stroke:#2a1608;stroke-width:3.5px;text-anchor:middle;pointer-events:none;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
#tray{position:absolute;left:22px;bottom:20px;background:rgba(23,17,13,.94);border:1px solid var(--line);border-radius:8px;padding:9px 13px;display:none;gap:13px;align-items:center;max-width:calc(100% - 44px);box-shadow:0 8px 20px rgba(0,0,0,.5)}
#tray.show{display:flex}
#tray .side{display:flex;gap:6px;align-items:center}
#tray .lab{font-family:var(--f-display);font-size:13px;color:var(--muted);margin-right:3px}
#tray .res{font-size:13px;max-width:280px}
.die{width:34px;height:34px;border-radius:7px;position:relative;animation:roll .4s cubic-bezier(.2,1.4,.4,1);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35),0 3px 6px rgba(0,0,0,.45)}
.die svg{width:100%;height:100%}
.die.att{background:linear-gradient(145deg,#cf5145,#8d2a23)}.die.att circle{fill:#fff6ea}
.die.def{background:linear-gradient(145deg,#fbf3e2,#d8c9a8)}.die.def circle{fill:#2a1d10}
.die.pol{background:linear-gradient(145deg,#ecc566,#a87a24)}.die.pol circle{fill:#2a1d06}
.die.lost{opacity:.35;filter:grayscale(.6)}
.die .mod{position:absolute;right:-6px;top:-7px;background:#24170a;color:var(--gold);font-size:10px;font-weight:700;border-radius:8px;padding:0 4px;border:1px solid var(--gold)}
@keyframes roll{from{transform:rotate(-200deg) scale(.5)}to{transform:none}}
#zoom{position:absolute;top:22px;right:24px;display:flex;flex-direction:column;gap:4px;z-index:3}
#zoom button{width:34px;height:34px;padding:0;font-size:18px;line-height:1;background:rgba(36,24,16,.9);box-shadow:0 3px 8px rgba(0,0,0,.45)}
#map.zoomed{cursor:grab;touch-action:none}
#map:not(.zoomed) ~ #zoom #zOut,#map:not(.zoomed) ~ #zoom #zReset{display:none}
#map.gesture{will-change:transform;filter:none}
#mapShadow{position:absolute;pointer-events:none;box-shadow:0 14px 28px rgba(0,0,0,.7),0 2px 3px rgba(0,0,0,.6);border-radius:6px}#map.dragging{cursor:grabbing}
#legBtn{position:absolute;right:24px;bottom:20px;z-index:3;font-family:var(--f-display);font-size:13px;padding:4px 10px;background:rgba(36,24,16,.9);display:none}
#legend.closed{display:none}
#legend.closed ~ #legBtn{display:block}
#legend{position:absolute;right:22px;bottom:20px;cursor:pointer;background:rgba(239,225,191,.95);color:var(--parch-ink);border:1px solid #6f5434;outline:1px solid rgba(239,225,191,.6);outline-offset:2px;border-radius:2px;padding:8px 12px 9px;font-size:12.5px;display:grid;grid-template-columns:auto auto;gap:2px 14px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
#legend .lt{grid-column:1/-1;font-family:var(--f-display);font-size:13px;text-align:center;border-bottom:1px solid #b79d70;margin-bottom:3px;padding-bottom:2px;letter-spacing:.06em}
#legend .lr{display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:var(--f-map)}
#legend .lr b{font-family:var(--f-body)}
#legend .dot{width:11px;height:13px;display:inline-flex;align-items:center;justify-content:center;border:1px dashed #b39b70;border-radius:2px}
#legend .dot:has(svg){border:0}
#tip{position:absolute;pointer-events:none;background:var(--parch);color:var(--parch-ink);border:1px solid #6f5434;border-radius:3px;padding:7px 10px;font-size:13px;display:none;z-index:5;max-width:230px;box-shadow:0 6px 16px rgba(0,0,0,.45)}
#tip b:first-child{font-family:var(--f-display);font-size:15px;font-weight:400}
#tip .muted{color:#6e5838}
aside{width:368px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;box-shadow:inset 8px 0 16px -12px #000}
#pbody{padding:14px 15px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.turnhead{display:flex;align-items:center;gap:10px}
.turnhead .sw{width:20px;height:24px;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.turnhead h2{font-family:var(--f-display);font-size:21px;margin:0;font-weight:400;letter-spacing:.02em}
.turnhead .rd{margin-left:auto;font-size:12.5px;color:var(--muted);font-style:italic}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.phases span{font-size:12px;text-align:center;padding:5px 0;background:#1b140f;color:#7d6a52;border-right:1px solid var(--line)}
.phases span:last-child{border-right:0}
.phases span.on{color:#24170a;background:linear-gradient(#e2b85a,#b8892f);font-weight:700}
.phases span.done{color:var(--muted);background:#2a1f17}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 1px 0 rgba(255,235,200,.04)}
.card h3{margin:0;font-family:var(--f-display);font-size:16px;color:var(--gold);font-weight:400;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.card h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-d),transparent)}
.card p{margin:0;font-size:13.5px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 9px;position:relative}
.act b{font-family:var(--f-display);font-weight:400;font-size:15px;padding-right:30px;line-height:1.15}.act span{font-size:11.5px;color:var(--muted);line-height:1.25}
.act .cost{position:absolute;top:7px;right:8px;color:var(--gold);font-weight:700;font-size:12px}
.act.on{border-color:var(--gold);background:linear-gradient(#45351f,#3a2c1b)}
.big{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 11px;background:#241a13}
.seg button.on{background:linear-gradient(#e2b85a,#b8892f);color:#22190a}
.edict{background:var(--parch);color:var(--parch-ink);border-radius:3px;padding:8px 10px;border:1px solid #6f5434;box-shadow:inset 0 0 18px rgba(120,80,30,.25)}
.edict b{font-family:var(--f-display);font-weight:400;font-size:16px}
.edict p{color:#3d2b17}
.edict .muted{color:#6e5838}
.tally{display:flex;gap:10px;font-size:12.5px;font-variant-numeric:tabular-nums}
.meter{height:6px;background:#17110d;border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold))}
.crown{display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;font-size:12.5px;align-items:center}
.ok{color:#9cc27a}.ko{color:#d0806e}
.odds{display:flex;align-items:center;gap:8px;font-size:12.5px}
.odds .meter{flex:1;height:8px}
.odds .meter i{background:linear-gradient(90deg,#a8382f,#d4a548,#93b874)}
.feed{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
#log{border-top:1px solid var(--line);max-height:30%;min-height:110px;overflow-y:auto;padding:8px 15px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;background:#1a130e}
#log div{line-height:1.3}
#log .r{display:block;font-family:var(--f-display);color:var(--gold);font-size:13px;margin-top:6px;border-bottom:1px solid #3a2c20}
#modal{position:fixed;inset:0;background:rgba(10,6,3,.74);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;backdrop-filter:blur(2px)}
#modal.hidden{display:none}
#modal .box{background:var(--parch);color:var(--parch-ink);border:1px solid #6f5434;outline:1px solid rgba(239,225,191,.5);outline-offset:4px;border-radius:2px;max-width:660px;width:100%;max-height:90%;overflow-y:auto;padding:24px 28px;
  box-shadow:0 24px 70px rgba(0,0,0,.7),inset 0 0 60px rgba(130,90,40,.28);animation:unroll .35s ease-out}
@keyframes unroll{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
#modal h2{font-family:var(--f-display);font-weight:400;color:#6b1f18;margin:0 0 10px;font-size:28px;text-wrap:balance;line-height:1.1}
#modal h3{font-family:var(--f-display);font-weight:400;font-size:18px;margin:18px 0 6px;color:#3a2412;border-bottom:1px solid #b79d70;padding-bottom:2px}
#modal p,#modal li{font-size:15px;max-width:65ch}
#modal .muted{color:#6e5838}
#modal ul{padding-left:20px;margin:6px 0}
#modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#modal button:not(.primary){background:#e2d1a8;color:var(--parch-ink);border-color:#8d6f45}
#modal button.danger{color:#7a1d16;border-color:#a3473d}
#modal select,#modal input{background:#f7ecd2;color:var(--parch-ink);border-color:#8d6f45}
#modal a{color:#6b1f18}
.setup{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:10px}
.setup .sw{width:18px;height:22px;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
table.rt{border-collapse:collapse;font-size:14px;width:100%}
table.rt td,table.rt th{border-bottom:1px solid #c4ab7d;padding:5px 6px;text-align:left;vertical-align:top}
table.rt th{font-family:var(--f-display);font-weight:400}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1350px){aside{width:330px}#tray .res{max-width:220px}#players{flex-wrap:nowrap}#players .chip{flex:1 1 0;min-width:0}.chip .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}.chip .st{display:none}.chip .stn{display:inline}}
.chip .stn{display:none}
#drawerBar{display:none}
@media (max-width:900px){
  /* téléphone / volet étroit : carte en grand, panneau du tour en tiroir bas (comme Couronnes & Lignées), dés par-dessus la carte */
  :root{--peek:clamp(170px,30dvh,300px)}
  body{overflow:hidden;height:100vh;height:100dvh}
  header{flex-wrap:nowrap;gap:6px;padding:5px 8px 4px}
  .brand{font-size:17px;gap:6px;min-width:0}.brand small{display:none}
  .hbtn{gap:4px;flex-wrap:nowrap}
  .hbtn button,.hbtn select{min-height:44px;min-width:44px;padding:4px 8px;font-size:13px}
  #modal .btns button,#modal .seg button{min-height:44px}
  .hbtn label[for="speed"]{display:none}
  #pbar{padding:0 8px 5px;overflow:hidden}
  #players{flex-wrap:nowrap;gap:5px}
  #players .chip{flex:1 1 0;min-width:0;padding:4px 6px 4px 7px;gap:5px}
  main{flex-direction:column;flex:1 1 auto;min-height:0}
  #board{display:block;flex:1 1 auto;min-height:0;padding:4px 4px 0;margin-bottom:var(--peek)}
  #map{width:100%;height:100%;touch-action:none}
  #tray{position:absolute;left:8px;right:8px;bottom:8px;margin:0;flex-wrap:wrap;max-width:none;z-index:4;padding:7px 10px;gap:8px 12px}
  #tray .res{max-width:none;flex-basis:100%}
  .die{width:30px;height:30px}
  aside{position:fixed;left:0;right:0;bottom:0;width:auto;height:var(--peek);z-index:6;border:1px solid var(--gold-d);border-bottom:0;border-radius:12px 12px 0 0;
    overflow-y:auto;overscroll-behavior:contain;display:block;box-shadow:0 -10px 24px rgba(0,0,0,.55);transition:height .25s ease-out}
  aside.open{height:86dvh}
  #drawerBar{display:flex;position:sticky;top:0;z-index:2;align-items:stretch;gap:6px;padding:0 8px 0 0;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;background:linear-gradient(#2e2219,#241a13)}
  #drawer{display:flex;position:relative;flex:1;min-height:44px;align-items:center;justify-content:center;border:0;border-radius:12px 12px 0 0;background:none;box-shadow:none;
    font-family:var(--f-display);font-size:13px;color:var(--muted);letter-spacing:.04em}
  #drawer::before{content:"";width:38px;height:4px;border-radius:2px;background:#6a5338;position:absolute;top:5px;left:calc(50% - 19px)}
  #drawer span{margin-top:6px}
  #drawer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 4px}
  #drawerGo,#drawerGo2{align-self:center;min-height:40px;padding:4px 10px;font-size:13px;white-space:nowrap}
  #drawerGo[hidden],#drawerGo2[hidden]{display:none}
  #pbody button,#pbody .seg button{min-height:44px}
  #map{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #tray.show ~ #legBtn{display:none}
  #pbody{overflow:visible;padding:10px 12px}
  #log{max-height:none;min-height:0}
  #legend{left:8px;right:8px;bottom:8px;max-height:calc(100% - 70px);overflow-y:auto;z-index:4}
  #legBtn,#legend.closed ~ #legBtn{display:block;right:8px;bottom:8px;min-height:40px;padding:4px 12px}
  #legend:not(.closed) ~ #legBtn{display:none}
  #zoom{top:8px;right:8px;gap:6px}#zoom button{width:40px;height:40px;font-size:18px}
  #tip{pointer-events:none;max-width:250px}
}
@media (max-width:900px) and (orientation:landscape){
  /* téléphone couché : panneau à droite, sans tiroir */
  main{position:relative}
  #board{margin-bottom:0;margin-right:min(330px,42vw)}
  aside,aside.open{position:absolute;top:0;right:0;bottom:0;left:auto;width:min(330px,42vw);height:auto;border-radius:0;border-bottom:1px solid var(--gold-d)}
  #drawer{visibility:hidden}
  #drawerBar{border-radius:0}
  #tray{right:auto;max-width:calc(100% - 64px);flex-wrap:nowrap;padding:5px 8px;gap:8px}
  #tray .die{width:24px;height:24px}
  #tray .res{font-size:12px;max-width:200px;flex-basis:auto}
  .brand .bt{display:none}
}
@media (max-width:600px){
  .brand .bt{display:none}
  #players .chip .tag,#players .chip .ph,#players .chip .cT,#players .chip .cA,#players .chip .cI,#players .chip .stn,#players .chip .pc{display:none}
  .chip .nm{font-size:13px}
  #players .chip{flex-wrap:wrap;row-gap:0;line-height:1.15;padding:3px 6px 3px 7px}
  #players .chip .nm{flex:1 1 calc(100% - 22px)}
  #players .chip .cA{display:inline;font-size:11px;color:var(--muted);margin-left:19px}
}
</style>

function influenceIncome(o) {
  const p = P(o);
  if (RULES.infTerr) {
    let w = Math.floor(ownedBy(o).length / RULES.infTerr) + pactsOf(o).length + (p.stab >= 8 ? 1 : 0) + (S.t[p.capital].o === o ? 1 : 0);
    if (edictOn("embargo") && S.active.target === o) w -= 1;
    return Math.max(0, w);
  }
  let v = 1;
  if (S.t[p.capital].o === o) v += 1;
  v += pactsOf(o).length;
  if (p.stab >= 8) v += 1;
  if (regionsOf(o).length) v += 1;
  if (RULES.infPer) v += Math.floor(ownedBy(o).length / RULES.infPer);
  if (edictOn("embargo") && S.active.target === o) v -= 1;
  return Math.max(0, v);
}

// ===================== Nouvelle partie =====================
function newGame(cfg) {
  S = {
    players: cfg.map((c, i) => ({ name: c.name, ai: c.ai, lvl: (c.lvl || "normal").split("+")[0], pv: (c.lvl || "").split("+")[1] || "", color: c.color, alive: true, inf: 2, stab: 6, capital: -1, lost: false })),
    t: TERR.map(() => ({ o: -1, a: 2 })), cur: 0, round: 1, phase: "politique", reinf: 0, step: 1,
    sel: -1, tgt: -1, mode: null, pending: null, conq: 0, moved: false,
    used: {}, votes: {}, edict: null, lastEdict: null, active: null, pacts: [], log: [], over: false, busy: false, tray: null,
  };
  const np = cfg.length, order = shuffle([...Array(NT).keys()]);
  const neutral = np === 2 ? 8 : 0;
  order.forEach((ti, k) => {
    if (k < neutral) { S.t[ti] = { o: -1, a: 3 }; return; }
    S.t[ti] = { o: (k - neutral) % np, a: 1 };
  });
  S.players.forEach((p, i) => {
    const mine = ownedBy(i);
    // capitale : le territoire le plus « intérieur »
    mine.sort((x, y) => ADJ[y].filter(j => S.t[j].o === i).length - ADJ[x].filter(j => S.t[j].o === i).length);
    p.capital = mine[0];
    S.t[p.capital].a += 2;
    // compensation de l'ordre de jeu : chaque siège après le premier reçoit des armées en plus
    let left = START_ARMIES[np] - mine.length - 2 + i * (np === 2 ? (RULES.duelBonus ?? 4) : 2);
    while (left-- > 0) {
      const border = mine.filter(t => ADJ[t].some(j => S.t[j].o !== i));
      const pool = border.length ? border : mine;
      S.t[pool[rnd(pool.length)]].a++;
    }
  });
  S.edict = drawEdict();
  log(`<span class="r">Manche 1</span>`);
  log(`Le Conseil des Couronnes examine : <b>${S.edict.name}</b>.`);
  render();
  focusStart();
  tokEls.forEach((g, i) => { g.style.setProperty("--d", (MAP.centers[i][0] + MAP.centers[i][1]) * .9 + "ms"); g.classList.add("enter"); });
  setTimeout(() => tokEls.forEach(g => g.classList.remove("enter")), 2200);
  startTurn();
}
function drawEdict() {
  const pool = EDICTS.filter(e => !S.lastEdict || e.id !== S.lastEdict);
  const e = pool[rnd(pool.length)];
  S.lastEdict = e.id;
  return e;
}

// ===================== Déroulement =====================
async function startTurn() {
  if (S.over) return;
  const o = S.cur, p = cur();
  S.phase = "politique"; S.sel = S.tgt = -1; S.mode = null; S.pending = null; S.conq = 0; S.moved = false;
  S.used = { propagande: 0, mercenaires: 0, soudoyer: 0, revolte: 0, pacte: 0 };
  S.turnStart = (S.logN || 0) + 1;
  log(`<b>${esc(p.name)}</b> prend la main.`);
  // sacre : la proclamation faite une manche plus tôt aboutit-elle ?
  if (S.claim && S.claim.o === o) {
    const holds = S.t[p.capital].o === o, ok = holds && p.stab >= CROWN_HOLD;
    S.claim = null;
    if (ok) return victory(o, "politique", `${esc(p.name)} a tenu sa capitale et gardé son peuple derrière elle pendant toute une manche après sa proclamation. Elle est sacrée souveraine de Valdorre.`);
    p.stab = clamp(p.stab - 1, 0, 10);
    log(`👑 Le sacre de ${esc(p.name)} échoue : ${holds ? "son peuple a vacillé" : "sa capitale est tombée"}.`, "warn");
    render();
    if (S.players.some(q => q.alive && !q.ai)) await modal(`<h2>Le sacre est empêché</h2><p>${esc(p.name)} ${holds ? `n'a plus que ${p.stab + 1} de stabilité, sous le seuil de ${CROWN_HOLD}` : "a perdu sa capitale"} : la proclamation tombe. Les ${CROWN_COST} influence de la proclamation sont perdues et sa stabilité baisse de 1.</p>`, [["Continuer", true, "primary"]]);
    if (S.over) return;
  }
  if (!p.lost && p.stab < 7) { p.stab++; log(`Aucune perte : stabilité +1 (${p.stab}).`); }
  p.lost = false;
  const inc = influenceIncome(o);
  p.inf += inc;
  log(`Revenu politique : +${inc} influence (${p.inf}).`);
  // victoire politique
  if (!S.claim && S.t[p.capital].o === o && p.stab >= CROWN_STAB && p.inf >= CROWN_INF && sacreTerrOk(o)) {
    const claim = p.ai ? true : await modal(`<h2>Proclamer ta souveraineté ?</h2><p>Tu tiens ta capitale avec ${p.stab} de stabilité et ${p.inf} influence. La proclamation coûte <b>${CROWN_COST} influence</b>.</p><p>Toutes les Maisons rivales jouent alors une manche complète pour t'arrêter, et chaque territoire perdu pendant cette manche te coûte 1 stabilité. Si, au début de ton prochain tour, tu tiens toujours ta capitale avec au moins <b>${CROWN_HOLD} de stabilité</b>, tu es sacrée et tu gagnes la partie.</p><p class="muted">Échec : l'influence dépensée est perdue et ta stabilité baisse de 1.</p>`, [["Attendre", false], ["Proclamer", true, "primary"]]);
    if (claim) {
      p.inf -= CROWN_COST;
      S.claim = { o, round: S.round }; sfx("sacre");
      chron(o, "♛", `${fullName(o)} proclame sa souveraineté`);
      log(`👑 ${esc(p.name)} proclame sa souveraineté ! Sacre au début de son prochain tour si elle tient ${TERR[p.capital].n} avec ${CROWN_HOLD}+ de stabilité.`, "warn");
      render();
      if (p.ai && S.players.some(q => q.alive && !q.ai)) await modal(`<h2>${esc(p.name)} se proclame souveraine</h2><p>Elle sera sacrée au début de son prochain tour si elle tient encore <b>${TERR[p.capital].n}</b> avec au moins ${CROWN_HOLD} de stabilité.</p><p>Pour l'en empêcher : prends sa capitale, ou fais tomber sa stabilité sous ${CROWN_HOLD}. Chaque territoire qu'elle perd lui coûte 1 stabilité, et les révoltes fomentées en coûtent 1 ou 2.</p>`, [["Aux armes", true, "primary"]]);
    }
  }
  // révoltes
  if (p.stab <= 3) {
    let n = 0;
    for (const t of ownedBy(o)) {
      if (t === p.capital || S.t[t].a > 1) continue;
      if (d6() <= 2) { S.t[t] = { o: -1, a: 2 }; n++; }
    }
    log(n ? `⚠ Instabilité : ${n} territoire(s) de ${esc(p.name)} font sécession.` : `Instabilité : les garnisons tiennent bon.`, "warn");
    if (!ownedBy(o).length) { eliminate(o, -1); return endTurn(); }
  }
  S.reinf = baseIncome(o);
  render();
  if (!p.ai && S.players.filter(q => q.alive && !q.ai).length > 1 && S.lastHuman !== o) {
    await modal(`<h2>À ${esc(p.name)} de jouer</h2><p>Passe l'écran à ${esc(p.name)}. Tu disposes de ${p.inf} influence et de ${S.reinf} armées de renfort.</p>`, [["Je prends la main", true, "primary"]]);
  }
  if (!p.ai) S.lastHuman = o;
  if (p.ai) await aiTurn();
}

function goPhase(ph) {
  S.phase = ph; S.sel = S.tgt = -1; S.mode = null;
  try { $("pbody").scrollTop = 0; } catch (e) {}
  if (ph === "renforts") { S.reinfSnap = { arm: S.t.map(x => x.a), reinf: S.reinf }; S.step = S.reinf > 8 ? 3 : 1; }
  render();
}

async function endTurn() {
  if (S.over) return;
  const o = S.cur, p = cur();
  if (p.alive) {
    if (S.conq >= 1) { const b = RULES.butinPer ? Math.min(S.conq, 3) : 1; p.inf += b; log(`Butin de guerre : +${b} influence.`); }
    if (S.conq >= 4) { p.stab = clamp(p.stab - 1, 0, 10); log(`Surextension (${S.conq} conquêtes) : stabilité −1.`); }
    if (ownedBy(o).length >= DOMINATION) return victory(o, "militaire", `${esc(p.name)} contrôle ${ownedBy(o).length} territoires sur ${NT}.`);
  }
  let n = S.cur, wrapped = false;
  do { n = (n + 1) % S.players.length; if (n === 0) wrapped = true; } while (!P(n).alive);
  const g = S;
  if (wrapped || n <= S.cur) await endRound();
  if (S !== g || S.over) return;
  S.cur = n;
  startTurn();
}

async function endRound() {
  if (S.round >= MAX_ROUNDS) {
    const ranked = alive().sort((a, b) => reignScore(b) - reignScore(a) || P(b).inf - P(a).inf);
    const w = ranked[0];
    victory(w, "au Conseil", `Après ${MAX_ROUNDS} manches, le Conseil des Couronnes tranche : ${esc(P(w).name)} a le règne le plus solide (${reignScore(w)} points : ${ownedBy(w).length} territoires, ${regionsOf(w).reduce((t, r) => t + REGIONS[r].bonus, 0)} de bonus de régions${S.t[P(w).capital].o === w ? ", capitale tenue" : ""}).`);
    return;
  }
  const e = S.edict;
  let pour = 0, contre = 0;
  const lines = [];
  for (const [k, v] of Object.entries(S.votes)) {
    if (v.side === "pour") pour += v.w; else if (v.side === "contre") contre += v.w;
    lines.push(`${esc(P(+k).name)} : ${v.side === "pour" ? "pour" : v.side === "contre" ? "contre" : "abstention"}${v.w ? ` (${v.w} ⚜)` : ""}`);
  }
  const dp = d6(), dc = d6();
  const pass = pour + dp > contre + dc;
  S.tray = { kind: "vote", dp, dc, pour, contre, pass }; sfx("conseil");
  log(`<span class="r">Conseil des Couronnes</span>`);
  log(`${e.name} : pour ${pour}+🎲${dp} = ${pour + dp} contre ${contre}+🎲${dc} = ${contre + dc} → <b>${pass ? "ADOPTÉ" : "REJETÉ"}</b>.`);
  (S.hist ||= []).push(S.players.map((q, i) => ownedBy(i).length));
  { const h = S.hist[S.hist.length - 1], best = Math.max(...h), top = h.indexOf(best);
    if (h.filter(v => v === best).length === 1 && top !== S.lead) { if (S.lead !== undefined) chron(top, "⚑", `${fullName(top)} prend la tête (${best} territoires)`); S.lead = top; } }
  S.round++;
  S.active = null;
  let extra = "";
  if (pass) {
    if (e.id === "amnistie") { alive().forEach(i => P(i).stab = clamp(P(i).stab + 2, 0, 10)); extra = "Toutes les Maisons gagnent +2 stabilité."; }
    else if (e.id === "marchands") { const rich = alive().sort((a, b) => P(b).inf - P(a).inf)[0]; alive().forEach(i => { if (i !== rich) P(i).inf += 2; }); extra = `Toutes les Maisons gagnent +2 influence, sauf ${esc(P(rich).name)}.`; }
    else if (e.id === "impot") { alive().forEach(i => P(i).stab = clamp(P(i).stab - 1, 0, 10)); S.active = { id: e.id, round: S.round, name: e.name }; extra = "Toutes les Maisons perdent 1 stabilité."; }
    else {
      S.active = { id: e.id, round: S.round, name: e.name };
      if (e.id === "embargo") { S.active.target = leader(); extra = `Cible : ${esc(P(S.active.target).name)}.`; }
      if (e.id === "levee") { const b2 = alive().filter(i => !regionsOf(i).length); extra = b2.length ? `Bénéficiaires : ${b2.map(i => esc(P(i).name)).join(", ")}.` : "Aucune Maison n'en profite."; }
    }
    if (extra) log(extra);
  }
  // expiration des pactes
  const expired = S.pacts.filter(p => p.until < S.round);
  expired.forEach(p => log(`Le pacte entre ${esc(P(p.a).name)} et ${esc(P(p.b).name)} arrive à son terme.`));
  S.pacts = S.pacts.filter(p => p.until >= S.round);
  S.votes = {};
  if (S.nextEdict) { const ne = S.nextEdict; S.edict = EDICTS.find(x => x.id === ne.id); S.lastEdict = ne.id; S.edict = { ...S.edict, by: ne.by }; S.nextEdict = null; }
  else S.edict = drawEdict();
  log(`<span class="r">Manche ${S.round}</span>`);
  log(`Le Conseil examine : <b>${S.edict.name}</b>.`);
  render();
  if (S.players.some(p => p.alive && !p.ai)) {
    await modal(`<h2>Le Conseil a tranché</h2>
      <p><b>${e.name}</b> : ${e.d}</p>
      <p class="muted small">${lines.length ? lines.join(" · ") : "Aucune Maison n'a voté."}</p>
      <div class="row" style="gap:18px;margin:8px 0">
        <div class="row"><span>Pour ${pour}</span>${dieHTML(dp, "pol")}<b>= ${pour + dp}</b></div>
        <div class="row"><span>Contre ${contre}</span>${dieHTML(dc, "def")}<b>= ${contre + dc}</b></div>
      </div>
      <p style="font-family:var(--f-display);font-size:18px;color:${pass ? "#3d6b2a" : "#8a2a20"}">${pass ? "Édit adopté" : "Édit rejeté"}</p>
      ${extra ? `<p>${extra}</p>` : ""}
      <p class="muted">Manche ${S.round} : le Conseil examinera <b>${S.edict.name}</b>.</p>`, [["Continuer", true, "primary"]]);
  }
}

// score de fin de règne : territoires + bonus des régions + 3 si la capitale est tenue + influence / 3
function reignScore(o) { return ownedBy(o).length + regionsOf(o).reduce((t, r) => t + REGIONS[r].bonus, 0) + (S.t[P(o).capital].o === o ? 3 : 0) + Math.floor(P(o).inf / 3); }
function eliminate(o, by) {
  const p = P(o);
  p.alive = false;
  if (S.claim && S.claim.o === o) S.claim = null;
  S.pacts = S.pacts.filter(x => x.a !== o && x.b !== o);
  chron(by >= 0 ? by : o, "☠", `${fullName(o)} est éliminée${by >= 0 ? ` par ${laName(by)}` : ""}`);
  log(`☠ ${esc(p.name)} est éliminée${by >= 0 ? ` par ${esc(P(by).name)}` : ""}.`, "warn");
  if (by >= 0) { P(by).inf += p.inf; if (p.inf) log(`${esc(P(by).name)} s'empare de son trésor (+${p.inf} influence).`); }
  p.inf = 0;
  const left = alive();
  if (left.length === 1) victory(left[0], "militaire", `${esc(P(left[0]).name)} est la dernière Maison debout.`);
}

// petite chronique : territoires de chaque Maison, manche après manche
function chronicleSVG() {
  const H = (S.hist || []).concat([S.players.map((q, i) => ownedBy(i).length)]);
  if (H.length < 2) return "";
  // sur téléphone, un repère plus étroit : le dessin est moins réduit et les textes restent lisibles (~10-11 px au lieu de ~6)
  const narrow = typeof window !== "undefined" && window.innerWidth < 600, fs = narrow ? 12 : 11;
  const W = narrow ? 330 : 560, Hh = narrow ? 190 : 175, pad = 28, x0 = pad + 12, maxT = Math.max(...H.flat(), 10);
  const x = k => x0 + k * (W - x0 - 8) / (H.length - 1), y = v => Hh - 20 - v * (Hh - 60) / maxT;
  const grid = [0, Math.round(maxT / 2), maxT].map(v => `<line x1="${pad}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="#b79d70" stroke-width=".6"/><text x="${pad - 6}" y="${y(v) + 4}" text-anchor="end" font-size="${fs}" fill="#6e5838">${v}</text>`).join("");
  const lines = S.players.map((p, i) => { const c = PCOL[p.color]; const pts = H.map((r, k) => `${x(k).toFixed(1)},${y(r[i]).toFixed(1)}`).join(" "); const last = H[H.length - 1][i]; const dash = ["", "7 3", "2 3", "", "9 3 2 3"][p.color]; return `<polyline points="${pts}" fill="none" stroke="${c.c}" stroke-width="${p.color === 3 ? 3.4 : 2.4}" stroke-dasharray="${dash}" stroke-linejoin="round"/><circle cx="${x(H.length - 1)}" cy="${y(last)}" r="3.5" fill="${c.c}" stroke="#2b1d10" stroke-width=".8"/>`; }).join("");
  // moments clés : on garde d'abord les événements marquants, puis les changements de tête, au plus 7
  let ev = (S.ev || []).slice();
  while (ev.length > 7) { const k = ev.findIndex(e => e.i === "⚑"); ev.splice(k >= 0 ? k : 0, 1); }
  const marks = ev.map(e => { const k = clamp(e.r - 1, 0, H.length - 1), v = H[k][e.o] ?? 0, c = PCOL[P(e.o).color]; const up = 13 + 18 * (ev.slice(0, ev.indexOf(e)).filter(q => q.r === e.r).length % 2); return `<g transform="translate(${x(k).toFixed(1)},${y(v).toFixed(1)})"><line y2="${-up}" stroke="${c.c}" stroke-width="1"/><circle r="2.2" fill="${c.c}"/><g transform="translate(0,${-up})"><circle r="8.5" fill="#f3e8cc" stroke="${c.c}" stroke-width="1.8"/><text y="4.3" text-anchor="middle" font-size="12" font-family="serif" fill="#2b1d10">${e.i}\uFE0E</text></g></g>`; }).join("");
  const list = ev.length ? `<ul class="chron">${ev.map(e => `<li><span class="cr">M. ${e.r}</span> <span class="ci">${e.i}\uFE0E</span> ${e.t}</li>`).join("")}</ul>` : "";
  return `<h3>Chronique du règne</h3><svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Territoires par Maison au fil des manches">${grid}${lines}${marks}<text x="${W - 8}" y="${Hh - 4}" text-anchor="end" font-size="${fs}" fill="#6e5838">manche ${H.length}</text><text x="${x0}" y="${Hh - 4}" font-size="${fs}" fill="#6e5838">manche 1</text></svg>
    <div class="row small" style="gap:12px;margin-top:2px">${S.players.map((p, i) => `<span>${shieldSVG(i, 12)} ${esc(p.name.replace(/^Maison (d')?/i, ""))}</span>`).join("")}</div>${list}`;
}
// moments clés de la partie (affichés dans la chronique de fin) ; n'influence aucune règle
function chron(o, icon, txt) {
  if (!S) return; S.ev ||= [];
  if (icon === "♜" && S.ev.some(e => e.t === txt)) return;   // une capitale qui change de mains plusieurs fois : on ne le raconte qu'une fois
  S.ev.push({ r: S.round, o, i: icon, t: txt });
}
const shortName = o => esc(P(o).name.replace(/^Maison (d')?/i, ""));
const fullName = o => esc(P(o).name), laName = o => "la " + esc(P(o).name);
function victory(o, kind, why) {
  S.over = true; S.busy = false;
  log(`👑 Victoire ${kind} de ${esc(P(o).name)} !`, "warn");
  render();
  S.sel = S.tgt = -1; S.mode = null; renderMap();
  const rows = S.players.map((p, i) => `<tr><td>${shieldSVG(i, 13)} ${esc(p.name)}</td><td>${ownedBy(i).length}</td><td>${armiesOf(i)}</td><td>${p.inf}</td><td>${p.stab}</td><td>${p.alive ? "" : "éliminée"}</td></tr>`).join("");
  modal(`<h2>${esc(P(o).name)} règne sur Valdorre</h2><p><b>Victoire ${kind}.</b> ${why}</p><p class="muted">Manche ${S.round}.</p>
    ${chronicleSVG()}
    <table class="rt"><tr><th>Maison</th><th>Terr.</th><th>Armées</th><th>⚜</th><th>Stab.</th><th></th></tr>${rows}</table>`,
    [["Rejouer", "new", "primary"], ["Voir la carte", false]]).then(v => { if (v === "new") setupDialog(); });
}

// ===================== Combat =====================
function canAttack(f, t, o = S.cur) {
  if (f < 0 || t < 0 || firstTurnLock(o)) return false;
  const F = S.t[f], T = S.t[t];
  if (F.o !== o || T.o === o || F.a < 2 || !ADJ[f].includes(t)) return false;
  if (pactBetween(o, T.o)) return false;
  if (edictOn("treve") && capitalOf(t) >= 0) return false;
  return true;
}
// la Maison qui ouvre la partie ne peut pas attaquer pendant la première manche
function firstTurnLock(o) { return S.round === 1 && o === 0; }
function battle(f, t) {
  const F = S.t[f], T = S.t[t], att = F.o, def = T.o;
  const na = Math.min(3, F.a - 1), nd = Math.min(2, T.a);
  const A = Array.from({ length: na }, d6).sort((x, y) => y - x);
  const D = Array.from({ length: nd }, d6).sort((x, y) => y - x);
  const mA = edictOn("conquete") ? 1 : 0;
  const mD = (capitalOf(t) === def && def >= 0 ? 1 : 0) + (edictOn("martiale") ? 1 : 0);
  let la = 0, ld = 0;
  const lostA = [], lostD = [];
  for (let i = 0; i < Math.min(na, nd); i++) {
    const a = A[i] + (i === 0 ? mA : 0), d = D[i] + (i === 0 ? mD : 0);
    if (a > d) { ld++; lostD.push(i); } else { la++; lostA.push(i); }
  }
  F.a -= la; T.a -= ld;
  if (la) floatText(f, "−" + la, "loss"); if (ld) floatText(t, "−" + ld, "loss");
  strikeFX(f, t, att, ld > 0 && T.a > 0);
  sfx("des");
  S.tray = { kind: "battle", A, D, mA, mD, lostA, lostD, txt: `${TERR[f].n} → ${TERR[t].n} : l'attaquant perd ${la}, le défenseur perd ${ld}.` };
  if (def >= 0 && ld) P(def).lost = true;
  if (T.a <= 0) { conquer(f, t, na); flash(t); return true; }
  return false;
}
function conquer(f, t, minMove) {
  const F = S.t[f], T = S.t[t], o = F.o, prev = T.o;
  const mv = Math.min(minMove, F.a - 1);
  T.o = o; T.a = mv; F.a -= mv;
  S.conq++;
  plantFlag(t, o); sfx("conquete");
  log(`${esc(P(o).name)} s'empare de <b>${TERR[t].n}</b>${prev >= 0 ? ` (${esc(P(prev).name)})` : " (rebelles)"}.`);
  if (prev >= 0) {
    P(prev).lost = true;
    shakeClaim(prev);
    if (P(prev).capital === t) {
      P(prev).stab = clamp(P(prev).stab - 3, 0, 10);

// Plateau de table : veines de noyer calculées une seule fois en petite image répétée (aucun coût à l'affichage)
function bakeTable() {
  const b = $("board"); if (!b || !window.Image) return;
  const N = 384, src = `<svg xmlns="http://www.w3.org/2000/svg" width="${N}" height="${N}"><filter id="w" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".0045 .085" numOctaves="4" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .27  0 0 0 0 .175  0 0 0 0 .1  1.9 0 0 0 -.5"/></filter><rect width="${N}" height="${N}" fill="#160f0a"/><rect width="${N}" height="${N}" filter="url(#w)"/></svg>`;
  const img = new Image();
  img.onload = () => { try { const c = document.createElement("canvas"); c.width = c.height = N; c.getContext("2d").drawImage(img, 0, 0);
    b.style.backgroundImage = `radial-gradient(ellipse at 50% 45%,rgba(43,30,21,.15),rgba(12,8,5,.85) 85%),url(${c.toDataURL("image/png")})`; b.style.backgroundSize = `auto,${N}px ${N}px`; } catch (e) {} };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(src);
}
function initZoom() {
  try { bakeTextures(); bakeTable(); } catch (e) {}
  const m = $("map");
  m.addEventListener("wheel", e => { e.preventDefault(); const p = svgPt(e.clientX, e.clientY); zoomAt(e.deltaY > 0 ? 1.15 : 1 / 1.15, p.x, p.y); }, { passive: false });
  // pincement à deux doigts (téléphone, pavé tactile)
  const ptrs = new Map(); let pinch = null, lastTap = 0;
  const startPinch = () => {
    const [a, b] = [...ptrs.values()], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    pinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, w0: vb.w, p: svgPt(mx, my) }; drag = null;
  };
  m.addEventListener("pointerdown", e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { startPinch(); return; }
    if (e.button === 0 && ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, vx: vb.x, vy: vb.y, moved: false };
  });
  window.addEventListener("pointermove", e => {
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      vb.w = clamp(pinch.w0 * pinch.d0 / d, VB0.w / 3.2, VB0.w); vb.h = vb.w / mapAR();
      if (!geo) measureGeo();
      const per = geo.s0 * cvb.w / vb.w;
      vb.x = pinch.p.x - (mx - geo.left - geo.ox) / per; vb.y = pinch.p.y - (my - geo.top - geo.oy) / per;
      justDragged = true; applyVB(); return;
    }
    if (!drag || vb.w >= VB0.w - 1) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 6) return;
    drag.moved = true; m.classList.add("dragging");
    if (!geo) measureGeo();
    const k = vb.w / (cvb.w * geo.s0);
    vb.x = drag.vx - dx * k; vb.y = drag.vy - dy * k; applyVB();
  });
  const up = e => {
    ptrs.delete(e.pointerId);
    if (pinch) { if (ptrs.size < 2) { pinch = null; setTimeout(() => justDragged = false, 0); } return; }
    if (drag && drag.moved) { justDragged = true; setTimeout(() => justDragged = false, 0); }
    else if (e.pointerType === "touch" && drag) {
      // double appui au doigt : zoom (le dblclick n'est pas fiable sur écran tactile)
      const now = performance.now();
      if (now - lastTap < 300) { const p = svgPt(e.clientX, e.clientY); zoomAt(vb.w < VB0.w / 2.6 ? 3 : 1 / 1.7, p.x, p.y); lastTap = 0; } else lastTap = now;
    }
    drag = null; m.classList.remove("dragging");
  };
  window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  m.addEventListener("click", e => { if (justDragged) { e.stopPropagation(); e.preventDefault(); } }, true);
  m.addEventListener("dblclick", e => { const p = svgPt(e.clientX, e.clientY); zoomAt(1 / 1.6, p.x, p.y); });
  $("zIn").onclick = () => zoomCenter(1 / 1.3); $("zOut").onclick = () => zoomCenter(1.3); $("zReset").onclick = () => { vb = { ...VB0 }; applyVB(true); $("zIn").focus(); };   // ⤢ disparaît en vue d'ensemble : le focus passe à +
  let rzT = 0;
  window.addEventListener("resize", () => { geo = null; arCache = 0; placeShadow(); clearTimeout(rzT); rzT = setTimeout(() => {
    const ar = mapAR(), cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2;
    if (Math.abs(vb.w / vb.h - ar) < 1e-3) return labelScale();   // proportions inchangées (ordinateur) : rien à redessiner
    clampVB(); vb.x = cx - vb.w / 2; vb.y = cy - vb.h / 2; applyVB(true); }, 120); });
  m.addEventListener("contextmenu", e => { if (tapType === "touch") e.preventDefault(); });
  // tiroir du panneau (téléphone)
  $("drawer").onclick = () => setDrawer(!$("aside").classList.contains("open"));
  // fiche de territoire au doigt : appui long n'importe quand, ou appui qui ne déclenche aucune action
  let lp = null;
  const hideTip = () => { $("tip").style.display = "none"; };
  m.addEventListener("pointerdown", e => {
    hideTip(); tapType = e.pointerType; lpFired = false;
    clearTimeout(lp && lp.t); lp = null;
    if (e.pointerType !== "touch") return;
    const i = terrAt(e.target); if (i < 0) return;
    const x = e.clientX, y = e.clientY;
    lp = { x, y, t: setTimeout(() => { lpFired = true; tip({ clientX: x, clientY: y }, i, true); }, 480) };
  });
  window.addEventListener("pointermove", e => { if (e.pointerType === "mouse") tapType = "mouse"; if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 8) { clearTimeout(lp.t); lp = null; } });
  const lpEnd = () => { if (lp) clearTimeout(lp.t); lp = null; if (lpFired) setTimeout(() => lpFired = false, 400); };
  window.addEventListener("pointerup", lpEnd); window.addEventListener("pointercancel", lpEnd);
  m.addEventListener("click", e => { if (lpFired) { e.stopPropagation(); e.preventDefault(); } }, true);
  placeShadow(); setTimeout(placeShadow, 300);
  $("legBtn").onclick = () => { const L = $("legend"); L.classList.toggle("closed"); $("legBtn").setAttribute("aria-expanded", !L.classList.contains("closed")); };
  $("legend").onclick = () => $("legBtn").click();
  $("legend").title = "Cliquer pour masquer";
  if (window.innerWidth < 1350) $("legend").classList.add("closed");
}

// ===================== Trousse de test (outils-communs/testkit.js) =====================
let TK = null;
function initTestkit() {
  if (typeof Testkit === "undefined") return;
  TK = Testkit({
    jeu: "couronnes", secours: true, canvas: () => document.createElement("canvas"), capture: () => svgCapture($("map")),
    etat: () => S && { manche: S.round, phase: S.phase, joueur: S.cur, fin: S.over, zoom: +(VB0.w / vb.w).toFixed(2),
      maisons: S.players.map((p, i) => ({ nom: p.name, ia: p.ai, niveau: p.lvl, terr: ownedBy(i).length, armees: armiesOf(i), inf: p.inf, stab: p.stab, vivante: p.alive })) },
  });
  const b = TK.bouton($("hbtnTK"), " ");
  b.title = "Signaler un problème à Claude (capture de la carte + état de la partie)";
}
// banc de mesure sur l'appareil : tour d'IA, zoom continu, carte au repos (5 s chacun), résultats envoyés à Claude
async function runBanc() {
  $("modal").classList.add("hidden");
  if (S) S.over = true;
  await wait(500);
  TK.modeTest();
  TK.surSuspension = () => { try { $("tip").style.display = "none"; } catch (e) {} };
  $("speed").value = "320";
  newGame([0, 1, 2, 3].map(i => ({ name: HOUSES[i], ai: true, lvl: "ruse", color: i })));
  let zoomOn = false;
  const loop = () => { if (!zoomOn) return; const k = performance.now() / 1000; vb.w = VB0.w / (1.8 + .6 * Math.sin(k * 1.3)); vb.x = VB0.x + 220 + 160 * Math.sin(k * .8); vb.y = VB0.y + 130 + 90 * Math.cos(k * .9); applyVB(); requestAnimationFrame(loop); };
  const res = await TK.banc([
    { nom: "tour de l'IA", preparer: async () => {} },
    { nom: "zoom et déplacement", preparer: async () => { zoomOn = true; requestAnimationFrame(loop); } },
    { nom: "carte au repos", preparer: async () => { zoomOn = false; S.over = true; vb = { ...VB0 }; applyVB(true); } },
  ], 5000);
  const rows = res.res.map(r => `<tr><td>${esc(r.scene)}</td><td>${r.fps ?? "—"}</td><td>${r.bas1 ?? "—"}</td><td>${r.pire ?? "—"} ms${r.masquee ? " ⚠" : ""}</td></tr>`).join("");
  await modal(`<h2>Banc de mesure</h2><p class="muted">${esc(res.gpu)} · ${esc(res.ecran)}</p>
    <table class="rt"><tr><th>Scène</th><th>img/s</th><th>1 % les plus lents</th><th>pire image</th></tr>${rows}</table>
    ${res.res.some(r => r.masquee) ? `<p class="muted">⚠ Le navigateur a suspendu l'affichage pendant une mesure (fenêtre masquée ou en arrière-plan) : garde le jeu visible pendant les 25 secondes du banc.</p>` : ""}
    <p>${res.enregistre ? "Résultats envoyés à Claude ✓" : "Résultats gardés sur cet appareil (envoi impossible ici)."}</p>`, [["Nouvelle partie", true, "primary"]]);
  setupDialog();
}

// ===================== Lancement =====================
function boot(data) {
  try { initTestkit(); } catch (e) {}
  buildBoard();
  initZoom();
  $("btnRules").onclick = () => rulesDialog();
  $("btnNew").onclick = () => setupDialog();
  try { soundOn = localStorage.getItem("cc-son") === "1"; } catch (e) {}
  const sb = $("btnSound"); const paint = () => { sb.textContent = soundOn ? "🔈" : "🔇"; sb.title = soundOn ? "Sons activés (cliquer pour couper)" : "Sons coupés (cliquer pour activer)"; sb.setAttribute("aria-label", sb.title); sb.setAttribute("aria-pressed", soundOn); };
  paint(); sb.onclick = () => { soundOn = !soundOn; try { localStorage.setItem("cc-son", soundOn ? "1" : "0"); } catch (e) {} paint(); sfx("conseil"); };
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S && !cur().ai && $("modal").classList.contains("hidden")) { S.sel = S.tgt = -1; S.mode = null; render(); } });
  window.claude?.hot?.snapshot?.(() => lastSnap ? { S: JSON.parse(lastSnap) } : {});
  if (data && data.S && !data.S.over) { S = data.S; S.busy = false; render(); return; }
  // partie de démonstration en arrière-plan, puis écran de configuration
  newGame([0, 1, 2, 3].map(i => ({ name: HOUSES[i], ai: i > 0, color: i })));
  setupDialog();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
